
[Proxies]
# Proxies for required interfaces
#Webots2Robocomp = "webots2robocomp:tcp -h localhost -p 15010"
Webots2Robocomp = "webots2robocomp:tcp -h localhost -p 10006"

# --- Common Agent Data ---
[Agent]
id = 10  # Change id
name = "bottle_concept"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree =false
graph = false   # headless perception agent: the shared DSR node-link viewer crashes in paintAndFlush under participant churn (QRegion::~QRegion). Same fix as retina.
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Period]
Compute = 100
Emergency = 500

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

# ── Agent-presence protocol ───────────────────────────────────────────────────
[Presence]
# ★retina REMOVED from required 2026-08-15. It was the only agent that hard-required the mask
# producer, so a producer that was down or renamed kept bottle_concept in Waiting forever — presence
# name resolution is exact-match and one-shot, so an unresolved name pins required_ready false with no
# recovery. The protection it was providing is already covered, and covered better, by the primary-input
# stream gate below (Media.MasksStallTimeoutMs): that keys on mask_frame_id actually ADVANCING rather
# than on an agent being present, so it also catches a producer that is alive but stalled — which the
# presence entry never could. Put it back only if something needs the producer at STARTUP specifically.
required_agent_names = ["robot_concept", "room_concept"]
config_dir = "etc"
monitor_period_ms = 500
heartbeat_timeout_ms = 25000   # was 3000 — ride through the retina's churn-crash auto-restart (latent Eigen-align SIGBUS) instead of self-shutting-down before it rejoins
rejoin_grace_ms = 8000         # was 1500
stale_grace_ms = 120000
agent_info_period_ms = 1000

# Owned graph nodes torn down on shutdown / peer-loss. "bottle*" matches every
# cylinder this agent scaffolds (bottle_1, bottle_2, …) so none survive a restart.
[Owns]
nodes = ["bottle_concept 10", "bottle*"]

# ── Static ground-truth evaluation (Webots) ───────────────────────────────────
# Logs per-cycle position/size error and NEES (eᵀP⁻¹e) of the bottle tracker vs
# the Webots ground truth. With GtSource="webots" the bottle's pose is read live
# via getObjectPose and expressed in the room frame (one-shot — the bottle is static).
[Eval]
Enabled  = true
GtSource = "webots"            # "webots" (live getObjectPose) | "config" (manual Gt* below)
LogPath  = "etc/bottle_fulltable2_eval.csv"
BottleDef = "bottle"           # Webots DEF in shadow_arm.wbt
RobotDef  = "shadow"           # Webots DEF of the Shadow robot (== DSR body frame)

# Bottle dimensions: getObjectPose returns POSE only, so size GT comes from the proto.
# GtHeight also sets the base→centre Z lift, so it must match the WaterBottle proto.
# ⚠ VERIFY against shadow_arm.wbt's WaterBottle (these are the WaterBottleOpaque values).
# Scene bottle is the cyberbotics WaterBottle (Evian MESH, shadow_arm.wbt) — NOT WaterBottleOpaque.
# Data-driven best-fit cylinder (2026-06-20): radius 0.047 (depth 0.050 + mask 0.046), body height ~0.23.
GtRadius = 0.031
GtHeight = 0.20

# Manual room-frame centre fallback, used only when GtSource = "config".
GtCx = 0.0
GtCy = 0.0
GtCz = 0.0

# ── Moving-bottle validation experiment ──────────────────────────────────────
# When on, the agent drives the real bottle across the table in Webots (setObjectPose) through a
# MoveGridN×MoveGridN grid centred on its start pose, holding each pose MoveSettleCycles compute
# cycles so the fitted model converges, and logs fit-vs-GT (pose + shape) every cycle to LogPath.
# Returns the bottle home when done. Forces Enabled=true.
MoveExperiment   = false   # sweep off — normal operation
MoveGridN        = 5       # (unused in absolute mode)
MoveStep         = 0.16    # grid spacing, metres (world frame)
# Absolute-world grid over the ZED-visible table (table top z=0.74, world X∈[0.1,0.9] Y∈[-1.1,0.7]).
# Camera ~(-0.22,-0.38,0.98), HFOV 1.9198 rad (~110°) looking +x/down. Sweep near→far × left→right
# incl. the +y/right side; out-of-view corners self-exclude (no detection). ~5×9 = 45 poses.
MoveAbsolute     = false
MoveXmin         = 0.22
MoveXmax         = 0.86
MoveYmin         = -0.95
MoveYmax         = 0.35
MoveSettleCycles = 45      # (continuous mode only) — extra time after the candidate-gated re-seed
# Static-restart validation: ONE grid pose per run (env BOTTLE_TEST_POSE), fresh agent each time
# (no cross-pose accumulation). Driven by bottle_static_test.sh. Real scenario = static-until-grasped.
StaticPoseTest   = false   # sweep mode: MoveExperiment drives the grid (StaticPoseTest would pin pose 0)

# ── Scene setup: place the real bottle on start (Webots WORLD coords) ──────────
# When on, the bottle is teleported once at startup to (PlaceBottleWorldX, PlaceBottleWorldY)
# in Webots world (X+ front, Y+ right; z + orientation kept), so it sits on the arm's side and
# the reaching arm occludes the camera less. Takes precedence over Eval.StaticPoseTest /
# MoveExperiment (those also move the bottle). Set false to run the grid-validation drivers.
[Scene]
PlaceBottleOnStart = true    # bottle at grasp home (normal)
PlaceBottleWorldX  = 0.438    # m, Webots world (+X front) — EXPERIMENT INITIAL POSITION (logged 2026-06-20)
PlaceBottleWorldY  = -0.575   # m, Webots world (+Y right). reach 0.648 m from arm base. (Verify perception:
                              # -0.45 was rejected by YOLO tray-mask earlier; confirm conf>0 at this spot.)

# Demote Operating→Degraded→Waiting when the retina's `masks` node stops advancing its mask_frame_id for
# this long (producer dead/stalled) — don't integrate stale evidence; re-admit automatically when it returns
# (peers stay intact, so the agent never shuts down). Orthogonal to AI2AgeNominalDtS (belief-axis Σ-aging).
# MUST exceed the retina HOLD_ENTER_S so a legitimately empty scene (counter still advancing) never trips.
[Media]
MasksStallTimeoutMs = 3000   # 0 = disable the stall gate

# ── bottle_concept agent ──────────────────────────────────────────────────────
[BottleConcept]
KStable = 30
DivergedRetireFrames = 20          # retire an instance after N consecutive no-data (belief energy==0) fits; 0=off
MaxStepM = 0.5                     # reject a frame whose net centre move exceeds this (m) — a corrupted cloud can teleport the fit, a bottle can't; 0=off
LogPeriodFrames = 30
SupportBankMaxPoints = 4000
SupportBankQuantizationM = 0.01      # dedup grid (m) for the support-bank hash
SupportSelectRadiusMarginM = 0.04    # XY ownership gate margin around the bottle
SupportSelectHeightMarginM = 0.10    # extra Z margin above/below the cylinder span
YawVariance = 9.87                 # ≈π² — yaw is unobservable for a symmetric cylinder

[BottleModel]
# Full-covariance recursive-Laplace belief over [cx,cy,cz,radius,height] on the shared engine
# (bottle_belief.h) — the ONLY fit path, mirroring table/chair. Static single cylinder; a moved bottle is
# re-acquired via the tracker gate widening on stale predicts.
PriorRadius = 0.031       # cyberbotics BeerBottle (Heineken) body radius — naturally 62mm (no mesh distortion), well-detected by YOLO. height ~0.20 body.
PriorHeight = 0.20
PriorSizeStd = 0.03
SdfThresholdForStorage = 0.03   # admit points within 3 cm of the surface into the support bank
MaskPrecision = 500.0     # RGB-mask occluding-contour silhouette likelihood weight (0=off); pins the depth-degenerate radius the symmetric-cylinder SDF cannot.
AI2SigmaBaseM = 0.02          # base on-surface obs noise std (m); R = σ²
AI2ClutterFrac = 0.10         # ε: uniform clutter mixture weight
AI2ClutterScaleM = 0.08       # a point further than ~this from the surface is likely clutter
AI2PriorPosStd = 0.30         # broad position prior std (m) on cx,cy,cz
AI2PriorSizeStd = 0.03        # broad size prior std (m) on radius,height
AI2ProcessStdM = 0.005        # predict process-noise std, all 5 length DOFs (m/frame)
AI2AgeNominalDtS = 0.0        # stale-belief aging: mask nominal period (s). >0 ⇒ unseen bottle's POSITION Σ grows by Q·(dt/this) on the agent clock (measurement-age→covariance); 0 = historic 1-Q-per-unseen-cycle. Try 0.1.
AI2CommonModePosStd = 0.02    # per-frame SHARED position error (m); pose-chain cov adds → Σ saturates (calibrated)
AI2CommonModeSizeStd = 0.01   # per-frame SHARED size error radius,height (m)
MotionCmPosGain = 0.10        # ego-motion→common-mode: position (cx,cy) shared-error std per m/s of motion_dotd. CONTINUOUS "be still to UPDATE, else CONFIRM" fixation; 0 = off.
MotionCmSizeGain = 0.20       # ego-motion→common-mode: size (radius,height) shared-error std per m/s — the anti-RESHAPE lever (a moving frame confirms but can't grow/shrink the bottle). 0 = off.
# ── Ego-motion DISCRETE "confirm-only" gate (mirrors refrigerator/chair confirm_only) ─────────────────────
# When the robot is clearly MOVING the fit takes a PREDICT-ONLY branch (Σ inflates, geometry mean HELD) so a
# motion-smeared mask may only CONFIRM a converged bottle, never move/reshape it (correct: a static bottle loses
# nothing by not updating while moving). Complements the CONTINUOUS common-mode above (the graceful backstop).
# motion_magnitude = max(|motion_dotd|, ego_lin_mps + AI2AngLeverM·ego_ang_radps) — producer-independent motion.
AI2MotionConfirmOnly = true   # master switch for the discrete gate (false = continuous common-mode only)
AI2StillLinMps = 0.05         # camera linear speed (m/s) below which the robot counts as "still"
AI2StillAngRadps = 0.10       # camera angular speed (rad/s) below which the robot counts as "still"
AI2StillDotd = 0.05           # per-mask ego-motion corruption speed (m/s) still-level
AI2AngLeverM = 2.0            # rad/s → m/s lever (tangential speed of a bottle ~this far away) for ego-motion
AI2GnIters = 4                # Gauss-Newton iterations per frame
AI2CsvPath = "etc/bottle_ai2_log.csv"   # per-cycle AI2 belief CSV (state + Σ diag); empty = off

# ── YOLO-INDEPENDENT LiDAR first-hit range channel (common/ai_belief/lidar_ray_factor.h) ──────────────────
# Second, sensor-INDEPENDENT evidence: lidar3D returns on the bottle pin cx,cy in METRIC DEPTH + radius along
# the viewing ray (the direction the monocular mask/silhouette is blind to). Consumes the lidar3D media plane
# (bottle_lidar_ingestor). STAGED ROLLOUT — OFF (0.0) by default; the media subscriber isn't created at all
# while off. Step 1: set LidarPrecision=500 (low → can only nudge) and confirm on the console
# "[BottleLidar] media subscriber up", NO crash, and the AI2 log/print shows lidar_rays>0 at a few-cm
# lidar_resid_m (frame is right). Step 2: raise to 2500 (≈1/σ² = depth-point scale) → depth stable, the
# radius/centre runaway arrested.
LidarPrecision = 2500.0       # load-bearing (= depth-point weight, 1/σ²@2cm). 0=OFF
LidarRobustCM = 0.05          # Cauchy scale (m): returns this far off the surface fade out (continuous, no gate)
LidarSelectMarginM = 0.06     # pre-select returns within radius+margin (horiz) and h/2+margin (vert)
# ── Range-scaled precision: precise when CLOSE (manipulation), left UNTOUCHED when far ──────────────────────
# Observation precision fades continuously with the camera→object distance (no gate): beyond RangeNearM, R
# grows as (range/near)^power so distant/receding objects hold their last estimate (fixes the "one bottle
# dilates/shrinks" — a far, LiDAR-starved bottle stops being yanked). Inside RangeNearM (grasp range) it gets
# full precision and sharpens. LidarCoverageN0 down-weights sparse LiDAR (few noisy returns must not swing r).
RangeNearM = 0.6              # full precision within this sensing distance (m); ~manipulation reach. 0=disable
RangePrecisionPower = 2.0     # how fast precision fades beyond RangeNearM: R *= (range/near)^power
LidarCoverageN0 = 25.0        # LiDAR ray count for full weight; fewer → proportionally down-weighted

# YOLO detection-score → observation precision: w = clamp01((conf−floor)/(ref−floor))^power scales the
# silhouette precision so a weak mask can't over-tighten radius. PRODUCTION: Ref=0.5 → typical conf≈0.85
# gives w≈1 (full trust); the score only bites for genuinely weak detections (conf<0.5). VERIFIED
# 2026-06-27 via static A/B (Ref=0.95 to force a bite): σ widened 1.16–1.20× on cx,cy,radius vs 1/sqrt(w)=1.15.
MaskConfWeight = true
MaskConfFloor  = 0.2
MaskConfRef    = 0.5
MaskConfPower  = 2.0

[Support]
# Which surface the bottle hangs from (room vs a table): MAP over {room, every table_N} by
# vertical-support log-evidence — the centre must lie inside a table's oriented footprint AND the
# observed base must sit at its top. Replaces the naive XY-only single-"table" gate.
SigmaZ = 0.04            # base vertical-support std (m); keep ≥ the perceived table-top z-bias (~2.5 cm)
FootprintMargin = 0.05   # m: slack on the table half-extents for the footprint gate
LambdaXY = 50.0          # penalty (1/m²) for the centre lying outside the footprint
DecisionMargin = 2.0     # log-evidence a table must beat the room/floor hypothesis by to win
CommitCycles = 8         # consecutive cycles a challenger surface must win before re-parenting (anti-thrash)

[Tracker]
# Multi-instance birth/associate/death (shared rc::InstanceTracker) — the only instance-lifecycle path
# (mirrors table/chair): masks are associated to instances by a covariance-gated global 1-to-1, an
# unexplained mask spawns a new bottle, an unsupported instance is retired.
GateMahalanobis = 9.0     # χ²₂ gate (~3σ) for a mask↔instance match when the instance has a cov
GateFallbackM = 0.30     # metric XY gate (m) before an instance has a usable covariance
BirthFrames = 6          # frames a mask must stay unexplained before spawning a bottle
DeathFrames = 90         # frames an instance may go unsupported before retirement
BirthMinSepM = 0.10      # a birth must be ≥ this (m) from every existing bottle (anti-duplicate)
DetectionNoiseM = 0.05   # R in the association innovation cov S=P+R²I — fixes the assigned=0 churn (the
                         # overconfident σ~mm fit cov otherwise rejects the ~6cm-offset mask centroid). ≥ that offset.
MergeOverlap = 0.30      # collapse two instances whose circle footprints overlap ≥ this fraction of the
                         # smaller (same bottle fitted twice), keeping the more-observed. 0 disables.
NllCost = false          # association cost = ½(m²+ln|S|) NLL (tracks compete by likelihood, not raw
                         # distance) vs raw squared-Mahalanobis. Gate is m² either way. Matters under clutter.

# ── RGB-360 bearing confirmation (Part C confirm; see RICOH_360_PERIPHERAL_DETECTION.md) ────────────
# A ricoh no-depth "bottle" bearing that lines up (in azimuth from the robot) with a live instance HOLDS
# its death-miss this cycle — peripheral "glance" evidence it wasn't removed. No fit, no birth.
# ⚠ Default OFF: the published azimuth convention is PROVISIONAL (Part A step 8). Enable and watch the
# [bearing] log lines to verify the bearing hits the right instance BEFORE relying on it.
[Bearing]
ConfirmEnabled = false   # true → 360 bearings hold a matched bottle's death-miss
ConfirmGateRad = 0.17    # 1-D angular gate (rad, ~10°) for a bearing↔instance azimuth match

