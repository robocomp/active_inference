
[Proxies]
# Proxies for required interfaces
#Webots2Robocomp = "webots2robocomp:tcp -h localhost -p 15010"
Webots2Robocomp = "webots2robocomp:tcp -h localhost -p 10006"

# --- Common Agent Data ---
[Agent]
id = 10  # Change id
name = "bottle_concept"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree =false
graph = true   # headless perception agent: the shared DSR node-link viewer crashes in paintAndFlush under participant churn (QRegion::~QRegion). Same fix as voxelizer.
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Period]
Compute = 100
Emergency = 500

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

# ── Agent-presence protocol ───────────────────────────────────────────────────
[Presence]
required_agent_names = ["robot_concept", "room_concept", "voxelizer"]
config_dir = "etc"
monitor_period_ms = 500
heartbeat_timeout_ms = 25000   # was 3000 — ride through the voxelizer's churn-crash auto-restart (latent Eigen-align SIGBUS) instead of self-shutting-down before it rejoins
rejoin_grace_ms = 8000         # was 1500
stale_grace_ms = 120000
agent_info_period_ms = 1000

# Owned graph nodes torn down on shutdown / peer-loss. "bottle*" matches every
# cylinder this agent scaffolds (bottle_1, bottle_2, …) so none survive a restart.
[Owns]
nodes = ["bottle_concept 10", "bottle*"]

# ── Static ground-truth evaluation (Webots) ───────────────────────────────────
# Logs per-cycle position/size error and NEES (eᵀP⁻¹e) of the bottle tracker vs
# the Webots ground truth. With GtSource="webots" the bottle's pose is read live
# via getObjectPose and expressed in the room frame (one-shot — the bottle is static).
[Eval]
Enabled  = true
GtSource = "webots"            # "webots" (live getObjectPose) | "config" (manual Gt* below)
LogPath  = "etc/bottle_fulltable2_eval.csv"
BottleDef = "bottle"           # Webots DEF in shadow_arm.wbt
RobotDef  = "shadow"           # Webots DEF of the Shadow robot (== DSR body frame)

# Bottle dimensions: getObjectPose returns POSE only, so size GT comes from the proto.
# GtHeight also sets the base→centre Z lift, so it must match the WaterBottle proto.
# ⚠ VERIFY against shadow_arm.wbt's WaterBottle (these are the WaterBottleOpaque values).
# Scene bottle is the cyberbotics WaterBottle (Evian MESH, shadow_arm.wbt) — NOT WaterBottleOpaque.
# Data-driven best-fit cylinder (2026-06-20): radius 0.047 (depth 0.050 + mask 0.046), body height ~0.23.
GtRadius = 0.031
GtHeight = 0.20

# Manual room-frame centre fallback, used only when GtSource = "config".
GtCx = 0.0
GtCy = 0.0
GtCz = 0.0

# ── Moving-bottle validation experiment ──────────────────────────────────────
# When on, the agent drives the real bottle across the table in Webots (setObjectPose) through a
# MoveGridN×MoveGridN grid centred on its start pose, holding each pose MoveSettleCycles compute
# cycles so the fitted model converges, and logs fit-vs-GT (pose + shape) every cycle to LogPath.
# Returns the bottle home when done. Forces Enabled=true.
MoveExperiment   = false   # sweep off — normal operation
MoveGridN        = 5       # (unused in absolute mode)
MoveStep         = 0.16    # grid spacing, metres (world frame)
# Absolute-world grid over the ZED-visible table (table top z=0.74, world X∈[0.1,0.9] Y∈[-1.1,0.7]).
# Camera ~(-0.22,-0.38,0.98), HFOV 1.9198 rad (~110°) looking +x/down. Sweep near→far × left→right
# incl. the +y/right side; out-of-view corners self-exclude (no detection). ~5×9 = 45 poses.
MoveAbsolute     = false
MoveXmin         = 0.22
MoveXmax         = 0.86
MoveYmin         = -0.95
MoveYmax         = 0.35
MoveSettleCycles = 45      # (continuous mode only) — extra time after the candidate-gated re-seed
# Static-restart validation: ONE grid pose per run (env BOTTLE_TEST_POSE), fresh agent each time
# (no cross-pose accumulation). Driven by bottle_static_test.sh. Real scenario = static-until-grasped.
StaticPoseTest   = false   # sweep mode: MoveExperiment drives the grid (StaticPoseTest would pin pose 0)

# ── Scene setup: place the real bottle on start (Webots WORLD coords) ──────────
# When on, the bottle is teleported once at startup to (PlaceBottleWorldX, PlaceBottleWorldY)
# in Webots world (X+ front, Y+ right; z + orientation kept), so it sits on the arm's side and
# the reaching arm occludes the camera less. Takes precedence over Eval.StaticPoseTest /
# MoveExperiment (those also move the bottle). Set false to run the grid-validation drivers.
[Scene]
PlaceBottleOnStart = true    # bottle at grasp home (normal)
PlaceBottleWorldX  = 0.438    # m, Webots world (+X front) — EXPERIMENT INITIAL POSITION (logged 2026-06-20)
PlaceBottleWorldY  = -0.575   # m, Webots world (+Y right). reach 0.648 m from arm base. (Verify perception:
                              # -0.45 was rejected by YOLO tray-mask earlier; confirm conf>0 at this spot.)

# ── bottle_concept agent ──────────────────────────────────────────────────────
[BottleConcept]
PriorsPath = "etc/object_priors.toml"
KStable = 30
LogPeriodFrames = 30
VoxelBankMaxPoints = 4000
VoxelBankQuantizationM = 0.01      # dedup grid (m) for the voxel-bank hash
VoxelSelectRadiusMarginM = 0.04    # XY ownership gate margin around the bottle
VoxelSelectHeightMarginM = 0.10    # extra Z margin above/below the cylinder span
YawVariance = 9.87                 # ≈π² — yaw is unobservable for a symmetric cylinder

[BottleModel]
SigmaObs = 0.02            # SDF likelihood width (m); tight — a bottle is small
LambdaSize = 0.5          # KL toward prior dimensions (radius, height)
LambdaPos = 0.5          # KL toward prior centre
LambdaState = 0.02        # size transition
PriorRadius = 0.031       # cyberbotics BeerBottle (Heineken) body radius — naturally 62mm (no mesh distortion), well-detected by YOLO. height ~0.20 body.
PriorHeight = 0.20
PriorSizeStd = 0.03
OptimizationIters = 15
OptimizationLr = 0.005
GradClip = 2.0
OptimizerType = "adam"
MaskPrecision = 500.0    # RGB-mask silhouette likelihood weight (0=off). cf. depth inv_sigma2=1/0.02²=2500. Constrains (cx,cy,radius) — the front-arc-degenerate direction.
CovEffScale = 0.036    # covariance calibration: N_eff = N*scale → NEES≈3 (depth points are spatially correlated, N over-counts)
SeedDeprojectFrac = 2.0   # cold-start: push the visible-centroid seed away from the camera by frac·radius to recover the cylinder axis (front-arc centroid sits ~1 radius camera-ward → model parks forward, points fall behind its bbox). 0=off.
LambdaFreeSpace = 100.0   # free-space/visibility FE term: penalise the model occupying space between camera and observed points (carve sample in front of each point must be OUTSIDE the cylinder). Breaks the symmetric-SDF depth degeneracy → removes the camera-ward bias for ANY position, no drift-back. 0=off. 2.0 was ~250× too weak vs mask(500)/likelihood(2500) — the fit kept ey≈6cm; cranked to 100 to actually bite (watch eval ey shrink; back off if unstable).
FreeSpaceMargin = 0.01    # m: how far in front of each point the carve sample sits (small ⇒ tight depth pin).
RobustLoss = "welsch"        # redescending (soft): far-from-surface points ~0 weight; beats Tukey (hard cutoff over-rejects, depth drifts at bad-mask poses)
RobustLossScale = 0.04         # welsch c: points >~3-4cm from the cylinder surface are strongly down-weighted
# Fisher information filter (per-DOF stabiliser; currently DIAGNOSTIC — logged, not yet driving the fit).
# Real per-DOF SDF observation Fisher info accumulated across viewpoints (incl. radius/height, which the
# position-only Laplace Hessian ignores). The Q-bleed predict gives a finite STEADY-STATE precision — the
# principled fix for the P_bottle overconfidence. Set FisherCsvPath to tail the per-cycle evolution.
FisherFilterEnabled = true    # compute + accumulate + log; false = zero cost
FisherInfoDecay = 1.0         # stiffener fading memory; <1 forgets old views, 1 = pure accumulation
FisherProcessStdM = 0.005     # predict process-noise std per fresh frame (m) → posterior std floor (all 5 DOF are lengths)
FisherCsvPath = "etc/bottle_fisher_log.csv"   # per-cycle Fisher evolution log for plotting (empty = off)
# YOLO detection-score → observation precision: w = clamp01((conf−floor)/(ref−floor))^power weights BOTH
# the Laplace fit cov (queue/residual fit weights) and the Fisher stabiliser obs-info. PRODUCTION:
# Ref=0.5 → typical conf≈0.85 gives w≈1 (full trust); the score only bites for genuinely weak detections
# (conf<0.5). VERIFIED 2026-06-27 via static A/B (Ref=0.95 to force a bite): σ widened 1.16–1.20× on the
# well-observed DOFs cx,cy,radius vs the predicted 1/sqrt(w)=1.15. To re-run that test set Ref=0.95 and
# A/B MaskConfWeight on vs off (see bottle_static_ab.sh); read conf,conf_w,std_* in bottle_fisher_log.csv.
MaskConfWeight = true
MaskConfFloor  = 0.2
MaskConfRef    = 0.5
MaskConfPower  = 2.0

[Dynamics]
# A bottle is MOVABLE: its position (cx,cy) TRACKS via a constant-velocity Kalman filter instead of
# hardening like furniture. Fixes "move the bottle → a 2nd instance is born instead of tracking it"
# (the maturity-locked position gain froze the fit; the moved detection then spawned a new instance).
# cz stays table-anchored; radius/height keep hardening. Set Model="static" for the legacy behaviour.
Model = "constant_velocity"
# A RESTING bottle (hanging from table/room) is effectively STATIC — only a GRASP injects real (known)
# motion (step 2). So the resting regime is heavily damped: small accel process noise (velocity barely
# builds) + realistic measurement noise (don't chase centroid wobble) → smooth, table-like. The S=P+R
# tracker gate (DetectionNoiseM) still associates a genuinely moved bottle, so this won't re-spawn.
CvAccelStd = 0.08     # process: acceleration std (m/s²) — tiny: a resting bottle barely accelerates
CvMeasStd = 0.04      # per-frame position measurement std (m) — matches the real centroid/transform noise
CvInitVelStd = 0.3    # 1-σ on the initial unknown velocity (m/s)
CvDtDefaultS = 0.1    # fallback Δt (s) when capture stamps are missing/equal (≈ Period.Compute)
CvGate = 6.0          # χ²₂ outlier gate: reject a measurement whose innovation² (vs S=P+R) exceeds this
                      # — stops a jumpy partial-mask centroid (hand occlusion at the FoV edge) flinging the track
CvMaxSpeed = 0.4      # velocity clamp (m/s): a resting bottle barely moves; kills fling spikes
CvLostFrames = 5      # after a detection gap > this×CvDtDefaultS, zero the velocity (HOLD last pose, don't coast)
CvMaxPosStd = 0.05    # cap on per-axis position σ during predict (m): keeps the gate tight across dropouts so a
                      # far / other-bottle measurement can't be accepted — fixes two close bottles swapping/jumping

[Support]
# Which surface the bottle hangs from (room vs a table): MAP over {room, every table_N} by
# vertical-support log-evidence — the centre must lie inside a table's oriented footprint AND the
# observed base must sit at its top. Replaces the naive XY-only single-"table" gate.
SigmaZ = 0.04            # base vertical-support std (m); keep ≥ the perceived table-top z-bias (~2.5 cm)
FootprintMargin = 0.05   # m: slack on the table half-extents for the footprint gate
LambdaXY = 50.0          # penalty (1/m²) for the centre lying outside the footprint
DecisionMargin = 2.0     # log-evidence a table must beat the room/floor hypothesis by to win
CommitCycles = 8         # consecutive cycles a challenger surface must win before re-parenting (anti-thrash)

[Tracker]
# Multi-instance birth/associate/death (shared rc::InstanceTracker). OFF → legacy prior-scaffold +
# greedy nearest-mask. ON → masks are associated to instances by a covariance-gated global 1-to-1, an
# unexplained mask spawns a new bottle, an unsupported instance is retired. Enable for scenes with an
# unknown/changing number of bottles (priors then only seed the default birth size).
Enabled = true
GateMahalanobis = 9.0     # χ²₂ gate (~3σ) for a mask↔instance match when the instance has a cov
GateFallbackM = 0.30     # metric XY gate (m) before an instance has a usable covariance
BirthFrames = 6          # frames a mask must stay unexplained before spawning a bottle
DeathFrames = 90         # frames an instance may go unsupported before retirement
BirthMinSepM = 0.20      # a birth must be ≥ this (m) from every existing bottle (anti-duplicate)
DetectionNoiseM = 0.05   # R in the association innovation cov S=P+R²I — fixes the assigned=0 churn (the
                         # overconfident σ~mm fit cov otherwise rejects the ~6cm-offset mask centroid). ≥ that offset.
MergeOverlap = 0.30      # collapse two instances whose circle footprints overlap ≥ this fraction of the
                         # smaller (same bottle fitted twice), keeping the more-observed. 0 disables.
NllCost = false          # association cost = ½(m²+ln|S|) NLL (tracks compete by likelihood, not raw
                         # distance) vs raw squared-Mahalanobis. Gate is m² either way. Matters under clutter.

[SampleQueue]
NumAngleBins = 16
NumZBins = 6
MaxPerBin = 2
SdfThresholdForStorage = 0.03      # admit points within 3 cm of the surface
MinFramesBeforeHistorical = 10
HistoricalWarmupFrames = 5
MaxNewPointsPerFrame = 20
ZBinSize = 0.04
RfeWeightGain = 0.25
MinAnchorWeight = 0.12
EdgeBonusWeight = 0.3
EdgeProximityThreshold = 0.01
