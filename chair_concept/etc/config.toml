
# --- Common Agent Data ---
[Agent]
id = 20 # unique across the shared graph: room=5 robot=6 table=7 controller=8 voxelizer=9 bottle=10 kinova=11 self_calib=12
name = "chair_concept"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree = false
graph = false
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Presence]
required_agent_names = ["robot_concept", "room_concept"]
config_dir = "etc"
monitor_period_ms = 500
heartbeat_timeout_ms = 3000
rejoin_grace_ms = 1500
stale_grace_ms = 120000
agent_info_period_ms = 1000

[Owns]
nodes = ["chair_concept 20"]

[Period]
Compute = 100
Emergency = 500

[Component.Debug]
Verbose = false

[ChairModel]
# ── AI2 recursive-Laplace belief (mirrors table_concept). ──
SigmaObs = 0.05                  # compound-SDF band for the candidate/residual split in observe()
SdfThresholdForStorage = 0.08    # on-surface membership for the candidate/residual split
AI2CsvPath = "etc/ai2_log.csv"   # per-cycle AI2 log (state + Σ diag + range/motion); empty disables
AI2SigmaBaseM = 0.03
AI2ClutterFrac = 0.10
AI2ClutterScaleM = 0.12
AI2ClutterStructureGain = 1.0    # density-aware clutter: shrink the clutter prior for seat-coplanar points (closes the escape valve → seat_d recovers with honest Σ). 0 = flat clutter
AI2PriorSizeStd = 0.15
AI2ProcessStdM = 0.005
AI2ProcessStdYaw = 0.01
AI2ProcessStdSize = 0.0005       # process noise for RIGID size DOFs (≪ pose; furniture shape doesn't drift)
AI2FloorZ = 0.0                  # room-frame floor plane; cz is PINNED here (shared, view-independent)
AI2FloorStd = 0.03               # floor-height uncertainty (m) → common-mode z
AI2SeatAnchorStd = 0.04          # seat-layer height-anchor obs noise (m); 0 disables. Pins seat_h to the dense seat layer (gauge fix)
AI2SeatAnchorBand = 0.12         # seat-layer mean-shift bandwidth (m) — vertical scale separating seat from contamination
AI2SeatExtentStd = 0.02          # seat-layer FOOTPRINT (seat_w/seat_d) span-anchor obs noise (m); 0 disables. Fixes seat_d collapse
AI2CommonModePosStd = 0.03
AI2CommonModeSizeStd = 0.02
AI2CommonModeYawStd = 0.03
AI2RangeNoiseLatPerM = 0.02      # static range → R + position common-mode (m per m)
AI2RangeNoiseYawPerM = 0.03      # static range → yaw common-mode (rad per m) — anti far-view rotation
AI2TruncGateFrac = 0.10          # skip the geometric update (predict only) when this fraction of the mask is on the image border
AI2GnIters = 4                   # Gauss-Newton iterations per frame
AI2ExtentStd = 0.05              # extent-observation noise (m) for the coverage/extent likelihood

[ChairConcept]
StateEps = 0.04             # Σ|Δstate| threshold between cycles for convergence (m+rad)
KStable = 30                # consecutive stable frames before model_stable
DetectionAliveMaxFrames = 40 # cycles without a fresh chair mask before detection_alive=false
ObsDistance = 1.8           # comfortable maximum stand-off from the target face for epistemic poses
MinStandOffM = 2.0          # min stand-off floor for epistemic viewpoints (YOLO misses chairs seen too close)
EpistemicCooldownCycles = 200 # min cycles a satisfied chair stays withdrawn (anti-chatter)
ChairLogPeriodFrames = 30   # per-chair log throttle
VoxelBankMaxPoints = 4000   # max number of chair-owned voxels kept in memory
VoxelBankQuantizationM = 0.02 # dedup grid (m) for voxel-bank hashing
VoxelSelectRadiusMarginM = 0.50 # per-chair XY ownership gate margin for mixed proto-chairs
VoxelSelectHeightMarginM = 0.25 # extra Z margin above chair height when selecting owned voxels
RtCovUpload = true          # upload the chair pose covariance (rt_covariance_att, 6×6 SE3) onto the room→chair RT edge from the belief Σ
RtCovScale = 1.0            # var = RtCovScale · Σ_ii; calibrate toward NEES≈1
RtCovAddChain = true        # Part B: add the localization/chain cov J·Σ_chain·Jᵀ to the published RT cov

[Tracker]
# Multi-instance birth/associate/death (shared rc::InstanceTracker) — the only instance-lifecycle path.
# Masks are associated to instances by a covariance-gated 1-to-1, an unexplained mask spawns a new chair,
# and the MERGE operator collapses two instances on the same chair.
GateMahalanobis = 9.0     # χ²₂ gate (~3σ) for a mask↔instance match once it has a cov
GateFallbackM = 0.40     # metric XY gate (m) before an instance has a usable covariance
DetectionNoiseM = 0.20   # R in the association innovation cov S=P+R²I (≥ centroid-vs-fit offset)
BirthFrames = 8          # frames a mask must stay unexplained before spawning a chair
DeathFrames = 300        # frames an instance may go unobserved before retirement
DeathEnabled = false     # OFF: a chair is persistent furniture — removed only by MERGE
BirthMinSepM = 0.70      # a birth must be ≥ this (m) from every existing chair (anti-duplicate)
MergeOverlap = 0.20      # collapse two instances whose seat footprints overlap ≥ this fraction of the smaller, keeping the more-observed. 0 disables.
# Stillbirth prune — a phantom born from association churn starves once the real instance reclaims its
# mask. Prune a YOUNG instance (still inside its probation window) left unassigned for a sustained streak.
PruneEnabled = false     # OFF (2026-07-02): match table's proven merge-only lifecycle for STATIC furniture.
                         # With the §3.1 position gate now fixed (no far mis-claims), the stillbirth prune's
                         # phantom-killing job is redundant and was a prime suspect for "create-then-remove"
                         # churn (a glimpsed chair pruned before it matures). Removal is by MERGE only.
PruneMaturityCycles = 90 # probation window: an instance older than this is permanent furniture, never pruned
PrunePatience = 30       # consecutive tracker-unassigned cycles within probation → prune as stillborn
BirthSeatW = 0.45        # seed seat width/depth + seat/back heights for a freshly born chair node
BirthSeatD = 0.45
BirthSeatH = 0.45
BirthBackH = 0.45
NllCost = false          # association cost = ½(m²+ln|S|) NLL (compete by likelihood, not raw distance)

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
