
# --- Common Agent Data ---
[Agent]
id = 20 # unique across the shared graph: room=5 robot=6 table=7 controller=8 voxelizer=9 bottle=10 kinova=11 self_calib=12
name = "chair_concept"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree = false
graph = false
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Presence]
required_agent_names = ["robot_concept", "room_concept"]
config_dir = "etc"
monitor_period_ms = 500
heartbeat_timeout_ms = 3000
rejoin_grace_ms = 1500
stale_grace_ms = 120000
agent_info_period_ms = 1000

[Owns]
nodes = ["chair_concept 20"]

[Period]
Compute = 100
Emergency = 500

[Component.Debug]
Verbose = false

[Media]
MasksStallTimeoutMs = 3000   # 0 = disable the stall gate

[ChairModel]
# ── AI2 recursive-Laplace belief (mirrors table_concept). ──
SigmaObs = 0.05                  # compound-SDF band for the candidate/residual split in observe()
SdfThresholdForStorage = 0.08    # on-surface membership for the candidate/residual split
AI2CsvPath = "etc/ai2_log.csv"   # per-cycle AI2 log (state + Σ diag + range/motion); empty disables
AI2SigmaBaseM = 0.03
AI2ClutterFrac = 0.10
AI2ClutterScaleM = 0.12
AI2ClutterStructureGain = 1.0    # density-aware clutter: shrink the clutter prior for seat-coplanar points (closes the escape valve → seat_d recovers with honest Σ). 0 = flat clutter
AI2PriorSizeStd = 0.15
AI2ProcessStdM = 0.005
AI2ProcessStdYaw = 0.01
AI2ProcessStdSize = 0.0005       # process noise for RIGID size DOFs (≪ pose; furniture shape doesn't drift)
AI2AgeNominalDtS = 0.0           # stale-belief aging: mask nominal period (s). >0 ⇒ Σ inflates by Q·(dt/this) while unseen (measurement-age→covariance); 0 = freeze on stale. Try 0.1.
AI2FloorZ = 0.0                  # room-frame floor plane; cz is PINNED here (shared, view-independent)
AI2FloorStd = 0.03               # floor-height uncertainty (m) → common-mode z
AI2SeatAnchorStd = 0.04          # seat-layer height-anchor obs noise (m); 0 disables. Pins seat_h to the dense seat layer (gauge fix)
AI2SeatAnchorBand = 0.12         # seat-layer mean-shift bandwidth (m) — vertical scale separating seat from contamination
AI2SeatExtentStd = 0.02          # seat-layer FOOTPRINT (seat_w/seat_d) span-anchor obs noise (m); 0 disables. Fixes seat_d collapse
AI2CommonModePosStd = 0.03
AI2CommonModeSizeStd = 0.02
AI2CommonModeYawStd = 0.03
AI2RangeNoiseLatPerM = 0.02      # static range → R + position common-mode (m per m)
AI2RangeNoiseYawPerM = 0.03      # static range → yaw common-mode (rad per m) — anti far-view rotation
# Ego-motion "be-still-to-update" fixation (ported from table_concept). A frame captured while the robot moves is
# a shared smear → routed into the per-frame COMMON-MODE (caps its authority to move the mean), not per-point R.
# Geometry updates concentrate at stillness; moving frames only confirm. Continuous, 0 at stillness. 0 disables.
MotionCmPosGain = 0.30           # position (cx,cy) shared-error std per m/s of motion_dotd — anti-DRIFT  (0.10→0.30)
MotionCmYawGain = 0.50           # yaw shared-error std (rad) per m/s of motion_dotd      — anti-ROTATE (0.12→0.50);
                                 # the "passing by rotated the chair" lever. 0 at stillness → zero cost stationary,
                                 # so push higher (0.7–1.0) if a moving pass still swings yaw.
# "Be-still-to-update" as CONTINUOUS PRECISION (AIF, no threshold): a frame's authority to MOVE the mean falls off
# smoothly with an UNRELIABILITY = motion × off-axis-position. Still OR well-centred → full authority; moving AND
# peripheral → the frame only CONFIRMS. Motion = per-mask motion_dotd OR'd with the robot's measured ego-speed;
# off-axis penalty grows with the mask centroid radius². Feeds the pose common-mode AND the existence reliability.
AI2AngLeverM   = 2.0             # rad/s → m/s lever (tangential speed of a chair ~this far) for the ego angular term
AI2PeriphRef   = 0.50            # centroid radius (focal-norm, tan of off-axis angle) where the periphery penalty
                                 # saturates to 1; 0.50 ≈ tan(27°). Smaller = only near-axis counts as "central".
AI2MotionRefMps = 0.60           # motion (m/s) at which a fully-peripheral frame becomes fully unreliable (existence)
# A/B FALLBACK — the OLD hard gate (predict-only when moving & off-centre). Default OFF; the continuous precision
# above is the live path. Set AI2MotionConfirmOnly=true to compare; the four keys below feed only that path.
AI2MotionConfirmOnly = false

# ── FIXATION gate: the ATTENTION mechanism (eye-fixation analogue) — a DELIBERATE, flagged threshold ─────────
# WHY A GATE AND NOT MORE GRADED COVARIANCE. Every soft lever here (range, obliquity, coverage, ego-motion
# common-mode) acts through the per-frame common-mode Sigma_c, and the engine saturates a frame's information
# at Sigma_c^-1 — a NONZERO asymptote. So a bad frame's authority is ATTENUATED but never ZERO, and the GN mean
# step still moves the mean by ~Sigma_c^-1 every frame: hundreds of frames at 6 m beat the attenuation. Measured
# twice on live data after the range and coverage terms were added — the set was STILL repositioned from 6 m.
# Primates take in detail only during FIXATIONS and actively suppress intake otherwise (saccadic suppression);
# attention is precision, and an unattended channel's precision is zero — the observation is not integrated at
# all. This robot has no pan-tilt, so a fixation is the whole-body condition: CLOSE + CENTRED + STILL.
# Outside a fixation the cycle is predict-only: mean HELD, Sigma inflates. Association and existence do NOT
# read this, so an unfixated object is still CONFIRMED and tracked — only its pose/shape is frozen.
# CAVEAT BY DESIGN: an object the robot never approaches, centres and holds still for keeps its BIRTH geometry
# forever. That is the honest outcome (never claim a shape you never resolved) but it means convergence now
# REQUIRES going to look. Diagnose with the fixated/fix_close/fix_centred/fix_still/roi_off CSV columns.
FixationEnabled = true      # false = revert to the graded-only behaviour
# ★2026-07-30: the CLOSE condition was a hard RANGE cut and it had the physics backwards. Range is only a
# proxy; what decides whether a frame can resolve the pose is how much UN-CLUTTERED surface it puts on the
# chair. A dense 3.7 m stare (chair_3: 400 pts, clutter 0.13) is better evidence than a starved 2.4 m glance,
# yet the range cut rejected the former. Live cost: gated 400/400 cycles on all three real chairs — yaw span
# EXACTLY 0.0 deg, std_yaw pinned at the 0.60 prior — while the robot was deliberately parked and staring.
# Calibrated against that stare: chair_1/2/3 = 1195/875/400 pts, clutter 0.03/0.06/0.13 -> FIXATE;
# chair_4 = 30 pts at 4.53 m -> REJECT. Range now enters only via point density, and is a diagnostic column.
FixationMinPts = 150        # RESOLVABLE: min mask points before the frame may touch the pose
FixationMaxClutter = 0.35   # RESOLVABLE: max clutter fraction (surface the model cannot explain)
FixationRangeM = 0.0        # RETIRED as a gate (0 = off). Kept so an A/B revert to the range cut is one edit
FixationCentreFrac = 0.60   # CENTRED: max off-axis radius, the "fovea". <=0 disables this one. 0.60 matches
                            # AI2PeriphRef (0.50 ~ tan 27 deg) where this codebase's own periphery penalty
                            # saturates; the previous 0.35 was tighter than that and blocked chair_2 at 2.04 m
FixationStillDotd = 0.05    # STILL: max |motion_dotd| = Z*||sdot|| (m/s), ego-motion mask smear. <=0 disables
FixationStillLinMps = 0.05  # STILL: max robot linear speed (m/s). <=0 disables this one
FixationStillAngRadps = 0.10 # STILL: max robot angular speed (rad/s) — the TURN case. <=0 disables this one
AI2StillLinMps   = 0.05
AI2StillAngRadps = 0.10
AI2StillDotd     = 0.05
AI2MovingUpdateCenterRadius = 0.35
AI2TruncGateFrac = 0.10          # skip the geometric update (predict only) when this fraction of the mask is on the image border
AI2GnIters = 4                   # Gauss-Newton iterations per frame
AI2ExtentStd = 0.05              # extent-observation noise (m) for the coverage/extent likelihood

# ── Discrete yaw-mode evidence: weight by INFORMATION, not by dwell time ────────────────────────
# Each frame's yaw-mode vote is scaled by (backrest point mass observed) x (viewpoint novelty), so a
# starved far frame cannot outvote a rich near one and staring from one spot stops accumulating
# confidence. false restores the pre-2026-07-27 behaviour, where 21-point frames at 6.5 m rotated a
# chair that 1700 points at 3.5 m had resolved correctly.
AI2ModeObsWeighting = true
AI2ModeSatBackPts = 60.0
# Total mode-evidence weight ONE bearing bin may ever contribute, approached asymptotically. Replaces the old
# novelty = 1/(1+visits) divisor, under which a viewpoint's TOTAL contribution grew only as log(n) — so a
# deliberate 3-minute fixation on a chair whose model was visibly ~45 deg off still could not settle it.
# A stare now converges to this much (decisive: flip_acc_ runs to +-6), staring past it adds ~nothing (dwell
# still cannot inflate confidence), and orbiting to a NEW bearing opens a fresh budget.
AI2ViewBudget = 3.0

[ChairConcept]
StateEps = 0.04             # Σ|Δstate| threshold between cycles for convergence (m+rad)
KStable = 30                # consecutive stable frames before model_stable
DetectionAliveMaxFrames = 40 # cycles without a fresh chair mask before detection_alive=false
ObsDistance = 1.8           # comfortable maximum stand-off from the target face for epistemic poses
MinStandOffM = 2.0          # min stand-off floor for epistemic viewpoints (YOLO misses chairs seen too close)
EpistemicCooldownCycles = 200 # min cycles a satisfied chair stays withdrawn (anti-chatter)
ChairLogPeriodFrames = 30   # per-chair log throttle
VoxelBankMaxPoints = 4000   # max number of chair-owned voxels kept in memory
VoxelBankQuantizationM = 0.02 # dedup grid (m) for voxel-bank hashing
VoxelSelectRadiusMarginM = 0.50 # per-chair XY ownership gate margin for mixed proto-chairs
VoxelSelectHeightMarginM = 0.25 # extra Z margin above chair height when selecting owned voxels
RtCovUpload = true          # upload the chair pose covariance (rt_covariance_att, 6×6 SE3) onto the room→chair RT edge from the belief Σ
RtCovScale = 1.0            # var = RtCovScale · Σ_ii; calibrate toward NEES≈1
RtCovAddChain = true        # Part B: add the localization/chain cov J·Σ_chain·Jᵀ to the published RT cov

[Tracker]
# Multi-instance birth/associate/death (shared rc::InstanceTracker) — the only instance-lifecycle path.
# Masks are associated to instances by a covariance-gated 1-to-1, an unexplained mask spawns a new chair,
# and the MERGE operator collapses two instances on the same chair.
GateMahalanobis = 9.0     # χ²₂ gate (~3σ) for a mask↔instance match once it has a cov
GateFallbackM = 0.40     # metric XY gate (m) before an instance has a usable covariance
DetectionNoiseM = 0.20   # R in the association innovation cov S=P+R²I (≥ centroid-vs-fit offset)
BirthFrames = 8          # frames a mask must stay unexplained before spawning a chair
DeathFrames = 300        # frames an instance may go unobserved before retirement
DeathEnabled = false     # OFF: a chair is persistent furniture — removed only by MERGE
BirthMinSepM = 0.70      # a birth must be ≥ this (m) from every existing chair (anti-duplicate)
MergeOverlap = 0.20      # collapse two instances whose seat footprints overlap ≥ this fraction of the smaller, keeping the more-observed. 0 disables.
# Stillbirth prune — a phantom born from association churn starves once the real instance reclaims its
# mask. Prune a YOUNG instance (still inside its probation window) left unassigned for a sustained streak.
PruneEnabled = false     # OFF (2026-07-02): match table's proven merge-only lifecycle for STATIC furniture.
                         # With the §3.1 position gate now fixed (no far mis-claims), the stillbirth prune's
                         # phantom-killing job is redundant and was a prime suspect for "create-then-remove"
                         # churn (a glimpsed chair pruned before it matures). Removal is by MERGE only.
PruneMaturityCycles = 90 # probation window: an instance older than this is permanent furniture, never pruned
PrunePatience = 30       # consecutive tracker-unassigned cycles within probation → prune as stillborn
# ★TEMPLATE GEOMETRY — the chair the belief actually believes in. The pose-only belief does NOT fit
# size, so an error here is a systematic model-vs-world mismatch that the clutter term silently absorbs.
# These were all 0.45 against a real Webots SimpleChair (seat 0.60x0.52, top 0.595, backrest to 1.25);
# that mismatch routed 99% of SEAT points into the BACKREST component (the z-band gate keys on SeatH)
# and dumped 30-56% of every mask above the model into flat clutter. Fixing SeatH alone moved a chair's
# continuous yaw error from 98.1 deg to 1.0 deg. Re-derive these for any different chair model.
BirthSeatW = 0.60        # x extent — the span the backrest covers
BirthSeatD = 0.52        # y extent — front-to-back; the backrest sits on the -y edge
BirthSeatH = 0.595       # seat TOP above the floor
BirthBackH = 0.655       # backrest height above the seat top (top ends up at 1.25)
BirthSeatThick = 0.075   # seat slab thickness — also sets the leg/seat z-band split
BirthLegHalf = 0.0375    # square leg half-side

NllCost = false          # association cost = ½(m²+ln|S|) NLL (compete by likelihood, not raw distance)
# ZED-only BIRTH: only a ZED slice (per-pixel depth ⇒ depth_var==0) may SPAWN a chair. A ricoh LiDAR-reprojected
# depth slice (depth_var>0) has unreliable depth/extent → it may associate/confirm an existing chair but NOT birth
# one (this is what created chair_3 — a wrong ricoh detection at 8.8 m, outside the room). ZED drives geometry,
# ricoh confirms. Set RicohBirthEnabled=true to allow a confident, low-variance ricoh-depth slice to birth too.
RicohBirthEnabled = false
RicohBirthConf = 0.60      # min YOLO confidence for a ricoh birth (only when RicohBirthEnabled)
RicohBirthMaxVar = 0.005   # max depth_var (m²) for a ricoh birth (only when RicohBirthEnabled)

[Existence]
# Continuous existence log-odds — the removal path (the stillbirth prune above is OFF, and merge only kills
# spatial DUPLICATES, so a phantom that sits apart from the real chairs had NO removal path). Each instance
# integrates one sensor frame of evidence while it is in the camera frustum: POSITIVE when its assigned support
# mass matches a chair's expected silhouette at that range, NEGATIVE (silhouette-contradiction / free-space)
# when it is in view yet under-supported. No age immunity — L is pinned high only by continuing to be explained.
Enabled = true           # use the log-odds belief for removal (false → fall back to the stillbirth prune)
BirthLogodds = 1.0       # L seeded at birth (a birth already required BirthFrames of unexplained evidence)
RemoveLogodds = -3.0     # remove when L falls below this (span BirthLogodds→RemoveLogodds / EvidenceGain = frames to kill)
MaxLogodds = 4.0         # saturation cap: a real chair sits here; occlusion tolerance = (Max−Remove)/EvidenceGain frames
EvidenceGain = 0.15      # per-sensor-frame |ΔL| scale
ExpectedSupportC = 2500.0  # expected support scale: E[npts] = C / range². Sets the negative boundary at a HANDFUL of
                         # points (≈0.25·C/range²): sparse-but-real chairs (~20 pts @6m) stay positive, a phantom
                         # feeding on ~8 clutter points goes negative. Evidence is only taken on a WON mask slice.
AdequacyRef = 0.25       # WON-mask support/expected below this fraction → NEGATIVE evidence (else positive)
AdequacyCap = 1.5        # clamp adequacy so one dense frame can't over-confirm
CalibAdapt = 0.0         # EWMA rate adapting C (0 = fixed C; a dense chair would poison a sparse one via a shared C)
VacateConfidentFrames = 45  # an in-frustum instance that keeps winning NO mask draws vacate negative that ramps 0→1 over
                         # this many frames_since_detection. Small (brief occlusion / lost slice) → barely touched, recovers
                         # on its next win (anti-churn grace); unexplained for seconds (a phantom) → full negative → removed.
OcclusionCheck = true    # SUPPRESS the vacate negative when the camera→chair ray is blocked by a CLOSER object (another
                         # chair, the table, a person …). A chair hidden behind something is not removed for lack of a mask.
OcclusionMarginM = 0.30  # an occluder must be ≥ this many metres CLOSER than the chair to count as blocking it
# Room-containment pose prior: P(a chair centre outside the room walls) ≈ 0 (the room polygon is a trusted nominal
# model, never fitted). Suppresses out-of-room BIRTHS and removes an instance a localization glitch put outside —
# even behind a wall where the sensor can never reach it to vacate. Independent of frustum/occlusion.
RoomPrior = true         # enforce the room-containment pose prior
RoomMarginM = 0.40       # tolerance a chair centre may sit OUTSIDE the walls (wall-hugging chair + centroid noise)
OutOfRoomGain = 1.5      # |ΔL| per frame while outside → removed in a few frames (also debounces a 1-frame glitch)
# "ZED removes, ricoh confirms": a ricoh WIN confirms existence but a ricoh mask's ABSENCE never removes — only ZED
# absence does, weighted by how reliably ZED would have detected a present chair (falls off toward the image edge +
# with range). Fixes removal of a far/peripheral only-ricoh-visible chair when its 360 view is momentarily occluded.
ZedEdgeOffset = 1.0      # normalised ROI offset (0=centred, 1=image edge) at which ZED detectability → 0
ZedRangeFull  = 4.0      # within this range (m) ZED detects reliably → absence fully counts (pd=1)
ZedRangeRef   = 7.0      # beyond this range (m) ZED absence says nothing about existence (pd=0)
ZedClearLosFloor = 0.0   # ★0 SINCE 2026-07-29 (was 0.15) — this floor WAS the "chairs vanish when unobserved" bug.
                         # It overrode zed_detectability()==0 (chair beyond ZedRangeRef or at the image edge = ZED
                         # provably cannot resolve it) and vacated anyway at a constant rate once since_det passed
                         # VacateConfidentFrames, so L walked to RemoveLogodds on ZERO informative looks. Live proof
                         # in etc/chair_existence_log.csv: 51 of 69 vacate rows had zed_pd == 0 exactly; chair_2 fell
                         # 3.09→1.74 and chair_3 2.44→1.09 on the floor alone, then were deleted. Out-of-room glitch
                         # phantoms (the case this was aimed at) are still reaped by the room-containment prior.
                         # 0 = pure pd (a peripheral phantom then persists until the robot centres it). Tune down
                         # if real peripheral chairs get removed; up to clear glitch phantoms faster.

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

# ── Level-2 arrangement prior, published by ring_metaconcept on the group_member edge ───────────
# A square seat makes yaw 4-fold ambiguous and the thin backrest often cannot break it; a wrong mode
# is STICKY (2026-07-26: 570 cycles wrong, cleared only by restarting the agent). The rig supplies
# the missing structural evidence. Enabled=false restores the exact pre-rig behaviour (A/B).
[RigPrior]
# ★RE-ENABLED 2026-07-27, after the safety hole it was disabled for was actually closed.
# The cap is bounded by the 180° case, not the 90° one: rig_mode_cost = -kappa*cos(delta) has a
# differential of kappa at 90 deg but 2*kappa at 180 deg, so safety needs 2*kappa < kFlipClamp(6).
# That was impossible while flip_acc_ measured DWELL TIME (an ambiguous chair also sat at the 6.0
# clamp, so overturning it needed kappa > 4.19 while safety needed kappa <= 3 -- an empty window).
# With the mode evidence now information-weighted the two separate cleanly (measured: well-seen
# chair 6.00, backrest-blind chair 0.21 after 2000 frames), so the window is (0.2, 3.0) and 1.5
# sits ~7x above the ambiguous case and 2x below the saturated one. Self-test covers 90 AND 180.
Enabled = true
YawKappaMax = 1.5      # consumer cap; ChairBelief::kRigKappaMax = 0.25*kFlipClamp enforces the same
StaleMs = 5000         # ignore a message no rig is refreshing; 0 disables
