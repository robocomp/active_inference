# object_priors.toml
#
# Prior chair definitions for the chair_concept agent.
# Each [[chairs]] entry is checked at startup; if the node named `node_name`
# is absent from the DSR graph it is created with the given geometry.

[[chairs]]
node_name  = "chair_1"
seat_w_m   = 0.45
seat_d_m   = 0.45
seat_h_m   = 0.45
back_h_m   = 0.45
room_x_m   = 2.0
room_y_m   = 1.0
yaw_rad    = 0.0
sigma_pose = 0.10
sigma_size = 0.08
