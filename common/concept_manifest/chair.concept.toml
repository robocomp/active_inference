# chair.concept.toml — what a CHAIR is, as world facts.
#
# SCOPE: world facts only. Gates, debounces and frame counts are LIFECYCLE and belong to the shared modules
# (common/existence_belief, common/instance_tracker) — if tuning knobs migrate here this becomes
# etc/config.toml under a new name.
#
# ★Every block carries `from`. `inherited` REFUSES TO START the agent (rc::manifest::provenance_ok): a value
# that arrived by a rename looks decided and is not. A block that is genuinely unsettled is OMITTED rather
# than given a provenance it has not earned — an absent value gets asked about.

[concept]
name = "chair"
label = "chair"                    # the ADE20K/YOLO label this agent claims

[model.geometry]
support   = "floor_anchored"       # floor_anchored | leg_supported | hangs | counter_top | resolved
z_top_m   = 1.25                   # seat_h + back_h = 0.595 + 0.655 ([prior.template])
extent_m  = 1.25
from      = "nominal"
why       = """
A chair stands on the floor and chair_belief PINS cz there (AI2FloorZ = 0.0, "cz is PINNED here, shared and
view-independent"), so the span is [0, seat_h + back_h] by construction rather than by fit. NOMINAL — the
0.595/0.655 split is the template the agent runs (the real Webots SimpleChair), from the appliance class and not
measured on these chairs.
"""

[prior.template]
seat_w_m     = 0.60                # x extent — the span the backrest covers
seat_d_m     = 0.52                # y extent — front-to-back; the backrest sits on the -y edge
seat_h_m     = 0.595               # seat TOP above the floor
back_h_m     = 0.655               # backrest above the seat top (top at 1.25)
seat_thick_m = 0.075               # seat slab thickness (also sets the leg/seat z-band split)
leg_half_m   = 0.0375              # square leg half-side: the Webots SimpleChair legs are 7.5 cm across
seat_w_std_m = 0.05                # std of the seat_w prior (real chair variation)
seat_d_std_m = 0.04                # std of the seat_d prior
seat_h_std_m = 0.03                # std of the seat_h prior
back_h_std_m = 0.06                # std of the back_h prior
from         = "nominal"
why          = """
The size numbers are the values chair ran as Tracker.BirthSeatW/D/H/BackH/SeatThick in etc/config.toml until
2026-10-31, when the manifest became their single source. leg_half_m (0.0375) is the Webots SimpleChair's legs, 7.5 cm
across (the user's ruling, 2026-10-31); it is ONE value feeding the belief, ChairModel's SDF, the mesh and the card's
LegSet (it replaces Tracker.BirthLegHalf and the SDF's former 0.02 constant, which disagreed with each other). chair's size is a FIXED TEMPLATE,
not a fitted DOF — chair_belief's state is pose only (cx, cy, yaw). That is a modelling claim: a chair seen from
one side gives almost no extent information, and estimating it produced the size oscillation this lineage is
named for. ⚠seat_h has an open gauge question (see the seat_h memory); when it is settled, this becomes `measured`.
The four *_std_m sigmas describe how much real chairs vary in each size (the user's call, 2026-10-31). They are new
numbers: the old ChairModel.AI2PriorSizeStd (a single 0.15 m) was never read by any code path, so the agent never ran with
it, and it was far wider than any real chair; the imagined observations sample from these four sigmas instead.
"""

[prior.placement]
p_free           = 0.5             # weight of "stands free in the room" (the two weights are normalised by the reader)
p_against_wall   = 0.5             # weight of "pushed against a wall"
wall_gap_mean_m  = 0.05            # gap between the backrest-side/any side and the wall when against a wall
wall_gap_sigma_m = 0.05            # std of that gap
from             = "nominal"
why              = """
Placement of a chair on the floor of a room: either free-standing or pushed to a wall, half and half, with a
5 cm gap (std 5 cm). NOMINAL — a guess from how rooms are furnished, not measured on this world; the imagined
observations that use it (appearance sampling) are only as good as these four numbers.
"""

[prior.bounds]
seat_w_min_m = 0.30
seat_w_max_m = 0.65
seat_d_min_m = 0.30
seat_d_max_m = 0.65
seat_h_min_m = 0.38
seat_h_max_m = 0.70                # was 0.55 in code: it clamped the live seat_h (0.595) below its own birth template
back_h_min_m = 0.30
back_h_max_m = 0.80                # was 0.65 in code: the template back_h is 0.655
from         = "nominal"
why          = """
Physical bounds of the four size DOFs; ChairModel::apply_constraints clamps to them and the perception card exports
them as the lo/hi of each variable (one source). They must CONTAIN the template (load_chair_prior refuses otherwise):
the former code constants did not (seat_h <= 0.55, back_h <= 0.65 vs template 0.595/0.655), so live chairs were clamped
below the very template they were born with. NOMINAL: a generous envelope for domestic chairs, not measured.
"""

# ── DELIBERATELY ABSENT ────────────────────────────────────────────────────────────────────────────────
# [prior.identity]   — chair has no shape log-evidence ratio. Stated as absent so it is asked about rather
#                      than assumed present; the table manifest records the same gap.
# [detector.envelope]— chair's REMOVAL still uses a local one-sided zed_detectability() rather than
#                      rc::detect::p_detect, so declaring an envelope here would describe a model the
#                      removal path does not consult. Fix the consumer first, then declare.
# [sigma_star]       — chair_dof.h declares 3 of 3; that is a real demand and needs no manifest entry yet.

# ══ The chair as a box-part class on the countable binary (shared-engine K2b, 2026-11-25) ══════════════════════════════════
# Read by countable_concept only (chair_concept/etc/countable.toml). The legacy chair_concept agent reads the blocks above
# ([model.geometry], [prior.template], [prior.placement], [prior.bounds]) and none of these; no value it reads was changed.
# Every fraction and range below is CLASS KNOWLEDGE (dining-chair size guides and listings, cited per value), written and committed
# before any replay or live run of a chair on the countable binary. None is from the Webots SimpleChair.
#
# θ = (cx, cy, H, w, h, yaw) is the chair's footprint box: w = overall width, h = overall depth (front of the seat to the back of
# the backrest), H = the top of the backrest. +y is the BACK (the backrest side), as for every countable class.
#
# Sources (all dining chairs; "listing" = a retailer's product sheet, a sample, not a standard):
#   [IKEA]  IKEA, "Dining chair size guide for your home" (ikea.co.id/en/inspirations/dining-chair-size-guide-for-your-home):
#           seat height "16–19 in (40–48 cm) from floor to seat"; seat width "about 15–20 inches (39–50 cm)"; seat depth "measured
#           from the front edge of the seat to the backrest", "15–18 in (39–45 cm)"; overall depth "17–20 in (42–51 cm), depending on
#           legs and backrest"; a listed height "usually means the height from the floor to the top of the backrest".
#   [LAKE]  Lakeland Furniture, "The Ultimate Guide to Dining Chair Size, Height & Width" (lakeland-furniture.co.uk/blog/post/
#           blog-post-dining-chair-size-height-width): "Seat height: 45–50 cm", "Overall height: 75–95 cm", "Chair width: 45–55 cm",
#           "Seat depth: 40–50 cm".
#   [A2Z]   The A2Z Furniture "Dexter" high-back dining chair listing (thea2zfurniture.com/products/dexter-dining-chair): 106 cm high,
#           the tall end of the class (high-back models), above [LAKE]'s 95 cm.
#   [CUSH]  upholstered dining-seat thickness in retailer listings (read through a web-search summary, the pages were not each
#           opened): a bouclé chair "Seat Thickness: 5 cm"; a padded kitchen chair "6cm of plush foam" (Costway); "2.7 inches"
#           (Nathan James bouclé seagrass chair) and "2.8 in" (17 Stories velvet chair), about 7 cm ⇒ 5–7 cm, mid 6 cm. A bare
#           wooden seat is thinner (no source found); the slab is the upholstered seat.
#   [LEG]   Stavros Decor, "wooden legs for a chair" (stavrosdecor.com/articles/…): hardwood dining-chair leg, square section,
#           "32 mm" minimum, "36–40 mm" optimal ⇒ 38 mm.
# Mid values used to turn absolute sizes into fractions of θ: w = 0.50 m (chair width 45–55 cm [LAKE]), h = 0.465 m (overall
# depth 42–51 cm [IKEA]), H = 0.905 m (overall height 0.75–1.06 m [LAKE], [A2Z]).

[shape]
from = "nominal"
solid = "parts"   # the [[shape.part]] rows below ARE the model's solid (camera SDF, beam parts, carve): seat, backrest, four legs
layer_spread_m = [
    0.02,   # cx: the layers share the backrest's back, so the narrower seat-depth layer sits about half of Δ_h forward; room-frame cx/cy
    0.02,   # cy: as cx
    0.0,    # H: not a layer DOF: the backrest top is the top every sensor sees
    0.055,  # w: overall chair width (45–55 cm, mid 0.50 [LAKE]) vs seat width (39–50 cm, mid 0.445 [IKEA])
    0.045,  # h: overall depth (42–51 cm, mid 0.465 [IKEA]) vs seat depth to the backrest (39–45 cm, mid 0.42 [IKEA])
    0.0,    # yaw: every layer shares the chair's axes
]
layer_spread_source = "dining-chair size guides: IKEA (seat width 39–50 cm, seat depth to the backrest 39–45 cm, overall depth 42–51 cm) and Lakeland Furniture (chair width 45–55 cm); Δ = the difference of the mid values of the outer and the seat layer. Not from the Webots SimpleChair."

# ── The parts (fractions of θ; a z boundary named "seat_top" is the class proportion below, *_off_f a fixed fraction added to it) ──
#   seat slab : full width; depth from the front to the backrest's front face (h_f 1 − 0.097 = 0.903, y_f = −0.097/2);
#               z from seat_top − 0.066 to seat_top. 0.066 = 6 cm [CUSH] / 0.905 m.
#   backrest  : full width; depth 0.097 = (0.465 − 0.42)/0.465, the overall depth minus the seat depth [IKEA] mid values, at the back
#               (y_f = 0.5 − 0.097/2 = 0.4515); z from seat_top to H. Its uprights / back legs are inside it.
#   legs      : 38 mm square [LEG]: w_f = 0.038/0.50 = 0.076, h_f = 0.038/0.465 = 0.082, at the corners
#               (x_f = ±(0.5 − 0.038), y_f = ±(0.5 − 0.041)); z from the floor to the seat's underside (seat_top − 0.066).

[[shape.part]]
name = "seat"
x_f = 0.0
y_f = -0.0485
w_f = 1.0
h_f = 0.903
z0_f = "seat_top"
z0_off_f = -0.066
z1_f = "seat_top"
why = "upholstered seat slab, 5–7 cm [CUSH]; depth to the backrest [IKEA]"

[[shape.part]]
name = "back"
x_f = 0.0
y_f = 0.4515
w_f = 1.0
h_f = 0.097
z0_f = "seat_top"
z1_f = 1.0
why = "backrest: overall depth minus seat depth [IKEA]; from the seat top to the chair's top (H, the listed height [IKEA])"

[[shape.part]]
name = "leg_front_left"
x_f = -0.462
y_f = -0.459
w_f = 0.076
h_f = 0.082
z0_f = 0.0
z1_f = "seat_top"
z1_off_f = -0.066
why = "38 mm square hardwood leg [LEG]"

[[shape.part]]
name = "leg_front_right"
x_f = 0.462
y_f = -0.459
w_f = 0.076
h_f = 0.082
z0_f = 0.0
z1_f = "seat_top"
z1_off_f = -0.066
why = "38 mm square hardwood leg [LEG]"

[[shape.part]]
name = "leg_back_left"
x_f = -0.462
y_f = 0.459
w_f = 0.076
h_f = 0.082
z0_f = 0.0
z1_f = "seat_top"
z1_off_f = -0.066
why = "38 mm square hardwood leg [LEG]"

[[shape.part]]
name = "leg_back_right"
x_f = 0.462
y_f = 0.459
w_f = 0.076
h_f = 0.082
z0_f = 0.0
z1_f = "seat_top"
z1_off_f = -0.066
why = "38 mm square hardwood leg [LEG]"

# ── The proportion (spec G4, K2a-L): the seat top as a fraction of H. It sets the seat AND the backrest's height (back = H − seat_top),
# the two boundaries a chair genuinely varies on. Uniform over the class range ⇒ mean (lo + hi)/2, σ = (hi − lo)/√12.
#   seat top 0.40–0.50 m (IKEA 40–48 cm, Lakeland 45–50 cm); overall height 0.75 m (Lakeland's low end) to 1.06 m (A2Z high back)
#   ⇒ lo = 0.40 / 1.06 = 0.377 (lowest seat on the tallest chair), hi = 0.50 / 0.75 = 0.667 (highest seat on the shortest chair).
#   Δ = 0.290, σ = 0.084, midpoint 0.522.
[[shape.proportion]]
name = "seat_top"
lo = 0.377
hi = 0.667
source = "dining-chair seat height 40–48 cm (IKEA dining chair size guide) and 45–50 cm (Lakeland Furniture guide); overall height 75–95 cm (Lakeland) to 106 cm (A2Z Dexter high-back listing). lo = 0.40/1.06, hi = 0.50/0.75."

[prior.attachment]
kind = "wall_flush"
face = "back"
why = "a chair is often pushed back against a wall, never definitionally; the weight is the placement prior above (p_against_wall)"
standoff_m = 0.05                   # the gap between the backrest and the wall when it is against one ([prior.placement] wall_gap_mean_m)
standoff_std_m = 0.05
standoff_source = "uncited convention: [prior.placement] wall_gap_mean_m / wall_gap_sigma_m (nominal, 2026-10-31: a guess from how rooms are furnished). Not from the Webots world."

[prior.permanence]
# The volatility's hyperprior (countable persistent path): Q is inferred around q0 = rate * dt * scale^2 (spike-and-slab).
from = "nominal"
move_rate_per_day = 3.0
move_scale_m = 0.3
move_scale_rad = 0.5
source = "uncited convention: a dining chair is pulled out and pushed back at each meal (about 3 times a day), by about a seat depth (0.3 m) and turned up to about 30 degrees (0.5 rad). Not measured; not from the Webots world."

[prior.class]
kind = "label_reliability"
p_label_true = 0.8
why  = "P(a mask with this label is really this class): the same value as the other countable classes (YOLOE's median confidence on the real bed, .85, detcheck3). Not measured on chairs."
