# nightstand.concept.toml — WHAT a nightstand IS.
#
# Scaffolded 2026-11-14 from refrigerator.concept.toml (tools/scaffold_from_refrigerator.sh): a box with a front face,
# floor-standing, its back against a wall. World facts below are MEASURED on the Webots model the agent is first
# validated on (threerooms-piso): painted_wooden_nightstand.obj bbox 0.505 x 0.509 x 0.616 m (two, flanking the bed, backs to the wall). They are this world's nightstand, not a class survey — widen the stds
# before trusting them on another nightstand. Model constants (precisions, explain-away) are the parent's, re-used as
# properties of the BOX model rather than of a fridge.

[concept]
name       = "nightstand"
graph_type = "object"
subtype    = "nightstand"
agent_id   = 29

[model]
shape          = "solid_box"
support        = "floor_anchored"
state          = ["cx", "cy", "H", "w", "h", "yaw"]
symmetry       = "none"
opens          = "front"            # drawers: their horizontal seams are the same cue a fridge door gives, so cue.door_seam is kept

[model.geometry]
support   = "floor_anchored"
z_top_m   = 0.62
extent_m  = 0.62
from      = "measured"
why       = "Webots threerooms-piso: painted_wooden_nightstand.obj bbox 0.505 x 0.509 x 0.616 m (two, flanking the bed, backs to the wall)"

[prior.footprint]
kind = "gaussian"
dims = ["w", "h"]
mean_m = 0.51
std_m = 0.06
why  = "measured on the Webots model. Square in plan: one mean for width and depth."

[prior.height]
kind = "gaussian"
dims = ["H"]
mean_m = 0.62
std_m = 0.10
why  = "the mask's robust top (the tallest part the detector covers), measured on the Webots model"

[prior.depth_observability]
kind = "conditional_precision"
dim = "h"
precision = 20000.0
observed_band_m = 0.10
why  = "box-model constant kept from refrigerator_concept: depth is identifiable only once the cloud spans it"

[prior.top]
kind = "two_sided_anchor"
dim = "H"
precision = 10000.0
margin_m = 0.02
target = "observed_robust_top"
why  = "box-model constant kept from refrigerator_concept"

[prior.attachment]
kind = "wall_flush"
face = "back"
precision = 400.0
parallel_precision = 200.0
reach_m = 0.15
no_cross_precision = 2000.0
class_prior = 0.90                  # P(against a wall): the concept holds it (owner 2026-11-14)
why  = "the back rests against a room wall — a nightstand stands beside a bed, against the wall behind it"

[prior.alignment]
kind = "room_axis"
fold = 4
std_deg = 3.0
why  = "furniture is aligned with the room's axes; 4-fold, so it never decides front/back"

[prior.clearance]
kind = "facing_free_space"
face = "front"
gain_nats = 3.0
why  = "the front faces the room, never the wall it stands against — resolves the 180° ambiguity"

[prior.identity]
kind = "shape_log_evidence_ratio"
aspect_scale = 0.15
size_scale = 0.10
alt_size_scale = 0.40
height_min_m = 0.40
height_soft_m = 0.08
why  = "aspect is scored against the class's own aspect; height_min sits well below the measured height"

[prior.class]
kind = "label_reliability"
p_label_true = 0.8
why  = "P(a mask with this label is really this class); near YOLOE's median confidence on the real bed (.85, detcheck3). Owner may change it (11-14)"
fit_error_H_m = 0.03
fit_error_w_m = 0.04
fit_error_h_m = 0.04
fit_error_why = "rms of the final box-fit error vs Webots GT over objects_live4 + objects_live5 (n = 2, provisional, owner option A 11-14)"

[prior.explaining_away]
kind = "known_surface_mixture"
source = "room.walls"
weight = 0.25
sigma_m = 0.05
one_sided = true
why  = "a mask point on a wall is already explained"

# ── Appearance cue: evidence about the discrete front mode ─────────────────────────────────────────────
[cue.door_seam]
kind = "horizontal_seam"
face_candidates = "camera_facing"
min_face_area_px = 900
min_confidence = 0.10
single_face_sufficient = true
why  = "drawer seams mark the front face absolutely, as a fridge door's seam does (parameters kept from refrigerator_concept, unmeasured on nightstands)"

[sensing]
primary   = "zed.masks:nightstand"          # YOLOE household-v3 label (detection check detcheck3, 2026-11-13)
secondary = ["lidar3d.helios", "zed.rgb"]
peripheral = "ricoh.bearing"

[display]
mesh = "meshes/nightstand.obj"
