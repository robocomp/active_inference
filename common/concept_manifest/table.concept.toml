# table.concept.toml — WHAT a table IS.
#
# STEP 1 (proposal, 2026-08-03): written ALONGSIDE the live config, generating nothing. Values EXTRACTED from
# table_belief.h (TableBeliefParams defaults) + etc/config.toml. Written as a DELIBERATE CONTRAST to
# refrigerator.concept.toml — the question step 1 exists to answer is whether two agents really do reduce to a
# handful of differing declarations. Read the two side by side; the answer is written up at the bottom.
#
# Same rule: world facts only. Gates, debounces and frame counts are lifecycle and belong to the shared modules.

[concept]
name       = "table"
graph_type = "object"
subtype    = "table"        # ALSO a fitted output here: round vs square is model-SELECTED at runtime
agent_id   = 7

[model]
shape          = "hollow_plate"     # a thin top + legs; the solid band is an ABSTRACTION of mostly-empty space
                                    #   ⇒ REMOVE must use rc::exist::hollow_delta, NOT solid_delta:
                                    #     a beam under the top passes through space the model never claimed
support        = "leg_supported"    # top slab at z≈H, 4 legs to the floor — NOT floor-anchored
state          = ["cx", "cy", "H", "w", "h", "yaw", "t"]
symmetry       = "c2v"              # near-square footprint ⇒ 90° w<->h ambiguity is REAL and must be carried
symmetry_chart = "quotient"         # [s, a1, a2] chart (optional) so yaw has no snap and sigma_yaw stays honest
opens          = "none"             # no hinged face ⇒ no clearance prior, no door cue
shape_variants = ["round", "square"]   # selected online by free energy, published to object_subtype

# ★t = a slowly-varying DEPTH-TILT calibration state, CO-ESTIMATED. Not a prior — a nuisance parameter the
# fridge does not have. A persistent depth tilt shears the footprint and aliases into yaw; capping it per frame
# is a bias/variance trap, so it is estimated and subtracted, and its uncertainty folds into sigma_yaw.
[model.nuisance.depth_tilt]
dim = "t"
tilt_std = 0.020
bias_std = 0.015
scale_std = 0.010
why = "a shared per-frame depth affine aliases into yaw at grazing views; marginalise it rather than cap it"

# ── Priors ─────────────────────────────────────────────────────────────────────────────────────────────
[prior.size]
kind = "gaussian"
dims = ["w", "h", "H"]
std_m = 0.30
why  = "BROAD and mean-less: only breaks the empty-cloud degeneracy. Tables vary far too much to assert a size"

[model.geometry]
# ★★THE SPAN KEYS WERE MISSING UNTIL 2026-08-17, AND THE BLOCK EXISTING MADE THAT INVISIBLE. This section was
# here, so it looked declared; but load_geometry() reads model.geometry.{support,z_top_m,extent_m,from}, and
# none of those were present — support parsed as `unknown`, valid came back FALSE, and the declarative
# geometry was inert while the file read as complete. A block that exists with the wrong keys is worse than
# an absent one: the absence is visible.
support   = "floor_anchored"       # floor_anchored | leg_supported | hangs | counter_top | resolved
z_top_m   = 0.75                   # prior mean of the SURFACE height — the body spans [0, table_height]
extent_m  = 0.75                   # floor_anchored ⇒ extent == z_top, stated rather than derived so a clone
                                   # that CHANGES the support cannot keep a floor-referenced extent silently
from      = "nominal"              # measured | fitted | nominal | inherited
why_span  = """
A table stands on the floor, so the body spans [0, table_height] and the fitted DOF is the SURFACE height.
Declaring it is what lets band_contains_body() speak: every vertical band this agent derives (LiDAR
pre-selection, support-bank point ownership, the existence carve) is floor-referenced by inheritance — correct
HERE, and wrong the moment this file is cloned for something that hangs or sits on a counter, which is exactly
what happened to hood_concept.

The model is leg_supported in SHAPE, but the BODY still starts at the floor, so floor_anchored is the honest
span statement; leg geometry stays below. `nominal` — 0.75 m is the class template in table_model.h, not a
measurement of this table.
"""

top_thickness_m = 0.03
leg_radius_m = 0.025
why = "fixed, not fitted — the top/leg attribution band for the compound SDF"

# ── What a table DOES NOT declare, and why (the interesting half of this exercise) ──────────────────────
# prior.footprint          — absent: no canonical table footprint exists (0.6 m side table .. 2.4 m dining)
# prior.height             — absent: H is well observed top-down and needs no anchor
# prior.attachment         — absent: a table is free-standing; nothing to be flush against
# prior.clearance          — absent: opens = "none"
# prior.identity           — ABSENT AND ARGUABLY A GAP. table_concept has no shape-LLR, so a mis-detected
#                            object that fits a plausible slab has nothing pushing back on its identity.
#                            The fridge needed exactly this to stop cabinets being born as fridges.
# prior.explaining_away    — ABSENT AND A GAP. A table mask lying on a wall is not explained away, so the same
#                            phantom-over-a-wall failure the fridge had is structurally still open here.
# prior.depth_observability— absent: a table is seen top-down, so both footprint extents are observed directly

[sensing]
primary   = "zed.masks:table"
secondary = ["lidar3d.helios", "lidar3d.bpearl"]

[display]
mesh = "meshes/table.obj"

# ═══════════════════════════════════════════════════════════════════════════════════════════════════════
# STEP-1 FINDING — does the manifest idea hold up?
#
# PARTLY, and the failure is more useful than the success.
#
# 1. The two concepts do NOT reduce to a handful of differing values. They differ STRUCTURALLY:
#      shape          solid_box       vs hollow_plate     -> picks a different REMOVE policy
#      support        floor_anchored  vs leg_supported    -> different SDF decomposition
#      symmetry       none            vs c2v + quotient   -> different state chart and yaw semantics
#      state          6 DOF           vs 7 DOF (+tilt)    -> different estimator width
#      opens          front           vs none             -> clearance prior + door cue exist or do not
#      variants       none            vs round/square     -> runtime model selection or not
#    A manifest that only carried NUMBERS would not capture any of this. It has to carry these ENUMS, and each
#    enum has to select shared machinery. That is the real design: the manifest is a set of CHOICES over
#    shared components, and the numbers are secondary.
#
# 2. Where it pays off immediately is the ABSENCES. Writing table's manifest surfaced two gaps in minutes that
#    nobody had listed, because there was no list to have a hole in:
#      - no prior.identity      -> nothing resists a mis-detection that fits a plausible slab
#      - no prior.explaining_away -> the phantom-over-a-wall failure fixed in the fridge is still open here
#    Both are exactly the class of bug that cost days on the fridge. `shape = hollow_plate` also states in one
#    line the fact that took a session to rediscover: the table's solid band is an abstraction, so its LiDAR
#    free-space is not trustworthy — which is why hollow_delta exists.
#
# 3. Cost estimate for step 2 (generate the params struct + TOML from this): the numeric half is mechanical.
#    The enum half means giving each choice a real dispatch point (shape -> delta fn, support -> SDF,
#    symmetry -> chart). Those dispatch points mostly EXIST already; they are just selected by hand-written
#    code per agent instead of by declaration.
#
# RECOMMENDATION: keep the manifest, but treat it as a CHOICE MANIFEST over shared machinery, not a parameter
# file. Before step 2, close the two gaps this exercise surfaced in table_concept — they are live bugs, and
# they are worth more than the codegen.
# ═══════════════════════════════════════════════════════════════════════════════════════════════════════

# ══ The table as a box-part class on the countable binary (shared-engine K2c, 2026-11-26) ══════════════════════════════════
# Read by countable_concept only (table_concept/etc/countable.toml). The legacy table_concept agent reads the blocks above and none
# of these; no value it reads was changed. Every fraction and range below is CLASS KNOWLEDGE (furniture retailers' size guides and
# woodworking guides, cited per value), written and committed before any code, replay or live run of a table on the countable
# binary. None is from the Webots world.
#
# The class is what the detector calls "table": the retina maps YOLO's "dining table" AND "coffee table" to it
# (retina/src/yolo_processor.cpp), so the ranges below span both.
#
# θ = (cx, cy, H, w, h, yaw) is the table TOP's box: w, h = the top's extents along local x, y; H = the top surface's height.
# A table has NO front and NO labelled sides, so θ's (w, h, yaw) carries the symmetry the [model] block calls c2v: the four
# representations (w, h, yaw), (w, h, yaw + π), (h, w, yaw ± π/2) are the SAME table. [shape] symmetry = "c2v" states it to the
# countable binary, which then requires every model term to be invariant under that group (the parts below are; see the K2c report).
# Note: the legacy [model].state carries 7 DOF (+ the depth tilt t); the countable θ has 6, its per-view camera latents carry t.
#
# ★SPEC DEVIATION (K2c fix round 1, review I2): the [model] block above says "symmetry = c2v ... 90° w<->h ambiguity is REAL and must
# be carried" and the spec (2026-11-23 shared-engine design, Engine shape) names "table: N = 7 in the quotient chart". The countable
# class DELIBERATELY does neither:
#   - N = 6, not 7: the depth tilt t is the persistent engine's per-view camera shared error (one per DOF, yaw included); a θ copy
#     would count it twice.
#   - no quotient chart: the c2v sheets (w,h,yaw), (w,h,yaw+π), (h,w,yaw±π/2) are ONE table, every model term is required invariant
#     (the loader and rc::symmetric_config_violation refuse otherwise), the group acts freely, so one sheet of the plain chart is a
#     chart of the quotient and the four "modes" carry no variance.
#   - the genuinely DIFFERENT near-square alternative — the same box turned 90° WITHOUT the w↔h swap — is NOT carried: the Laplace
#     Gaussian holds one local optimum. Why: for a square top it is the same solid; for a near-square one it differs by |w − h| in
#     the footprint, so a wrong pick is an extent error of |w − h| (graded correctly only modulo the group), not a 90° yaw error; a
#     rectangular top's data separate the two. The legacy table carried it as p(1−p)(π/2)² in σ_yaw (and runs with
#     QuotientChart = false). The owner is told; see .superpowers/sdd/2026-11-23-shared-engine/task-K2c-report.md §2.
#
# Sources:
#   [BAS-G] Bassett Furniture, "The Complete Guide to Table Sizes" (bassettfurniture.com/blog/complete-guide-to-table-sizes.html):
#           rectangular dining tables "between 36" and 40" wide"; "A table that seats four should be about 48" long", six to eight
#           "at least 78" long"; square dining tables "between 36" and 44" wide"; coffee table height "typically ranges from 15" to 20"".
#   [BAS-C] Bassett Furniture, "Standard Furniture Sizes and Dimensions" chart (bassettfurniture.com/standard-furniture-dimensions.html):
#           coffee table width 18", length 36–48", height 19"; dining table height 29".
#   [RF]    Raymour & Flanigan dining-table size guide (raymourflanigan.com/blog/expertise/guides/dining-table-size-guide), read through
#           a web-search summary (the page refused the fetch, 403): 84" long for six to eight, 96" for eight to ten; height 28–30",
#           30" the most common.
#   [TL]    TableLegs.com, "A Guide to Table Top Thickness" (tablelegs.com/resources-how-tos/a-guide-to-table-top-thickness/):
#           tops "from 3/4" to an impressive 1 3/4"".
#   [LEG]   a designer's table-leg guide (coohom.com, "best legs for diy table: a designer's guide"), read through a web-search summary
#           (page not opened): solid wood legs "2.5–3 inches square" for a 72–84" table.
#   [OVH]   a Fine Woodworking forum thread ("size of table base", finewoodworking.com/forum/size-of-table-base), read through a
#           web-search summary (page not opened): a leg-and-apron table needs "at least 2 inches of overhang". Other bases
#           (stretcher, pedestal) overhang 8–14" — the parts below are the four-corner-leg table; see the K2c report.
# Ranges used:
#   either top extent (unlabelled): 18" (coffee-table width [BAS-C]) .. 96" (the longest dining table [RF]) = 0.457 .. 2.438 m,
#                                   mid 1.448 m (the fractions below are of this mid value);
#   height H: 15" (the lowest coffee table [BAS-G]) .. 30" (dining [RF]) = 0.381 .. 0.762 m;
#   top thickness t: 3/4" .. 1 3/4" = 0.019 .. 0.044 m [TL];
#   leg: 2.5–3" square, mid 0.070 m [LEG] ⇒ w_f = h_f = 0.070 / 1.448 = 0.048;
#   overhang: 2" = 0.051 m [OVH] ⇒ 0.035 of the mid extent; leg centre at ±(0.5 − 0.035 − 0.024) = ±0.441.

[shape]
from = "nominal"
solid = "parts"     # the [[shape.part]] rows below ARE the model's solid (camera SDF, beam parts, carve): the top and four legs
symmetry = "c2v"    # no front, no labelled sides: the model must be invariant under (w,h,yaw) → (w,h,yaw+π), (h,w,yaw±π/2)
layer_spread_m = [
    0.0,    # cx: the layers share the centre (the legs stand symmetric under the top)
    0.0,    # cy: as cx
    0.0,    # H: the top surface is the top every sensor sees
    0.10,   # w: the top's extent vs the legs' outer extent, 2 × the 2" overhang [OVH]
    0.10,   # h: as w (no labelled sides)
    0.0,    # yaw: every layer shares the table's axes
]
layer_spread_source = "four-corner-leg table: the legs stand 2 inches in from the top's edge on each side (Fine Woodworking forum, leg-and-apron table, via a search summary), so the top layer is 2 x 0.051 m = 0.10 m wider than the leg layer along each axis. Not from the Webots world."

# ── The parts (fractions of θ; z boundaries named "top_under" are the class proportion below) ──
#   top  : the full footprint; z from top_under to H (the slab, thickness t = (1 − top_under)·H).
#   legs : 0.070 m square [LEG] at the corners, 2" in from the edge [OVH]; z from the floor to the top's underside.
# The set is invariant under (x_f, y_f, w_f, h_f) → (−x_f, −y_f, w_f, h_f) and → (y_f, −x_f, h_f, w_f): what symmetry = "c2v" requires.
# NOT modelled: an apron (a rail under the top, between the legs; present on many dining tables, absent on others — a part the class
# varies on by presence, which a proportion cannot carry). The parts under-claim it: a beam that hits it is explained by the foreign
# density, not refuted against claimed solid.

[[shape.part]]
name = "top"
x_f = 0.0
y_f = 0.0
w_f = 1.0
h_f = 1.0
z0_f = "top_under"
z1_f = 1.0
why = "the table top, thickness 3/4–1 3/4 in [TL] through the top_under proportion"

[[shape.part]]
name = "leg_a"
x_f = -0.441
y_f = -0.441
w_f = 0.048
h_f = 0.048
z0_f = 0.0
z1_f = "top_under"
why = "2.5–3 in square leg [LEG], 2 in in from the edge [OVH]"

[[shape.part]]
name = "leg_b"
x_f = 0.441
y_f = -0.441
w_f = 0.048
h_f = 0.048
z0_f = 0.0
z1_f = "top_under"
why = "2.5–3 in square leg [LEG], 2 in in from the edge [OVH]"

[[shape.part]]
name = "leg_c"
x_f = 0.441
y_f = 0.441
w_f = 0.048
h_f = 0.048
z0_f = 0.0
z1_f = "top_under"
why = "2.5–3 in square leg [LEG], 2 in in from the edge [OVH]"

[[shape.part]]
name = "leg_d"
x_f = -0.441
y_f = 0.441
w_f = 0.048
h_f = 0.048
z0_f = 0.0
z1_f = "top_under"
why = "2.5–3 in square leg [LEG], 2 in in from the edge [OVH]"

# ── The proportion (spec G4, K2a-L): the top's UNDERSIDE as a fraction of H, i.e. 1 − t/H. It sets the top's thickness AND the legs'
# height, the boundary a table genuinely varies on (H itself is θ). Uniform over the class range ⇒ mean (lo + hi)/2, σ = (hi − lo)/√12.
#   lo = 1 − 0.044/0.381 = 0.883 (the thickest top on the lowest table); hi = 1 − 0.019/0.762 = 0.975 (the thinnest on the tallest).
#   Δ = 0.092, σ = 0.027, midpoint 0.929.
[[shape.proportion]]
name = "top_under"
lo = 0.883
hi = 0.975
source = "table top thickness 3/4 to 1 3/4 in (TableLegs.com, A Guide to Table Top Thickness); table height 15 in (lowest coffee table, Bassett guide) to 30 in (dining, Raymour & Flanigan via a search summary). lo = 1 - 0.044/0.381, hi = 1 - 0.019/0.762."

[prior.permanence]
# The volatility's hyperprior (countable persistent path): Q is inferred around q0 = rate * dt * scale^2 (spike-and-slab).
from = "nominal"
move_rate_per_day = 0.14
move_scale_m = 0.1
move_scale_rad = 0.1
source = "uncited convention: a table is nudged when chairs are pulled against it or the floor is cleaned, about once a week (1/7 per day), by about 0.1 m and 0.1 rad; rearranged far more rarely. Not measured; not from the Webots world."

[prior.class]
kind = "label_reliability"
p_label_true = 0.8
why  = "P(a mask with this label is really this class): the same value as the other countable classes (YOLOE's median confidence on the real bed, .85, detcheck3). Not measured on tables."
