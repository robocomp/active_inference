# toilet.concept.toml — WHAT a toilet IS.
#
# Scaffolded 2026-11-14 from refrigerator.concept.toml (tools/scaffold_from_refrigerator.sh): a box with a front face,
# floor-standing, its back against a wall. World facts below are MEASURED on the Webots model the agent is first
# validated on (threerooms-piso): Toilet.proto bounding boxes: plan 0.58 wide x 0.73 deep, bowl top 0.46, tank top 1.02. They are this world's toilet, not a class survey — widen the stds
# before trusting them on another toilet. Model constants (precisions, explain-away) are the parent's, re-used as
# properties of the BOX model rather than of a fridge.

[concept]
name       = "toilet"
graph_type = "object"
subtype    = "toilet"
agent_id   = 31

[model]
shape          = "solid_box"
support        = "floor_anchored"
state          = ["cx", "cy", "H", "w", "h", "yaw"]
symmetry       = "none"
opens          = "front"            # the bowl; the tank stands against the wall (0.18 m off it in the world, hence reach 0.25). No appearance cue

[model.geometry]
support   = "floor_anchored"
z_top_m   = 0.90
extent_m  = 0.90
from      = "measured"
why       = "Webots threerooms-piso: Toilet.proto bounding boxes: plan 0.58 wide x 0.73 deep, bowl top 0.46, tank top 1.02"

[prior.footprint]
kind = "gaussian"
dims = ["w", "h"]
mean_m = 0.58
depth_mean_m = 0.73
std_m = 0.08
why  = "measured on the Webots model. Plan is NOT square: mean_m is the width (local X), depth_mean_m the front-to-back depth (local Y)."

[prior.height]
kind = "gaussian"
dims = ["H"]
mean_m = 0.90
std_m = 0.15
why  = "the mask's robust top (the tallest part the detector covers), measured on the Webots model"

[prior.depth_observability]
kind = "conditional_precision"
dim = "h"
precision = 20000.0
observed_band_m = 0.10
why  = "box-model constant kept from refrigerator_concept: depth is identifiable only once the cloud spans it"

[prior.top]
kind = "two_sided_anchor"
dim = "H"
precision = 10000.0
margin_m = 0.02
target = "observed_robust_top"
why  = "box-model constant kept from refrigerator_concept"

[prior.attachment]
kind = "wall_flush"
face = "back"
precision = 400.0
parallel_precision = 200.0
reach_m = 0.25
no_cross_precision = 2000.0
why  = "the back rests against a room wall"

[prior.clearance]
kind = "facing_free_space"
face = "front"
gain_nats = 3.0
why  = "the front faces the room, never the wall it stands against — resolves the 180° ambiguity"

[prior.identity]
kind = "shape_log_evidence_ratio"
aspect_scale = 0.15
size_scale = 0.12
alt_size_scale = 0.50
height_min_m = 0.50
height_soft_m = 0.08
why  = "aspect is scored against the class's own aspect; height_min sits well below the measured height"

[prior.explaining_away]
kind = "known_surface_mixture"
source = "room.walls"
weight = 0.25
sigma_m = 0.05
one_sided = true
why  = "a mask point on a wall is already explained"

[sensing]
primary   = "zed.masks:toilet"          # YOLOE household-v3 label (detection check detcheck3, 2026-11-13)
secondary = ["lidar3d.helios", "zed.rgb"]
peripheral = "ricoh.bearing"

[display]
mesh = "meshes/toilet.obj"
