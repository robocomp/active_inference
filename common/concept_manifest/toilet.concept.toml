# toilet.concept.toml — WHAT a toilet IS.
#
# Scaffolded 2026-11-14 from refrigerator.concept.toml (tools/scaffold_from_refrigerator.sh): a box with a front face,
# floor-standing, its back against a wall. World facts below are MEASURED on the Webots model the agent is first
# validated on (threerooms-piso): Toilet.proto bounding boxes: plan 0.58 wide x 0.73 deep, bowl top 0.46, tank top 1.02. They are this world's toilet, not a class survey — widen the stds
# before trusting them on another toilet. Model constants (precisions, explain-away) are the parent's, re-used as
# properties of the BOX model rather than of a fridge.

[concept]
name       = "toilet"
graph_type = "object"
subtype    = "toilet"
agent_id   = 31

[model]
shape          = "solid_box"
support        = "floor_anchored"
state          = ["cx", "cy", "H", "w", "h", "yaw"]
symmetry       = "none"
opens          = "front"            # the bowl; the tank stands against the wall (0.18 m off it in the world, hence reach 0.25). No appearance cue

[model.geometry]
support   = "floor_anchored"
z_top_m   = 0.90
extent_m  = 0.90
from      = "measured"
why       = "Webots threerooms-piso: Toilet.proto bounding boxes: plan 0.58 wide x 0.73 deep, bowl top 0.46, tank top 1.02"

[prior.footprint]
kind = "gaussian"
dims = ["w", "h"]
mean_m = 0.58
depth_mean_m = 0.73
std_m = 0.08
why  = "measured on the Webots model. Plan is NOT square: mean_m is the width (local X), depth_mean_m the front-to-back depth (local Y)."

[prior.height]
kind = "gaussian"
dims = ["H"]
mean_m = 0.90
std_m = 0.15
why  = "the mask's robust top (the tallest part the detector covers), measured on the Webots model"

[prior.depth_observability]
kind = "conditional_precision"
dim = "h"
precision = 20000.0
observed_band_m = 0.10
why  = "box-model constant kept from refrigerator_concept: depth is identifiable only once the cloud spans it"

[prior.top]
kind = "two_sided_anchor"
dim = "H"
precision = 10000.0
margin_m = 0.02
target = "observed_robust_top"
why  = "box-model constant kept from refrigerator_concept"

[prior.attachment]
kind = "wall_flush"
face = "back"
precision = 400.0
parallel_precision = 200.0
reach_m = 0.25
no_cross_precision = 2000.0
class_prior = 0.95                  # P(against a wall): the concept holds it (owner 2026-11-14)
why  = "the back rests against a room wall — a toilet's tank is plumbed into a wall"
standoff_m = 0.03                   # F1.4: the tank's back off the finished wall
standoff_std_m = 0.02
# Persistent path: this stand-off IS the no-cross knowledge ("the back stands at or off the wall"); no separate no-cross term is
# entered for a class that declares it (coordinator ruling 11-24: a probit on top counted sigma_wall twice). no_cross_precision
# above is the legacy path's hinge only.
standoff_source = "weak: rough-in note and forum reports. Convention for a two-piece toilet on its matching rough-in (the drain 12 in / 305 mm from the finished wall, the US norm): the tank clears the wall by roughly 0.5-2 in (13-50 mm) depending on the model; a 12 in toilet on a 14 in rough-in leaves about 2 in (TOTO, 'Toilet rough-ins and the cleverness of TOTO's Unifit rough-in', totousa.com); 1-2 in reported on 12 in toilets and ~0.5 in preferred so the lid lifts clear (alt.home.repair; forum.heatinghelp.com); no manufacturer spec sheet read. Not from the Webots world (its toilet stands 17-18 cm off: about 7 sigma, reported, not fitted)."

[prior.permanence]
# The volatility's hyperprior (persistent path, F1 round 6): Q is inferred around q0 = rate * dt * scale^2 (spike-and-slab).
from = "nominal"
move_rate_per_day = 0.00014
move_scale_m = 0.1
move_scale_rad = 0.1
source = "uncited convention: a toilet is plumbed in and moved only in a renovation, about once in 20 years (1/7300 per day), and then only to its new flange (0.1 m, 0.1 rad). Not measured; not from the Webots world."

[prior.alignment]
kind = "room_axis"
fold = 4
std_deg = 3.0
why  = "furniture is aligned with the room's axes; 4-fold, so it never decides front/back"

[prior.clearance]
kind = "facing_free_space"
face = "front"
gain_nats = 3.0
why  = "the front faces the room, never the wall it stands against — resolves the 180° ambiguity"

[prior.identity]
kind = "shape_log_evidence_ratio"
aspect_scale = 0.15
size_scale = 0.12
alt_size_scale = 0.50
height_min_m = 0.50
height_soft_m = 0.08
why  = "aspect is scored against the class's own aspect; height_min sits well below the measured height"

[prior.class]
kind = "label_reliability"
p_label_true = 0.8
why  = "P(a mask with this label is really this class); near YOLOE's median confidence on the real bed (.85, detcheck3). Owner may change it (11-14)"
fit_error_H_m = 0.05
fit_error_w_m = 0.26
fit_error_h_m = 0.15
fit_error_why = "rms of the final box-fit error vs Webots GT over objects_live4 + objects_live5 (n = 2, provisional, owner option A 11-14)"

[prior.explaining_away]
kind = "known_surface_mixture"
source = "room.walls"
weight = 0.25
sigma_m = 0.05
one_sided = true
why  = "a mask point on a wall is already explained"

[sensing]
primary   = "zed.masks:toilet"          # YOLOE household-v3 label (detection check detcheck3, 2026-11-13)
secondary = ["lidar3d.helios", "zed.rgb"]
peripheral = "ricoh.bearing"

[display]
mesh = "meshes/toilet.obj"

# ── Layer spread (spec 2026-11-23 shared-engine G4): which layer of a REAL toilet the box means ──
# A toilet is a tank on a bowl on a pedestal, each a different width and depth: a sensor sees one of them. Its top is the tank lid. Δ is their
# spread on a typical real two-piece toilet (class knowledge, NOT the Webots mesh), in [model].state order.
[shape]
from = "nominal"
solid = "parts"   # K2a: the [[shape.part]] bowl + tank below ARE the model's solid (camera SDF, beam parts, carve)
layer_spread_m = [
    0.06,   # cx: the depth layers are all at the FRONT (the pedestal foot is set back from the bowl's front by 10-15 cm; the tank's back is the back of every layer), so the outer layer's centre sits ~half the depth spread forward; room-frame cx/cy, so the full shift on each (the yaw is not class knowledge)
    0.06,   # cy: as cx
    0.0,    # H: not graded: the tank lid is the top every sensor sees on a toilet with a tank; tank vs tankless is variation WITHIN the class, which belongs to the H prior std ([prior.height] std_m 0.15), not to a rho = 1 layer latent. The toilet is graded on its footprint (w, h)
    0.25,   # w: tank 43-53 cm wide vs bowl 36-39 cm vs pedestal foot 22-30 cm
    0.12,   # h: the bowl's front vs the pedestal foot's front, 10-15 cm back
    0.0,    # yaw: every layer shares the toilet's axes
]
layer_spread_source = "plumbing-fixture dimension conventions for a real two-piece toilet: tank 17-21 in (43-53 cm) wide, bowl about 14-15 in (36-39 cm) wide, pedestal foot 9-12 in (22-30 cm) wide; the pedestal foot set 4-6 in (10-15 cm) back from the bowl's front. H is not graded (Delta_H = 0): the tank lid is the top every sensor sees; tank vs tankless is variation within the class, carried by the H prior std. Not from the Webots Toilet.proto."

# ── The solid: a bowl and a tank (shared-engine K2a; the P1 diagnosis task-P1-toilet-bias-diagnosis.md) ──
# One box on this stepped shape put its front BETWEEN the bowl front and the tank front (0.4-0.5 m apart) and so its centre
# 23 cm off at d2 ~ 100. solid = "parts" makes these two boxes the MODEL's solid (camera SDF and beam parts,
# common/ai_belief/parts_geometry.h), not only the existence carve's. The fitted box (cx, cy, H, w, h, yaw) stays the
# bowl + tank FOOTPRINT envelope (the graded quantity): w = the widest part (the tank), h = tank back to bowl front, H = tank lid.
# The bowl / tank boundary is the class PROPORTION bowl_top ([[shape.proportion]] at the end, K2a-L, owner-approved): a ρ = 1 latent
# of the engine, mean 0.561, σ 0.066, estimated with θ (the fixed 0.57 of K2a made the estimate bistable in it,
# task-K2a-report.md). The OTHER fractions are still fixed and their spread is NOT modelled: the G4 layer spread above is per
# θ-DOF (Δ_H = 0), so the tank depth h_f (and y_f with it) and the bowl width w_f carry no uncertainty anywhere in the model.
# Fractions (class knowledge, NOT the Webots mesh), from two manufacturer spec sheets of two-piece floor-mount toilets on a 12 in
# rough-in (Kohler, "all product dimensions are nominal"):
#   Kohler K-3519 Highline Classic: 30-1/8 in (765 mm) long x 21-1/4 in (540 mm) wide x 31-1/4 in (794 mm) high; tank 8-5/8 in
#     (219 mm) deep; bowl rim 17-1/4 in (438 mm)   (resources.kohler.com/webassets/kpna/catalog/pdf/en/K-3519_spec.pdf)
#   Kohler K-3979 Highline: 29-3/4 in (756 mm) long x 18-1/8 in (460 mm) wide x 31-1/4 in (794 mm) high; tank 8-5/8 in (219 mm)
#     deep; bowl height 16-1/2 or 16-5/8 in (419 / 422 mm; the drawing carries both, which is which is not legible in the text)   (s3.amazonaws.com/s3.supplyhouse.com/product_files/K-3979_spec_US-CA_Kohler_en.pdf)
#   the seat adds about 1 in: American Standard lists bowl height 16-1/2 in without the seat, 17-1/2 in with it (Lowe's listing,
#     American Standard Clean, chair height, 2-piece, 12 in rough-in). The bowl part's top is the seat/rim surface, because that
#     is the surface the sensors' likelihood fits (spec A3); this value was fixed before any evaluation
#   tank 17-21 in (43-53 cm) wide vs bowl about 14-15 in (36-39 cm) wide: the plumbing-fixture convention cited in
#     [shape].layer_spread_source above
# ⇒ tank depth / length = 219/765, 219/756 = 0.286, 0.290 → h_f 0.29, back-anchored (y_f = 0.5 − 0.29/2 = 0.355);
#   bowl + seat top / height = (438 + 25)/794, (422 + 25)/794 = 0.583, 0.563 (0.559 with 419): the K2a fixed value 0.57, now the
#     proportion bowl_top (its class range, below, covers it);
#   bowl width / tank width = 14.5/19 = 0.76.
# The bowl spans the full length (its front is the box front; its deck runs under the tank to the back), z from the floor to the
# seat; the tank is the full width, back-anchored, from the seat height to the lid (H). The pedestal's narrower foot is inside the
# bowl box (the G4 spread Δ_w, Δ_h covers its footprint), so N stays 2.

[[shape.part]]
name = "bowl"
x_f = 0.0
y_f = 0.0
w_f = 0.76
h_f = 1.0
z0_f = 0.0
z1_f = "bowl_top"   # the class proportion (K2a-L)
why = "class knowledge: Kohler K-3519 / K-3979 spec sheets; the top is the proportion bowl_top (see the blocks above)"

[[shape.part]]
name = "tank"
x_f = 0.0
y_f = 0.355
w_f = 1.0
h_f = 0.29
z0_f = "bowl_top"   # the class proportion (K2a-L)
z1_f = 1.0
why = "class knowledge: Kohler K-3519 / K-3979 spec sheets (see the block above)"

# ── Proportion latents (K2a-L, owner-approved model-level fix; spec G4): the fractions whose real-world value is uncertain ──
# Each [[shape.proportion]] is a ρ = 1 latent of the class: mean the midpoint of [lo, hi], variance Δ²/12 (Δ = hi − lo, a uniform
# spread over the class range), estimated from the data like any shape latent. lo/hi come from CLASS KNOWLEDGE ONLY, written down
# before any replay (this block was committed on its own, before the code that reads it and before any evaluation with it).
#
# bowl_top = the bowl part's top (the seat-or-rim surface the sensors fit) as a fraction of H (the tank lid). The class covers
# standard to chair height, with and without a seat:
#   top of the seat: 15 in (380 mm) minimum (residential dwelling units) to 19 in (485 mm) maximum — ABA Accessibility Standards
#     §604.4 and its Exception 2 (access-board.gov/aba/chapter/ch06; the general §604.4 range is 17-19 in);
#   without a seat the bowl top is the rim, about 1 in lower (American Standard: bowl height 16-1/2 in without the seat, 17-1/2 in
#     with it; the Lowe's listing cited above) ⇒ the lowest bowl top ≈ 14 in (355 mm);
#   overall height H of a two-piece toilet: 28-1/4 in (718 mm, Gerber Ultra Flush combo 21-302: "Height 28 1/4") to 31-1/4 in
#     (794 mm, Kohler K-3519 and K-3979 above).
#   ⇒ lo = 355 / 794 = 0.447 (lowest bowl top on the tallest toilet), hi = 485 / 718 = 0.675 (highest seat top on the shortest).
# Δ = 0.228 ⇒ σ = Δ/√12 = 0.066; midpoint 0.561. (The fixed 0.57 of K2a lies inside; this range was not chosen from any dump.)
[[shape.proportion]]
name = "bowl_top"
lo = 0.447
hi = 0.675
source = "ABA Accessibility Standards 604.4 + Exception 2: seat top 15 in (380 mm, residential) to 19 in (485 mm); rim ~1 in below the seat top (American Standard listing: 16-1/2 in without seat, 17-1/2 in with); overall height 28-1/4 in (718 mm, Gerber 21-302) to 31-1/4 in (794 mm, Kohler K-3519/K-3979). lo = 355/794, hi = 485/718."
