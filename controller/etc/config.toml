[Proxies]
# Proxies for required interfaces
OmniRobot = "omnirobot:tcp -h localhost -p 10004"

# --- Common Agent Data ---
[Agent]
id = 8 
name = "controller"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree = false
graph = false   # DSR graph viewer optional: the planner GUI is its own top-level window (ControllerDisplay)
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Period]
Compute = 100
Emergency = 500

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

[Presence]
required_agent_names = ["robot_concept", "room_concept"]
config_dir = "etc"
monitor_period_ms = 500
# Controller is the heaviest compute agent (MPPI/torch runs on the Qt main thread, which also
# drives the presence monitor). Its own compute bursts were observed freezing the monitor for up
# to 14 s, so a 3 s timeout caused constant false Ready<->Stale churn against perfectly-alive
# peers. 15 s tolerates those bursts + normal 3-4 s heartbeat jitter. No safety cost: Stale never
# triggers node deletion (only DSR-node removal / Missing does), so a longer timeout is harmless.
heartbeat_timeout_ms = 15000
rejoin_grace_ms = 1500
stale_grace_ms = 120000  # 2 min grace: covers peer restart time before declaring lost
agent_info_period_ms = 1000

[Owns]
nodes = ["controller 8"]

[Planner]
Clearance = 0.5
GridResolution = 0.35
ConnectionRadius = 1.2

[Controller]
AffordanceLambdaCost = 0.2    # grounded EFE selection nav-cost weight (nats per metre): G = λ·dist − ΔH
AffordanceSwitchMargin = 0.5  # commitment hysteresis (nats): held affordance must be beaten by this much to switch
WaypointTolerance = 0.25
MaxAdvSpeed = 0.7
MaxRotSpeed = 0.8
PosGain = 1.2
RotGain = 1.5
PoseXYStdSlow = 0.03
PoseXYStdStop = 0.12
PoseThetaStdSlow = 0.04
PoseThetaStdStop = 0.20
MinAdvSpeedScale = 0.15
MinRotSpeedScale = 0.05
PosePredictionHorizon = 0.4
PoseXYStdGrowthPerMps = 0.5
PoseThetaStdGrowthPerRps = 1.0
AdvRotationCouplingExponent = 0.5
TemporaryObstacleHistoryScans = 5
TemporaryObstacleOcclusionDepth = 0.35
# Min lidar points for a cluster to be admitted as a temporary obstacle (both the total-unexplained
# early-bail and the per-cluster gate). 12 was too high — a thin chair at range sits right on it, so
# obstacle creation was intermittent/late and it drove through on a miss (proximity CSV: n_obst stayed
# 0 through the approach, obstacle only appeared at 0.73 m). 6 makes small objects cluster reliably and
# earlier; the tracker's existence log-odds filter prunes transient false positives.
TemporaryObstacleMinPoints = 6
# LiDAR height band (m, ≈ height above floor). Min is a floor-plane reject cutoff: the lowest beam
# grazes the floor into a dense ring at ~0.11-0.18 m, so this MUST stay above it (0.20 known-good).
# Going lower (e.g. 0.10) floods the controller with phantom floor obstacles. See the [LidarZ] histogram.
TemporaryObstacleMinHeight = 0.20
TemporaryObstacleMaxHeight = 1.8
# Same band for the proactive unmodelled-obstacle scan (room frame).
UnmodelledScanMinZ = 0.10
UnmodelledScanMaxZ = 1.50
TemporaryObstacleRobustLoss = "huber"
TemporaryObstacleRobustLossScale = 0.08
TemporaryObstacleExistenceInitLogOdds = 1.6
TemporaryObstacleExistenceMinLogOdds = -4.0
TemporaryObstacleExistenceMaxLogOdds = 4.0
TemporaryObstacleExistenceRemoveThresholdLogOdds = -2.2
TemporaryObstacleExistenceObservationBias = 0.30
TemporaryObstacleExistenceSupportGain = 0.06
TemporaryObstacleExistenceRememberedGain = 0.02
TemporaryObstacleExistenceWeakMissPenalty = 0.04
TemporaryObstacleExistenceAbsencePenalty = 0.65
GoalClearanceRelaxDist = 0.6
GoalObstacleMargin = 0.08
GoalClearanceMinRatio = 0.85
StraightSpeedHeadingThreshold = 0.08
StraightSpeedClearanceMargin = 0.20
StraightSpeedMinGoalDist = 1.5

# Affordance servo ("lock-on") executor — HOW (gains/caps/timing). The WHAT/WHEN (which feedback
# attributes, completion predicate, scalar target, timeout) is per-affordance and declared by the
# producing agent via the affordance_protocol Contract. Room affordances are policy=Reach (this is
# inert for them); the table affordance is policy=Servo and uses this loop.
LockOnEnabled = true
LockOnSweepSpeedMps = 0.12   # PRIMARY: distance-sweep advance speed (detectability ~ distance)
LockOnSweepRangeM = 0.45     # oscillate ± this far (m) from the arrival pose
LockOnOffsetTol = 0.15       # |normalized centre offset| deadband for yaw centring (secondary)
LockOnKYaw = 0.8             # rps per unit centre error
LockOnMaxYawRps = 0.12       # tiny caps: micro-search, not navigation
LockOnDitherYawRps = 0.10
LockOnSettleMs = 400.0       # dwell before each measurement (kills motion blur / detection flicker)
LockOnStepMs = 400.0         # duration of one sweep step
LockOnMaxAttempts = 30

# Physical-stuck detection + reverse-and-turn escape. Fires when the base is COMMANDED to
# move but is NOT actually making progress (wedged below the lidar plane, scraping a frame,
# wheel slip, oscillating) — distinct from the MPPI's geometric path_blocked. Escape =
# reverse with a slight turn toward the side with more clearance, drop a temp obstacle at the
# stuck spot, then replan. Set StuckRecoveryEnabled=false to disable.
StuckRecoveryEnabled = true
StuckCmdLinEps = 0.05    # m/s — commanded linear above this = "trying to move"
StuckCmdRotEps = 0.15    # rad/s — commanded rotation above this counts too
StuckMeasLinEps = 0.02   # m/s — measured base speed below this = "not moving"
StuckMeasRotEps = 0.08   # rad/s
StuckConfirmMs = 1500    # sustained no-progress (ms) before escape fires
EscapeAdvSpeedMps = 0.15 # reverse speed (issued negative)
EscapeRotSpeedRps = 0.35 # slight turn rate during escape
EscapeDistanceM = 0.30   # back up at most this far …
EscapeMaxMs = 1500       # … or this long, whichever first
EscapeSideProbeM = 0.50  # lateral ESDF probe for turn-direction choice
EscapeRearProbeM = 0.45  # rear ESDF probe distance
EscapeRearMinM = 0.30    # rear clearance below this → rotate-in-place, no reverse

# Near-obstacle "black box": append a CSV row whenever the robot is within ProximityLogDistance of a
# tracked obstacle OR the trajectory ESDF drops that low. Lets a collision be explained afterwards
# (nearest_obst_m small but min_esdf large ⇒ the controller never saw it — e.g. self-occlusion).
ProximityLogEnabled = true
ProximityCsvPath = "proximity_obstacles.csv"
ProximityLogDistance = 0.8   # m; gate distance for logging a row (raw lidar / tracked obstacle / ESDF)

Target.EdgeType = "target"
Transforms.interpolate_rt = true
# Dead-reckon the DISPLAYED lidar cloud + robot icon forward to "now" using base velocity,
# so the overlay tracks the robot instead of trailing it by the lidar/pose latency.
Transforms.overlay_extrapolate_to_now = true
Transforms.overlay_extrapolation_max_dt_s = 0.4
# Draw the cloud one lidar frame old (query the prior scan's stamp, which room_concept has published)
# → exact registration, no extrapolation, ~60 ms older. Takes precedence over the extrapolation.
Transforms.overlay_draw_one_frame_old = true
# Append per-cycle overlay-lag diagnostics to this CSV (empty = off). Columns:
# t_ms,lidar_ts,gap_ms,vx,vy,omega,extrap_dt_s,disp_m,dtheta_rad,RTdelta_m
Transforms.overlay_csv_path = "overlay_lag_eval.csv"

# NOTE: the zero-copy media plane (LiDAR) needs NO config here. The DDS domain +
# topic are read from the media descriptor JSON attribute the producer
# (robot_concept) writes on the lidar3D node, so the consumer always uses the
# producer's dedicated media domain (isolated from Agent.domain = 0). The
# subscriber is created lazily, only once that node + descriptor exist.

