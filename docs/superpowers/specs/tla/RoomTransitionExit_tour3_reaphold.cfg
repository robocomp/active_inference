\* S1 fix (11-16): tour3 with REAP_HOLD = TRUE (door_concept reaps a door only once no cross claim executes on it). Expected: all invariants + TourCompletes hold.
CONSTANTS
    SCENARIO = "tour3"
    FIX_HOLD = TRUE
    REAP_HOLD = TRUE
    FACT_HOLD = TRUE
    CLOSE_ON_ARCHIVE = TRUE
    PHANTOMS = TRUE
    STALE_FILE = TRUE
    WRONG_RECOG = TRUE
    SURVEY_CAN_PROMOTE = TRUE
    ABSENCE_ANYTIME = FALSE
    MaxDegrade = 1
    MaxRejects = 1
    MaxPhantom = 1
    MaxRoomIds = 16
    MaxDoorIds = 40
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ExecCrossDoorLiveBeforeExit
INVARIANT ExecCrossDoorLive
INVARIANT PassageJoinsTwoRooms
INVARIANT MemoryPassagesSound
INVARIANT LiveNamesUnique
INVARIANT NameIsIdentity
INVARIANT RecallsPointRight
INVARIANT ArrivedRight
INVARIANT RoomRightAfterExit
PROPERTY RenamedInPlace
PROPERTY CrossingNoticed
PROPERTY TourCompletes
