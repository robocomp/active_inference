\* PING-PONG with the MINIMAL fix set modelled as flags (README "Minimal changes"): F1 FIX_UNPROMOTED_CROSSING (room_concept),
\* F2 FIX_FIRST_SIGHT (room_concept), F3 FIX_NO_STAGED_RECALL_GAP (ltsm). Same proto15 environment as RoomTransition_pingpong.cfg:
\* phantom/stale-identity doors, a stale identities file, false crossings, wrong recognition proposals, doorway stands.
CONSTANTS
    SCENARIO = "pingpong"
    FIX_HOLD = TRUE
    FIX_UNPROMOTED_CROSSING = TRUE
    FIX_FIRST_SIGHT = TRUE
    FIX_COMPLETE_ON_DOOR = FALSE
    FIX_NO_STAGED_RECALL_GAP = TRUE
    FALSE_CROSS_ANY = FALSE
    PHANTOMS = TRUE
    STALE_FILE = TRUE
    WRONG_RECOG = TRUE
    SURVEY_CAN_PROMOTE = TRUE
    ABSENCE_ANYTIME = FALSE
    MaxAbsent = 1
    MaxRejects = 1
    MaxFalse = 1
    MaxPhantom = 1
    MaxRoomIds = 16
    MaxDoorIds = 40
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ExecCrossDoorLiveBeforeSwitch
INVARIANT PassageJoinsTwoRooms
INVARIANT MemoryPassagesSound
INVARIANT LiveNamesUnique
INVARIANT NameIsIdentity
INVARIANT NoDuplicateRoom
INVARIANT RecallsPointRight
INVARIANT ArrivedRight
PROPERTY RenamedInPlace
PROPERTY CrossingNoticed
PROPERTY CurrentFollows
PROPERTY TourCompletes
