[Proxies]
# Proxies for required interfaces
KinovaArm = "kinovaarm:tcp -h localhost -p 15005"
Webots2Robocomp = "webots2robocomp:tcp -h localhost -p 15010"

# --- Common Agent Data ---
[Agent]
id = 9 # Change id
name = "kinova_controller"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = "/home/robocomp/robocomp/components/active_inference/kinova_controller/kinova2.json"
domain = 0
tree = false
graph = true
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Period]
Compute = 20
Emergency = 500

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
