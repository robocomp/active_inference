[Proxies]
# Proxies for required interfaces
KinovaArm = "kinovaarm:tcp -h localhost -p 15005"
Webots2Robocomp = "webots2robocomp:tcp -h localhost -p 15010"

# --- Common Agent Data ---
[Agent]
id = 11 # MUST be unique across the shared graph: room=5 robot=6 retina=9 bottle=10. id=9 collided with the retina → CRDT actor-id clash → retina SIGSEGV when the controller joined.
name = "kinova_controller"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""  # Option-A: JOIN the shared graph bootstrapped by robot_concept (robot_concept/shadow.json holds Shadow/body/room/table/kinova_arm_r). Empty ⇒ no local bootstrap. (kinova2.json was the old standalone world for bottle_from_graph=false)
domain = 0 # Option-A: MUST match the perception agents (room/robot_concept, retina, bottle_concept all on 0) to share the DSR graph. Was 1 for isolated standalone runs.
tree = false
graph = true
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Controller]
auto_start = false 
exit_on_homing_timeout = false   # unattended sweeps set true ⇒ quit on a homing jam instead of idling
monitor_log = true   # TEMP diagnostic
monitor_period = 40  # cycles between log lines; loop is 100 Hz so 40 → ~2.5 Hz
bottle_from_graph = true    # OPEN-LOOP result: read the PERCEIVED bottle (real P_bottle covariance) from the graph, with the look-up cost on, to show the closed→open-loop transition
publish_scene_to_graph = false  # opt-in: write robot->table->bottle to graph (round-trip test / siblings)
publish_joint_buffer = true  # write the rolling (stamp_ms,q) ring on kinova_arm_r for the self_calibration agent (~20Hz)
tip_log    = true  # TEMP diagnostic

# EXPERIMENT 1 — natural fine-tuning from a specialized sequence:
# run the full pick→place loop and let model precision (c) accumulate from confirmed
# grasps over round_cycles reps. false ⇒ the approach+hold baseline (Tracking holds).
learn_pick_place = true    # full pick cycle: approach → grasp → lift/retrieve → home, repeating
stop_after_grasp = false  # set true (with learn_pick_place=true) to grasp the bottle then HOLD (no lift)
stop_after_lift  = true   # EXPERIMENT GOAL: success = a CONFIRMED lift (GT bottle risen); then release + home for the next rep, skip place/retreat
generative_lift  = true   # A/B: true ⇒ two-hypothesis generative lift confirm (grasped vs empty, sequential log-Bayes, cam-open active correction); false ⇒ legacy rise/via thresholds
generative_insert = false   # A/B: CLOSE-RATE insert (v3). Control law on the sensorimotor contingency −d(palm)/d(advance): ≈1 = palm closing 1:1 with my advance (on-axis, productive) ⇒ advance FAST; ≈0 = palm not responding (seated or off-axis) ⇒ FIXED-GENTLE. Robust to the bimodal palm (derivative cancels the offset). false ⇒ fixed-novice-creep insert. (v1 trajectory-residual + v2 occupancy both regressed — see memory.)
insert_palm_near = 0.08    # [m] palm below this ⇒ bottle in the throat (acquired)
insert_near_zone = 0.05    # [m] within this EE-distance of the grasp point ⇒ never go fast
insert_fast_vel  = 0.06    # [m/s] while the palm closes productively (rate>gate) AND bottle far
insert_gentle_vel = 0.03   # [m/s] near the bottle / palm not closing — FIXED soft touch (not skill-ramped)
insert_rate_gate = 0.4     # close_rate above this ⇒ productive closing → advance fast
lift_speed       = 0.10   # [m/s] vertical rise speed during Lifting. Deliberately slow + NOT skill-boosted (lift is the risky leg); the rise is straight up, no place-blend, gentle wrist (ω≤0.5) so it doesn't cam the grip open or twist the bottle
lift_soft_ticks  = 60     # loop ticks (100 Hz → ×10 ms) to ramp lift speed 0→full. LONGER = gentler lift-off accel ⇒ bottle not jerked out of the grip at departure. Was a fixed 25 (~0.25 s); 60 ≈ 0.6 s.
lift_observe     = false  # DIAGNOSTIC: during Lifting, keep rising to full height and HOLD (gripper clamped), ignoring confirm/slip/timeout aborts — watch what physically happens to the bottle. Set false for normal pick cycling.
lift_min_confirm_rise = 0.12   # [m] keep rising until the bottle has come up this much before confirming the lift (even after the generative TRACK channel decides "grasped") — makes the vertical motion clearly observable. Must be < LIFT_HEIGHT_M (0.18).
grasp_height_frac = -0.15  # offset ABOVE model CENTER (bottle_pos=center): NEGATIVE = below the middle. -0.15 ≈ 3 cm below center (lower body)
perception_bias_ff_xy = "0 0"   # #3 OFF: the source fix (bottle_concept LambdaFreeSpace=100) now de-biases the FIT to ~1.2cm, so the controller hand-offset is no longer needed (would over-correct). Kept as a knob for residual/real-robot calibration. Was "0.035 -0.025" when the fit bias was ~6cm.

# Pragmatic resolved-rate backend: "dls" (closed form, default) or "qp" (proxQP).
# The QP with no inequalities reproduces DLS exactly — A/B it, then later steps move
# joint-limit/obstacle terms into hard QP constraints. See EFE_CONTROLLER_MATH.md §4.
solver = "qp"

# QP only: weight on the μ/elbow linear term. 0 (or ≤0) ⇒ λ² = reproduces the old
# null-space projection (redundancy strictly off the task). Larger ⇒ genuine NEO: μ/elbow
# assert in the objective and the task slack yields. Try ~0.05–0.2 to A/B the difference.
qp_redundancy_weight = 0.0
force_confidence = -1.0   # normal learning

# Look-ahead coarticulation: within this radius (m) of a transit via-point (lift-top,
# place-hover) the EE velocity is steered toward the NEXT waypoint so it ROUNDS the corner
# instead of stopping. Effective = skill_c()·this (0 for novice = baseline exact stops).
# Usable band is REACH_TOLERANCE(0.02) < r ≲ 0.05: below 0.02 the gate fires before the
# blend acts (inert); above ~0.05 the lift corner-cut nears the rise confirm and speed
# carried into the set-down hurts SPARC. 0.04 = swept optimum (skilled-rep J=time−SPARC
# best of {0,0.02,0.04,0.06}; SPARC −5.48→−4.77, cycle 6.1→5.3s, success 19/20). 0 = off.
blend_radius = 0.04

# ── Preference-field mode (option (c) prototype, steps 1–2) ───────────────────────────
# Replace the hand-coded look-ahead blend on the transit legs with a 2-via Gaussian-mixture
# preference field. ONE precision per via expresses stop-vs-pass: λ=exp(−Π/ref) is the
# terminal-speed fraction at the via. The current transit via's Π interpolates stop→pass
# with skill: novice ⇒ field_prec_stop ⇒ exact stop (PARITY with the discrete leg, step 1);
# skilled ⇒ field_prec_pass ⇒ cruise-through (EMERGENT blend, step 2). A/B: leave false to
# use the committed blend; set true to drive the same legs from the field instead. To check
# step-1 parity in isolation, set field_prec_pass = field_prec_stop (always-stop).
use_preference_field = false
field_prec_pass = 1.0     # Π of a transit via at full skill (low ⇒ pass through)
field_prec_stop = 30.0    # Π at novice / of the next attractor (high ⇒ stop)
field_prec_ref  = 6.0     # λ = exp(−Π/ref): precision → terminal-speed map
field_overlap   = 0.06    # [m] RBF width: how near the via the next-via pull ramps in

# ── Tactile re-centering (anti-tip grasp) ─────────────────────────────────────────────
# Use the per-finger fingertip tip-force asymmetry (ltipforce−rtipforce) during Inserting to
# shift the seat target laterally toward the harder-pushing finger, centring the bottle
# between the pads instead of pushing it over, and commit to Closing only when seated AND not
# pushing. Off ⇒ the old gate (commit on any single contact). recenter_sign maps the L/R
# force-asymmetry sign onto tool +X — flip it if re-centring makes tipping worse.
tactile_recenter = false
recenter_gain    = 0.02   # [m] max lateral seat shift at full L/R asymmetry
recenter_sign    = 1.0   # ±1. Now that dir comes from the BINARY bumper (cl/cr), not the ~0 graze force,
                          # dir is meaningful: left(red) contact ⇒ move the seat toward the left finger.
                          # Verified in run v3: at -1 the left bumper kept firing and the offset walked
                          # monotonically to the cap (never cleared) ⇒ wrong way; +1 moves toward the
                          # contacting finger. (The old "-1 / +1 grew wrong way" note predates the binary dir.)

# Stop-and-rectify reflex on a tip-BUMPER collision during Inserting: halt, back off, and
# shift laterally toward the contacting finger so the object enters the gripper on retry.
# Needs the tip bumpers + TGripper.{l,r}tipcontact. recenter_sign also flips this reflex's
# lateral direction — if it makes misalignment worse, flip the sign.
tip_reflex = true   # tactile loopback: on fingertip touch → STOP, retreat a bit, shift laterally, re-descend; the working offset accumulates as a persistent perception calibration (tactile_calib_)
reflex_force_thresh = 0.05   # [N] fingertip force that counts as a touch. Light bottle tips below the bridge's 0.5 N bool AND below 0.15, so trigger on the gentle contact spike directly. Lower = more sensitive.
tip_reflex_step = 0.012   # [m] lateral seat shift per fingertip hit (was 0.005). Bigger = move decisively off the contacting finger in one maneuver; clamped to TIP_REFLEX_MAX_M (0.05).

# ── Compliant close (centre the bottle during the grip) ────────────────────────────────
# While the jaws close, micro-translate the gripper laterally to NULL the L−R pad-force asymmetry so
# the bottle ends CENTRED between the pads instead of edge-gripped (the off-centre grip tips the light
# bottle on lift = the per-grasp ~50% slip that retries currently mask). Force-balance servo coupled to
# the close; gentle (slow capped accumulation) so it does not drag the bottle over. Aims to make the
# FIRST grasp reliable, not retry-padded.
compliant_close       = true
compliant_close_gain  = 0.00002   # m lateral per (N·tick) of L−R asymmetry — raise to centre faster, lower if it knocks the bottle
compliant_close_max   = 0.03      # m cap on the accumulated lateral shift
compliant_close_speed = 0.05      # m/s EE tracking of the shifting hold target
compliant_close_sign  = 1.0       # ±1 maps L−R asymmetry onto tool +X — FLIP if centring makes tipping worse (cf. recenter_sign)
# Force-3d SHEAR close (A/B vs the scalar motor-torque law above). Uses the fingertip force-3d VECTORS:
# net pad force decomposed onto tool col0 (closing) + col1 (pad-width). The pad-width shear is the off-
# centre direction the magnitude difference is blind to → centres in both lateral axes. Verify the sign
# against the [cshear] diagnostic on the first run (monitor_log) before trusting it; flip compliant_close_sign.
compliant_close_shear      = false   # ⊘ UNUSABLE 2026-06-22 (tested, peak-hold + finer thresholds): force-3d lateral < 0.003 N in ALL phases (side-probe never fired) — the finger LinearMotor slider reacts ~all contact load, so the pad force-3d reads ~nothing; the "spike" on the plot was ×30 display gain on sub-mN jitter. No tactile lateral signal exists without a Webots sensor-model fix (force sensor in the contact load path). Instrumentation (Lside/Rside plot, side-probe, peak-hold) kept.
compliant_close_shear_gain = 0.004     # m lateral per N of the PEAK first-contact lateral spike (was per-tick 0.00002). Tune once the [cshear] peak magnitude is known.
# Generative compliant close: forward model of SYMMETRIC pad loading on a centred bottle. The FRACTIONAL
# asymmetry (lf−rf)/(lf+rf) is the prediction error — ≈±1 at first contact ⇒ strong EARLY correction
# (anticipatory; the raw force-diff is weak when forces are low). Commit is SYMMETRY-GATED: only a centred
# (balanced+loaded) grip lifts — an off-centre grip is corrected or retried, never lifted+slipped.
generative_close   = false
close_asym_gain    = 0.0008   # lateral m per (fractional-asym · tick) — raise to centre faster, lower if it knocks the bottle
close_balance_tol  = 0.12     # commit only when |lf−rf|/(lf+rf) < this (centred grip)

# ── Tactile-safe insertion (novice slow → skilled fast) ───────────────────────────────
# Insert speed at novice (insert-segment c=0) as a fraction of INSERT_VEL_MS, ramping to full at
# c=1. Low ⇒ the finger has time to stop + move laterally on a graze before tipping the bottle.
# 1.0 ⇒ no novice slowdown (old behaviour).
insert_novice_frac = 0.4

# ── Palm-proximity grasp gate ─────────────────────────────────────────────────────────
# Commit to Closing only when the palm DistanceSensor sees the bottle in the throat (< palm_grasp_dist
# metres). Kills "close the fingers before the bottle". Auto-bypassed if the sensor reads 0 (absent /
# world not reloaded with the new PROTO).
use_palm_gate   = true
palm_grasp_dist = 0.08

# Palm-depth SEAT trigger: close the gripper the moment the palm ray first sees the bottle at this
# distance (m) — the depth where the bottle sits BETWEEN the finger pads. Driving deeper (to e<tol)
# rams the bottle to the palm (~0.01) and the pads close empty (gap≈0.004) → every lift slips. Raise
# to grab earlier/shallower, lower to grab deeper. Watch the [grasp] seated palm=.. and gap=.. lines.
palm_seat_dist  = 0.03   # 2026-06-22: tried 0.04 (to fix far-x insert timeouts) → REGRESSED to 1/12: closing shallower leaves the bottle a radius off-centre (gap≈0.047) → pushed out. The timeouts were a DEATH-SPIRAL symptom (violent home crept the bottle to the reach edge); the nearest_equiv home fix removes the creep, so 0.03 seats deep WITHOUT timing out. Reverted. Watch [grasp] seated palm=.. and gap=..

# ── Bottle-as-obstacle (set-down withdrawal safety) ───────────────────────────────────
# Hard QP velocity-damper constraint on the TOOL vs the bottle cylinder, active ONLY in
# PlaceRetreating — the gripper has released the bottle on the table and is backing off to
# rest, so it must not knock the standing bottle over. OFF during the pick approach/grasp.
# QP solver only.
bottle_obstacle        = true   # ON: don't tip the just-placed bottle on the way back to rest
bottle_obstacle_margin = 0.04   # [m] repel within this distance of the bottle surface
elbow_gain = 2.0
col_radius = 0.225   # body-collision cylinder radius (m) → 0.45 m diameter for the wide tray (was 0.03 column). Tune for the tray footprint.
elbow_target_xy = "-0.625 -1.5"   # null-space elbow placement target (world). Back to the default sign.

# Controlled-experiment harness: pin pick AND place so every rep repeats the same
# pick→place motion (isolates a regression from pick/place-location variance). Empty
# string ⇒ normal R2/predictive sweep. Pick = arm_base.wbt authored bottle xy.
fixed_pick_xy = ""   # empty ⇒ vary the bottle position each rep over the spawn region below (was 0.1 -0.25 = table EDGE → bottle fell off)

# Bottle respawn region (Webots/world m), must be ON the table + reachable. Table is x∈[0.1,0.9], y∈[-1.1,0.7].
spawn_x_min = 0.25
spawn_x_max = 0.55
spawn_y_min = -0.78    # arm side of the table (arm base at y=-0.58); biased toward -Y
spawn_y_max = -0.35
fixed_place_xy = "0.40 -0.25"   # world m; high-manip reachable cell (reach_map manip≈0.098). 0.15 -0.25 was near-singular (manip 0.036) ⇒ unreachable. (moot while stop_after_lift=true)
round_cycles = 10

# Rest pose "j1 .. j7" (rad). Tune the "ready over the table, camera-up" posture
# here without recompiling; relaunch to apply. Startup prints [rest-pose] metrics
# (EE pos, upperarm_dz≈0 = first link parallel to table, toolY_up≈+1 = camera up).
rest_pose = "3.14159 0.0 3.14159 1.0 0.0 1.65 -1.5705"   # PAPER rest pose (recovered from last week's experiment videos). j0=π, j2=π. bridge startup synced to this.
grasp_align_tol_deg = 11.0  # commit near the ~9.5° alignment floor (kinematic plateau at this grasp pose): 8° never reaches and stalls; 15° committed early at the worst-allowed cant. 11° = best reachable alignment without stalling.
align_tol_conf_gain = 1.0   # REVERTED 2026-06-22: setting 0.0 (pin commit at 11° vertical floor) REGRESSED to 3/15 — the vertical commit closed on empty / knocked the bottle (higher cant was AIDING capture). Slip mode is LATERAL, not cant. Back to 1.0 baseline.

# ── Skill-learning instrumentation ───────────────────────────────────────────
# Probe each pick with a small STRUCTURED perturbation of the grasp command
# (Halton sweep, not noise) and log one row per rep to dataset_path. Offline this
# yields the grasp-pose bias, the actuation response, and the per-region tolerance
# budget needed to move from closed-loop to model-based open-loop reaching.
# Leave probe_variations = false for a plain round (zero perturbation).
probe_variations = false      # VALIDATION: no perturbation
probe_pos_amp    = 0.015      # m,   half-range of tangential/axial grasp offset
probe_azi_amp    = 0.15       # rad, half-range of approach-azimuth rotation
probe_speed_amp  = 0.25       # ±fraction of nominal approach/insert speed
dataset_path     = "/tmp/kinova_skill_dataset.csv"
# Per-cycle commanded-vs-measured joint velocity log (for the actuation model G, τ).
joint_log_path   = "/tmp/kinova_joint_actuation.csv"
# Per-cycle EE speed over the whole pick-place → offline SPARC + stop-count (fluidity).
fluid_log_path   = "/tmp/kinova_fluidity.csv"

# ── Precision learning from doing (novice→skilled = accumulated model precision) ──
# confidence c = Π_m/(Π_m+Π_s) is NOT a scripted ramp: Π_m accumulates from CONFIRMED
# outcomes (Π_m += evidence_unit·quality per clean grasp) and deflates by conf_decay on a
# surprise (miss). c then reshapes the action geometry/timing (standoff_collapse, settle
# dwell, speed) — so the agent gets skilled purely by doing, and self-calibrates (it only
# speeds up as fast as the outcomes keep confirming). Π_m is persisted across rounds.
precision_reweighting = true       # EXP1: precision learning ON

# WAF ablation toggles (defaults = current full system). global_confidence: true ⇒ one shared Π_m
# (A/B vs per-segment). anticipation: false ⇒ greedy grasp azimuth + tight gate (isolate anticipation
# from precision). success_rate_baseline: true ⇒ drive knobs from a Beta(1,1) success rate, not precision.
global_confidence     = false
anticipation          = true
success_rate_baseline = false
sensory_precision     = 2.0        # Π_s (fixed): c ≈ n/(n+Π_s) over n clean reps → gradual saturation
evidence_unit         = 1.0        # Π_m added by one cleanly-confirmed rep
conf_decay            = 0.5        # Π_m ×= this on a surprise (miss)
c_floor               = 0.3        # prior-precision FLOOR: c_seg ≥ this (Π_m ≥ Π_s·c/(1−c)). Stops the insert
                                   # death-spiral (consecutive misses ×0.5 → Π_m→0 → novice-slow insert too slow
                                   # to seat → more timeouts). Pins skill at the speed that grasped reliably. 0 = off.
perception_noise_std  = 0.0        # m, σ_obs of injected bottle-pose noise (sim2real; 0 = ideal sim, unchanged behaviour)
surprise_chi          = 3.0        # Mahalanobis k: a look-up is a surprise (re-acquire+deflate) only if ‖innov‖ > k·√(P+σ_obs²)
rng_seed              = -1         # >=0 ⇒ reproducible noise realization for experiment seeds; -1 = random
conf_gain             = 0.15       # (legacy ramp; unused by the surprise-driven update)
skilled_sample_period = 12         # cycles between observations at full confidence

# Synthetic perception-latency harness: ms a real look-up (segmentation+pose) would cost. > 0 makes
# each actual look-up sleep this long, so the loop genuinely slows when it looks; as look-ups thin
# with skill the effective approach rate recovers toward 1/T_ctrl. 0 = free look-up (default).
# Perception cost model. Default: use the REAL producer bandwidth — a graph read is free but only
# carries new info when bottle_concept bumps model_generation, so the loop is open-loop between
# producer frames (τ_perc measured live as bottle_refresh_period_s_). Set use_synthetic_latency=true
# to instead pay perception_latency_ms as a literal sleep on each look-up (reproducible cost sweeps
# that don't depend on the live perception rate).
use_synthetic_latency = false
perception_latency_ms = 50.0   # only used when use_synthetic_latency=true. Closed-loop ~17 Hz, open-loop (every 12) ~70 Hz.
latency_log_path      = "/tmp/kinova_latency.csv"  # per-episode effective approach control rate
speed_conf_gain       = 0.6        # approach speed ×(1+this·confidence) — "more speed" when skilled
standoff_collapse     = 0.6        # at full c, slide the Tracking waypoint 60% from standoff toward grasp
insert_conf_gain      = 1.0        # insert speed ×(1+this·confidence) — skilled creeps in twice as fast
confidence_path       = "/tmp/kinova_confidence.txt"   # persist Π_m across rounds
metrics_path          = "/tmp/kinova_skill_metrics.csv" # per-rep: success, c, cycle time
# Fresh upright bottle teleported to the fixed pick spot at each rep start — REQUIRED for
# the 10-rep loop (after a place the pick spot would otherwise be empty).
respawn_each_rep = true       # EXP1: re-stand the bottle at the fixed pick each rep

# ── Retreat sub-skill (leaving the placed bottle) — learnable like the grasp ──────
# Retreat is a pure back-off along the gripper's own forward axis (perpendicular to the
# upright bottle), started only once the fingers are confirmed open. Explore the timing/
# speed per rep and score by the bottle's post-retreat tilt to LEARN a tip-free retreat.
retreat_speed     = 0.18        # m/s — envelope showed tip-free to 0.20
release_ticks     = 8           # cycles opening-in-place before the retreat latches (overlaps the open); was 25
predictive_place  = true    # score candidate place spots by predicted manipulability+clearance; pick best-conditioned
precompute_reach_map = true   # 0.1s — recompute every startup for this static scene
reach_map_path = "experiments/reach_map.csv"
predictive_grasp  = false   # choose grasp (side azimuth or TOP-DOWN) by scoring candidates with predict_reach
gripper_open_conf = 0.85        # gs.opening ≥ this ⇒ fingers clear → safe to move
probe_retreat     = false       # exploration done; retreat envelope is wide-open
probe_rspeed_amp  = 0.8         # speed sweep 0.024..0.216 m/s
probe_open_amp    = 0.25        # open-threshold sweep ~0.60..0.99
retreat_log_path  = "/tmp/kinova_retreat.csv"   # params → post-retreat tilt ("" disables)

[Period]
Compute = 10
Emergency = 500

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
