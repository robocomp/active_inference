[Proxies]
# Proxies for required interfaces
KinovaArm = "kinovaarm:tcp -h localhost -p 15005"
Webots2Robocomp = "webots2robocomp:tcp -h localhost -p 15010"

# --- Common Agent Data ---
[Agent]
id = 9 # Change id
name = "kinova_controller"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = "/home/robocomp/robocomp/components/active_inference/kinova_controller/kinova2.json"
domain = 1 # so it does not interfere with other experiments
tree = false
graph = true
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Controller]
auto_start = false   # arm EFE without waiting for the viewer Start button
tip_log    = true   # stream "[tiplog] cycle,t,ee_xyz,tgt_xyz,dist,v_cmd,v_meas"
approach_only = false # full FSM: approach → insert → close → lift → place
round_cycles = 5  # do a 5-fold pick-and-place round, return to rest between each
# Rest pose "j1 .. j7" (rad). Tune the "ready over the table, camera-up" posture
# here without recompiling; relaunch to apply. Startup prints [rest-pose] metrics
# (EE pos, upperarm_dz≈0 = first link parallel to table, toolY_up≈+1 = camera up).
rest_pose = "0.3 0.8 1.5 -2.101 0.651 -1.02 3.141"

[Period]
Compute = 20
Emergency = 500

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
