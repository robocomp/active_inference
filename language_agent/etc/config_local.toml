
# --- Common Agent Data ---
[Agent]
# MUST be unique across the shared graph — a collision is a CRDT actor-id clash → SIGSEGV in BOTH agents.
# 25 = language_agent (recorded in CONCEPT_AGENT_RECIPE.md §1, the source of truth).
id = 25
name = "language_agent"

# --- Single Instance Configuration ---
configFile = ""
domain = 0
tree = false
graph = false
2d = false
3d = false

[Presence]
# Nothing is REQUIRED: the chat window is useful, and says what is missing, with nothing else running.
# controller executes the commands (the gate refuses to move the robot without it); room_concept gives the room.
# ★required_agent_names is ABSENT on purpose, not `= []`: the RoboComp ConfigLoader throws on an empty array
# (viewer3d/scene_graph_viewer learned this); absent reads as the empty default.
# episodic_agent: while it is present, its memory graph (domain [EM].domain) is joined for the memory tools.
optional_agent_names = ["controller", "room_concept", "episodic_agent", "ltom_agent"]
config_dir = "etc"
monitor_period_ms = 500
heartbeat_timeout_ms = 3000
rejoin_grace_ms = 1500
stale_grace_ms = 120000
agent_info_period_ms = 1000

[Owns]
# The agent node and the ONE node it creates: the command channel to the controller (intention_node.h).
nodes = ["language_agent 25", "chat_intention"]

[EM]
# Episodic memory (episodic_agent, id 26): its graph on this DDS domain is joined READ-ONLY and LAZILY — only while
# episodic_agent is present on the live graph, dropped when it goes and re-joined when it returns (or restarts).
# Deliberately NOT an [Agent.em] sub-table: the generated code joins those at startup, and a join with no peer
# aborts the process after ~15 s (specificworker.h). 0 live, 2 ltsm memory, 4 episodic memory, 5 object memory, 7 media plane.
domain = 4

[LTOM]
# Long-term object memory (ltom_agent, id 28): joined exactly like [EM], while ltom_agent is present. find_objects and
# where_is use it to say where an object that left the live graph was last seen.
domain = 5
# "go to <remembered object>" in the robot's room turns to it, then WAITS this long for chair_concept & co. to see it
# again before the approach. Derived, not tuned: BirthFrames = 8 masks at the ZED YOLO rate (~20 Hz, 2026-11-10) is
# 0.4-0.8 s once in view; x2.5 for the turn to settle. ★ TEMPORARY: replaced by `wait until=seen(NODE)` (agreed 11-10).
look_wait_s = 2.0

[Period]
Compute = 250
Emergency = 500

[Component.Debug]
Verbose = false

[LLM]
url = "http://localhost:11434"   # LOCAL profile 2026-11-12: Orin off; gemma4:26b on the desktop 5070 Ti (shared with retina)
# qwen3-vl:8b-INSTRUCT (2026-10-12): one model for chat AND the look() camera tool. Tool choice 36/36 vs qwen3:8b
# 31/36 on tests/check_llm_tools.py, ~0.4 s median, 7.7 GiB VRAM (qwen3:8b: 6.2). ★NOT plain "qwen3-vl:8b": that tag is
# the THINKING variant, ignores think:false and spent 3000-6000 tokens (40-80 s) thinking before every tool call.
# Back to text-only: model = "qwen3:8b" (look() then fails at the model, not here — it cannot see the image).
# qwen3-vl:30b-a3b-instruct tried 2026-10-19: eval 168/204 (8b: 189/204), ~1 s answers, 61% on a 16 GB GPU, no
# visible gain live — kept for more complex scenarios; it cannot share this GPU with retina.
# 2026-10-24 (person's decision): gemma4:26b on the Orin (url above) — tools 276/279, missions 70/72, ~0.9 s on the Orin.
model = "gemma4:12b"   # LOCAL: tools eval 128/134 at 0.54 s median on the 5070 Ti (26b: 3.4 tok/s, 21% on CPU)
# plan_mission's planner request (the mission skills, temperature 0, no tools); default = model.
planner_model = "gemma4:12b"
# 262k (2026-10-31, was 16k; the user chose the full window, 2.5 GB free judged a wide margin). Measured on the Orin (32 GB unified memory) with gemma4:26b.
# Most of gemma4's layers use sliding-window attention, so the KV cache grows only ~0.6 GB per doubling. Memory in use:
#   16k 21.4 GB · 32k 21.9 · 64k 22.5 · 128k 23.3 (5.3 GB left) · 262k ~26 (2.5 GB left, too tight).
# Speed is unchanged: a 9.6k-token prompt prefills in 9.5 s at 16k vs 10.9 s at 128k, and generation runs at ~40
# tok/s at every size.
# The planner shares this value, and so do tests/check_llm_*.py: a different num_ctx makes ollama reload the model
# (~28 s cold).
# The STATE is the LAST message of a request so the rest of the prompt stays cached between turns
# (chat_session.cpp messages_for_request).
# (Before the Orin: 16k on a 16 GB desktop GPU shared with retina's YOLO and the ZED SDK; check nvidia-smi there.)
num_ctx = 32768   # LOCAL: 262k does not fit a 16 GB GPU; prompts are ~10k tokens
temperature = 0.2
# No content and no tool call within this long ⇒ the request is aborted (a cold model load is the usual cause;
# the agent warms the model up at start for exactly that reason).
first_token_timeout_ms = 60000
transfer_timeout_ms = 120000
keep_alive = "30m"
# Cap on generated tokens per request; <= 0 = none. The instruct model answers in 10-50 tokens; this only stops a
# runaway (cuts it mid-sentence, so it is a backstop, not a style control — brevity comes from the prompt).
# A draw() script is a few hundred tokens (a table of what the robot can do: up to ~850, eval 2026-10-19); at 400 it
# was cut mid-call and ollama returned nothing. 1500 ≈ 15 s of a runaway.
num_predict = 1500

[Skills]
# Notes the model reads only when needed (use_skill): each *.md has a `description:` front matter listed in the system prompt.
dir = "etc/skills"

[Chat]
# History is cut in BLOCKS: past max_history messages it drops to history_trim_to at once. ollama reuses the processed
# prompt only up to the first token that differs, so trimming one message per turn would re-prefill the whole history
# every turn (~100 s per 100k tokens at ~1000 tok/s on the Orin); a block trim changes the prefix once per 200 messages.
max_history = 400
history_trim_to = 200
# Before each request the prompt (system + tools + STATE + history, ~3.5 chars/token, ~400 per image) is estimated;
# above this share of num_ctx a block of history is dropped (ollama would silently truncate, possibly the system prompt).
history_token_budget_frac = 0.75
digest_period_ms = 500
status_period_ms = 250
log_dir = "logs"
# Who the robot is (body, senses, abilities, limits, honesty rules), prepended to every system message.
# Read once at start; if missing, a short built-in description is used (and a warning printed).
system_prompt_path = "etc/system_prompt.md"
# Relative motion (move_relative tool / "move <m>", "turn <deg>"). Sent at once, no confirmation card (user decision
# 2026-10-18: the person can stop the robot at any time); the controller checks the swept footprint and refuses.
max_move_m = 3.0
# "advance a bit" — the step the model is told to use when the person gives no number.
default_step_m = 0.3
# approach_object (approach.h): stand footprint_radius(object) + robot_radius_m + approach_clearance_m from the object's
# centre. Geometry, not a knob: robot_radius_m is half the 0.70 m body door_concept checks passages against; the
# clearance is room to turn on the spot (the controller moves a standpoint it cannot turn in anyway).
robot_radius_m = 0.35
approach_clearance_m = 0.30
# OBJECTS section of the STATE: the N nearest objects of the current room (counts per class always).
objects_nearest = 6
# Object births/removals are shown in the window at most this often; a flap inside the window cancels out.
object_change_period_ms = 2000
# look() tool: the newest ZED ("front") / Ricoh ("360") frame is shrunk to this longest side and JPEG-encoded, then
# attached to the tool result for ONE request (then dropped from the history).
# Measured with gemma4:26b on the Orin on 2026-10-31 (warm vision encoder):
#   1280 px: ~370 image tokens, ~3 s per look
#   640 px: ~133 tokens, ~1.8 s; it still recognises the scene
#   448 px and below: the ~106-token floor, ~1.7 s
#   320 px and below: it loses the scene ("kitchen" becomes "room")
# The 360 view stays at 1280: an equirectangular frame packs 360 deg into its width.
# 2 images + the ~2600-token system message + the history (block-trimmed at 400 messages, token-guarded at 75% of
# the 262k num_ctx) fit.
look_max_side = 640
look_max_side_360 = 1280
look_jpeg_quality = 85

[Canvas]
# The side canvas: the robot draws for the person by running a Python script (canvas/stock/*.py, canvas/library/*.py,
# or one the model writes) against a snapshot of the world (src/canvas_snapshot.h). The script runs as python3 -I in a
# systemd user scope (MemoryMax), in a network namespace when the kernel allows it, and is killed after timeout_ms.
dir = "canvas"
timeout_ms = 10000
# Live drawings: the camera is shown directly (no Python); a script redraws in a persistent worker (~45 ms for the
# room layout), skipping ticks while one is in flight, so a slow script sets its own pace.
live_period_ms = 100
memory_max = "1G"

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

[SimDoor]
# sim_door: the SIMULATOR opens / closes a door of the current room (webots-bridge DoorControl, tools/sim_door.py).
# The tool is offered only while robot_concept writes robot_gt_* (sim only), so it vanishes on the real robot.
# "" disables it. Which Webots door: the nearest by place, through the sim ground-truth pose (src/sim_door.h).
endpoint = "doorcontrol:tcp -h localhost -p 10017"
match_max_m = 1.0
