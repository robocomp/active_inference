# ltsm_agent — ONE process, TWO DSR graphs, TWO DDS domains.
#
#   [Agent.dsr ]  the LIVE working graph.    domain 0, configFile "" => joins the fleet over DDS.
#   [Agent.ltsm]  long-term spatial memory.  domain 2, SEEDED from ltsm_root.json every launch.
#
# genericworker.cpp builds one DSRGraph per [Agent.<name>] sub-table, each with its own FastDDS
# DomainParticipant (cortex/core/rtps/dsrparticipant.cpp:239), and then does
#     G = Graphs.at(surNames.front())
# getSurNames() SORTS its result (classes/ConfigLoader/ConfigLoader.cpp:277), so front() == "dsr"
# and G aliases the LIVE graph — the same thing G means in every other agent. Memory is
# Graphs.at("ltsm"). If you rename these tables, keep the live one alphabetically first.
#
# NEVER add a table whose FLATTENED key contains the substring "Agent" AND has >= 2 dots (e.g.
# [ViewAgent.anything]): getSurNames filters on k.contains("Agent") and would build a third,
# phantom graph from it. A one-dot [ViewAgent] block is harmless; we emit none.
#
# Every sub-table MUST define tree/graph/2d. setupViewer reads all three unconditionally and a
# missing key THROWS (ConfigLoader.tpp:11) rather than defaulting. "3d" is NOT read at all --
# setupViewer's options vector is only {tree, graph, 2d} -- so it is deliberately absent here.

[Agent]
# MUST be unique across the shared graph -- a collision is a CRDT actor-id clash => SIGSEGV in BOTH
# agents. Taken: room=5 robot=6 table=7 controller=8 retina/kinova=9 bottle=10 kinova_ctrl=11
# self_calib=12 human=13 residual=14 door=15 scene_graph_viewer=16 hood=17 viewer3d=18 chair=20
# cabinet=21 refrigerator=22 ring=23 kitchen=24. 19 was the only hole left; next free is 25+.
id   = 19
name = "ltsm_agent"

[Agent.dsr]
configFile = ""
domain     = 0
# NO VIEWER for the working graph: robot_concept already shows it. With all three views false,
# setupViewer returns nullptr and GenericWorker::initialize builds no window for this graph -- the
# graph itself is still joined and read. Only the LTSM memory window comes up.
tree       = false
graph      = false
2d         = false

[Agent.ltsm]
# Path goes straight to QFile (cortex/api/dsr_utils.cpp:21) so it resolves against the process CWD:
# run this agent from the component root, as the rest of the fleet is run.
configFile = "ltsm_root.json"
# 0 = the shared DSR working graph, 1 = the established "isolated standalone run" convention
# (kinova_controller's experiment configs), 7 = the zero-copy media plane. 2 was free.
# Handy for verification: FastDDS maps domain d to port 7400 + 250*d, so this one is the 7900 block.
domain     = 2
tree       = false
graph      = true
2d         = false

[Period]
# Nothing periodic to do yet -- this step only has to come up and hold both graphs open.
Compute   = 1000
Emergency = 500

[Component.Debug]
# false suppresses qDebug ONLY (the re-emit handler in generated/genericworker.cpp); qInfo/qWarning,
# including the [seed] and [eviction] lines, still print.
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

# ── Isolation self-test ───────────────────────────────────────────────────────────────────────
# OFF here. etc/config_selftest.toml turns it on: it writes a node per cycle into the MEMORY graph
# and qFatal()s if either graph can see anything belonging to the other. That is the regression
# test for the whole point of this agent -- see the agent_dual_dsr note in the README.
[SelfTest]
probe = false

# ── Live passage (src/passage_live.h) ───────────────────────────────────────────────────────────
# When room_concept births a PROTO-ROOM on a door crossing and door_concept mirrors the crossed door
# under it, keep ONE `metaconcept` passage_<n> in the LIVE graph with a `match` edge to each door
# (entry mirror ↔ the current room's nearest door), deleted when either door goes. Owned live passages
# are removed on a graceful exit and swept at startup. Absent key ⇒ OFF.
[LivePassage]
enabled = true

# ── Promotion (proto-room → current) ─────────────────────────────────────────────────────────────
# ltsm_agent decides room IDENTITY, but FOLLOWS room_concept: the room whose robot->room RT edge is live
# (rc::room::robot_rt_room) becomes `current` when it differs. No probability level. The P(inside) from the pose
# covariance is still computed, for the log only. Then: move `current`, copy BOTH rooms to memory (passage
# matching the two door faces), and DELETE the old room from the working memory.
[Promotion]
enabled       = true

# ── Eviction (2026-10-12) ───────────────────────────────────────────────────────────────────────
# ON: when promotion moves `current` to the room the robot has entered, the room it left is copied to long-term memory
# (with the crossed door's two faces matched into a memory passage_N that counts crossings) and DELETED from the
# working memory. With Promotion on, the identity decision is the only trigger (see compute()).
[Eviction]
enabled        = true
backstop_sweep = false

# ── Room recognition (src/room_recognizer.h) ─────────────────────────────────────────────────────
# While the room behind a crossed door nobody has used is still provisional, score it against every archived room: the robot's
# pose through the seam chain (+ retina's place_evidence when it is published) -> a posterior over {known rooms, new} on the
# `recognition` node, and staged Swap/Undo requests, executed by RoomSwap (room_swap.h) and acknowledged back. Needs Eviction. Absent key => OFF.
[Recognition]
enabled = false   # RoomSwap executes the requests, but room_concept (Task 9) must re-birth the room from the late recall: switch on for the gold tour

# Doors memory holds for the robot's CURRENT room, posted as `remembered_door` metaconcept notes (src/remembered_doors.h) for
# door_concept to restore from; retired when adopted or the room stops being current. Adds metaconcept nodes only. Needs Eviction.
[Recall]
remembered_doors = true   # default ON since 2026-11-14 (door_concept restores only from these notes)

# WARM START (docs/superpowers/specs/2026-11-01-ltsm-warm-start-design.md): post a start-up recall of this remembered room —
# the room the robot starts in — for room_concept (RoomShape.MapMode = "ltsm") and door_concept. Absent/empty = off.
# warm_start_tour.sh sets it for its run and restores this file.
[WarmStart]
# Room = "room_1"

# Long-term memory survives runs: room 1 is written at start-up only if it is not already remembered.
[Memory]
persist      = true
persist_path = "etc/ltsm_memory.json"
# Every save is a NEW dated generation here (ltsm_<YYYYMMDD_HHMMSS_mmm>.json + its _layout.json); start-up opens the
# newest. Empty = the single file above. tools/ltsm_history.py lists and diffs them.
history_dir  = "etc/ltsm_history"

# The Topology dock draws the MAP layout (seams with covariance + Manhattan / non-overlap / shared-wall priors,
# src/layout_optimizer.h), solved once per new room. false = the spanning tree of seams, as before.
[Layout]
optimize = true
