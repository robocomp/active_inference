# ltsm_agent — ONE process, TWO DSR graphs, TWO DDS domains.
#
#   [Agent.dsr ]  the LIVE working graph.    domain 0, configFile "" => joins the fleet over DDS.
#   [Agent.ltsm]  long-term spatial memory.  domain 2, SEEDED from ltsm_root.json every launch.
#
# genericworker.cpp builds one DSRGraph per [Agent.<name>] sub-table, each with its own FastDDS
# DomainParticipant (cortex/core/rtps/dsrparticipant.cpp:239), and then does
#     G = Graphs.at(surNames.front())
# getSurNames() SORTS its result (classes/ConfigLoader/ConfigLoader.cpp:277), so front() == "dsr"
# and G aliases the LIVE graph — the same thing G means in every other agent. Memory is
# Graphs.at("ltsm"). If you rename these tables, keep the live one alphabetically first.
#
# NEVER add a table whose FLATTENED key contains the substring "Agent" AND has >= 2 dots (e.g.
# [ViewAgent.anything]): getSurNames filters on k.contains("Agent") and would build a third,
# phantom graph from it. A one-dot [ViewAgent] block is harmless; we emit none.
#
# Every sub-table MUST define tree/graph/2d. setupViewer reads all three unconditionally and a
# missing key THROWS (ConfigLoader.tpp:11) rather than defaulting. "3d" is NOT read at all --
# setupViewer's options vector is only {tree, graph, 2d} -- so it is deliberately absent here.

[Agent]
# MUST be unique across the shared graph -- a collision is a CRDT actor-id clash => SIGSEGV in BOTH
# agents. Taken: room=5 robot=6 table=7 controller=8 retina/kinova=9 bottle=10 kinova_ctrl=11
# self_calib=12 human=13 residual=14 door=15 scene_graph_viewer=16 hood=17 viewer3d=18 chair=20
# cabinet=21 refrigerator=22 ring=23 kitchen=24. 19 was the only hole left; next free is 25+.
id   = 19
name = "ltsm_agent"

[Agent.dsr]
configFile = ""
domain     = 0
tree       = false
graph      = true
2d         = false

[Agent.ltsm]
# Path goes straight to QFile (cortex/api/dsr_utils.cpp:21) so it resolves against the process CWD:
# run this agent from the component root, as the rest of the fleet is run.
configFile = "ltsm_root.json"
# 0 = the shared DSR working graph, 1 = the established "isolated standalone run" convention
# (kinova_controller's experiment configs), 7 = the zero-copy media plane. 2 was free.
# Handy for verification: FastDDS maps domain d to port 7400 + 250*d, so this one is the 7900 block.
domain     = 2
tree       = false
graph      = true
2d         = false

[Period]
# Nothing periodic to do yet -- this step only has to come up and hold both graphs open.
Compute   = 500
Emergency = 500

[Component.Debug]
Verbose = true

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

# ── Isolation self-test ───────────────────────────────────────────────────────────────────────
# OFF here. etc/config_selftest.toml turns it on: it writes a node per cycle into the MEMORY graph
# and qFatal()s if either graph can see anything belonging to the other. That is the regression
# test for the whole point of this agent -- see the agent_dual_dsr note in the README.
[SelfTest]
probe = true
