
# --- Common Agent Data ---
[Agent]
id = 22 # unique across the shared graph (room5 robot6 table7 ctrl8 vox9 bottle10 kinova11 selfcal12 human13 residual14 chair20 cabinet21)
name = "refrigerator_concept"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree = false
graph = false 
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Presence]
required_agent_names = ["robot_concept", "room_concept"]
config_dir = "etc"
monitor_period_ms = 500
heartbeat_timeout_ms = 3000
rejoin_grace_ms = 1500
stale_grace_ms = 120000
agent_info_period_ms = 1000

[Owns]
# "refrigerator*" matches every refrigerator this agent births/scaffolds (refrigerator_1, refrigerator_2, …) so none survive a
# restart as a stale node (mirrors bottle_concept owning "bottle*").
nodes = ["refrigerator_concept 21", "refrigerator_*"]

[Period]
Compute = 100
Emergency = 500

[Component.Debug]
Verbose = false

# ── Primary-input (masks) stream gate — LIFECYCLE liveness, not a belief knob ──────────────────────────
# Demote Operating→Degraded→Waiting when the voxelizer's `masks` node stops advancing its mask_frame_id for
# this long (producer dead/stalled) — don't integrate stale evidence; re-admit automatically when it returns
# (peers stay intact, so the agent never shuts down). Orthogonal to AI2AgeNominalDtS (belief-axis Σ-aging).
# MUST exceed the voxelizer HOLD_ENTER_S so a legitimately empty scene (counter still advancing) never trips.
[Media]
MasksStallTimeoutMs = 3000   # 0 = disable the stall gate

# ── AI2 belief (REFRIGERATOR.md): full-covariance recursive filter; legs derived, soft mixture ──
# This is the ONLY fit path (the legacy SDF-gradient/Fisher/queue/silhouette fit has been removed).
[RefrigeratorModel]
SigmaObs = 0.05             # top/leg SDF split band (m): a point within TOP_THICKNESS+SigmaObs below the top
                            # face is attributed to the slab (candidate) vs a leg — used for the mask split.
SdfThresholdForStorage = 0.08  # |SDF| below which a mask support point is on-surface (candidate) vs residual
AI2CsvPath = "etc/ai2_log.csv"  # per-cycle AI2 log (state + Σ diag + mask R/bias); empty disables
BirthSurpriseProbe = true    # EXPERIMENTAL read-only: read residual_concept's `grid` node as a surprise (unexplained-occupancy) field, cluster it, log uncovered high-surprise regions vs the tracker's births → etc/birth_surprise.csv. true to test; no fit/graph effect
AI2SigmaBaseM = 0.03        # base on-surface obs noise std (m); R = σ² + mask_motion_var per frame
PixelSigmaOverF = 0.0015    # σ_px/focal → transverse position std per metre of range
DepthSigma0M = 0.006        # depth std floor (m)
DepthSigmaRangeCoef = 0.004 # depth std growth (m per m² of range): σ_d = σ0 + coef·range²
ModelSigmaM = 0.010         # residual model/surface std floor (m)
# a1′+a2′ (PRECISION_AS_INFORMATION.md): weighted 2-D footprint residual + shared per-frame depth-affine nuisance.
# THE grazing-yaw fix — models yaw where it lives (the footprint) and marginalizes the common depth bias/scale
# that aliases into yaw at grazing. REPLACES the footprint-moment channel when on. depth_*_std = ZED depth priors.
FootprintResidual = false   # true to enable (needs the ray geometry; supersedes the FootprintMoment* + obliquity yaw knobs)
QuotientChart = false       # C2v symmetry-quotient chart [s,a1,a2] (Stage 3): kills 90°/180° yaw snaps + honest near-square σ_yaw; retires the fold/flip machinery. Pair with FootprintResidual
DepthTiltStd = 0.020        # shared per-frame depth TILT prior std (m/rad) — the azimuth-odd mode that aliases into yaw
DepthBiasStd = 0.015        # shared per-frame depth bias prior std (m)   — extent/pos nuisance (future)
DepthScaleStd = 0.010       # shared per-frame depth scale prior std (fraction) — extent nuisance (future)
AI2ClutterFrac = 0.10       # ε: prior weight of the uniform clutter mixture component
AI2ClutterScaleM = 0.12     # a point further than ~this from EVERY surface is explained by clutter
AI2PriorSizeStd = 0.30      # (legacy; the size prior is now split into footprint vs height below)
# FOOTPRINT + HEIGHT prior: a standard fridge footprint ≈ 0.60×0.60 (TIGHT std → strong pull on w,h≡depth so a
# partial front-only view can't float the unobserved depth); HEIGHT varies a lot (BROAD std → data-driven).
AI2PriorFootprintM = 0.60   # mean of the w & h(depth) prior (m)
AI2PriorFootprintStd = 0.08 # TIGHT → strong footprint prior (m); λ = 1/std²
AI2PriorHeightM = 1.90      # mean of the H (vertical) STATIC anchor (m) — a standard tall fridge
AI2PriorHeightStd = 0.30    # anchor std (m); λ = 1/std² stops the box TOP floating above the cloud (points on a side face never pull H down). Data still sets the LOWER bound (H ≥ cloud-top)
# DEPTH-OBSERVABILITY prior (front-only-view depth-collapse fix): depth (h) is identifiable only when the cloud spans
# the depth extent (front AND back seen). A front-only view is a thin ly-slab; its many points still drag depth to the
# 0.10 clamp (the size common-mode caps σ, not the mean). Extra depth precision applied ∝ (1 − observed_depth_extent /
# footprint): a single-face view holds depth at AI2PriorFootprintM; relaxes to data-driven once an orbit reveals the back.
AI2DepthUnobsPrecision = 20000.0 # extra 1/m² on depth when the depth extent is unobserved (single face) — DOMINANT so the footprint prior WINS over the spurious front-face pull (~1300); relaxes when the back face is seen. 0 = OFF
AI2DepthObsBandM = 0.10         # ly-spread (m) below which the cloud counts as a single depth face
# TOP anchor: the floor-anchored box top is a "free" upper boundary — extending it ABOVE the cloud costs nothing so H
# ratchets up on the over-segmentation junk tail above the fridge (observed H→2.37 for a ~1.9 m mask). A firm TWO-SIDED
# anchor pins H to the observed robust top (z-p97); the junk tail is separately faded via per-point R (below). Data
# still sets the LOWER bound (front points force H ≥ real top). So H settles at the true mask top.
AI2TopNoFloatPrecision = 10000.0 # firm two-sided anchor pinning H → observed robust cloud top (1/m²). 0 = OFF
AI2TopNoFloatMarginM = 0.02     # upward allowance (m) added to the observed top as the anchor target
AI2TopOversegSigmaPerM = 2.0    # R inflation (σ per m) for points ABOVE the robust top — fades the mask over-segmentation junk tail so it can't ratchet H up. 0 = OFF
# "IS THIS REALLY A FRIDGE?" model-evidence mis-detection filter (rejects e.g. a 70 cm elongated cabinet
# mislabelled "refrigerator"). Continuous plausibility (aspect·size·height·fit) + a bounded plaus_evidence
# accumulator → gates BIRTH and drives EXISTENCE decay; a SOFT singleton lets a stronger fridge inhibit weaker
# duplicates. No hard cutoffs — encoded as covariance/evidence. Master switch: RefrigeratorConcept.FridgeFilterEnabled.
AspectScale = 0.15          # aspect_ok = exp(−(|w−h|/(w+h)/scale)²): ~1 square-ish footprint, →0 elongated
SizeScale = 0.15            # size_ok  = exp(−((w−0.60)²+(h−0.60)²)/(2·scale²)): footprint near the standard 0.60×0.60
AltSizeScale = 0.60         # the ALTERNATIVE hypothesis ("some other furniture-shaped box") footprint std (m).
                            # The filter scores log[p(θ|fridge)/p(θ|other)] with BOTH densities normalised, so the
                            # evidence is how much more sharply the fridge prior predicts this shape. Raise → the
                            # alternative gets broader → the fridge hypothesis earns MORE evidence per measured
                            # frame. (Replaces the old `plausibility − 0.5` rule, whose 0.5 boundary was arbitrary
                            # for an un-normalised likelihood and scored a real 0.77×0.63 fridge at 0.30 → deleted.)
HeightPlausibleMin = 1.20   # height_ok logistic centre (m): →1 tall, →0 below ~1 m ("a 70 cm fridge is improbable")
HeightSoft = 0.15           # height_ok logistic softness (m)
FeRef = 2.0                 # "healthy fridge fit" FE reference — NEEDS LIVE TUNING (≈ a good fridge's mean_energy)
FeScale = 1.0               # fit_ok = exp(−max(0, FE−FeRef)/FeScale): a poor data fit lowers plausibility
PlausClamp = 8.0            # ± bound on the plaus_evidence accumulator (bounded memory: one bad frame can't kill a real fridge; can still RECANT)
PlausHeightPriorGain = 2000.0 # short-height prior precision (1/m²) per (deficit/HeightSoft) below HeightPlausibleMin; nudges H up so a 70 cm cloud fits worse; 0 = OFF
PlausToExistenceGain = 1.5  # how strongly tanh(plaus_evidence) pushes the existence log-odds per cycle (support/decay)
SingletonInhibition = 1.0   # mutual-inhibition: a STRONGER fridge subtracts this·P(exists) from a weaker one's existence L (soft, bounded)
# WALL-FLUSH + WALL-PARALLEL factor (a fridge's back face rests against a room wall; ported from cabinet_concept).
# Precision = marginal of a {flush, free-standing} mixture keyed on the back-to-wall gap ⇒ decays CONTINUOUSLY to 0
# for a genuine mid-room fridge (no proximity gate). 0 = OFF.
AI2WallPrecision = 400.0         # 1/m² at zero gap (back face → wall line)
AI2WallParallelPrecision = 200.0 # back face parallel to the wall (width-axis · wall-normal → 0)
AI2WallReachM = 0.15             # gap scale (m) over which the flush hypothesis loses its weight
# WALL AS A COMPETING EXPLANATION (per-point mixture component) — the principled form of "don't detect a fridge
# where a wall already is". NOT an exclusion zone: the room's already-inferred wall surface joins the SAME
# per-point mixture as box/clutter, so a mask point lying on it (i) has its BOX responsibility collapse ⇒ exerts
# zero pull on the fitted geometry, and (ii) is already explained WITHOUT a fridge ⇒ the box earns no evidence
# there (box_log_evidence_gain ≈ 0). A real fridge is untouched: its visible faces stand a depth off the wall
# plane. Inert unless a room polygon has been pushed. 0 = OFF (mixture reverts to box+clutter).
# Door CLEARANCE prior: nats of preference, at full flush, for the door mode facing INTO the room over one
# facing into the wall it is attached to. The ONLY thing that resolves the 180° front/back ambiguity, since a
# half-turn swaps front/back but moves nothing the camera can see. Scaled by the flush mixture weight, so it
# vanishes on its own for a genuine mid-room fridge. 0 = OFF. A precision, not a gate.
AI2DoorClearanceGain = 3.0
# ── INFERRED VOLATILITY (MODEL_HISTORY.md §3) — the HISTORY stage ─────────────────────────────────────────
# Q stops being a per-frame constant and becomes exp(ω), a per-DOF latent inferred from how much the belief
# actually MOVES. With a fixed Q, evidence is discarded exactly as fast as it is acquired (σ_steady=(q/i)^¼,
# a ratio of two RATES — elapsed time never appears), so hours of touring leave the belief where seconds
# would, and an unobserved fridge's σ_w walks back to the prior in ~6 minutes. Inferring ω repairs BOTH:
# retention τ=Σ/exp(ω) grows AND the precision floor falls. Stiffness is then EARNED by evidence instead of
# imposed by a clamp, and the hyperprior pull-back keeps it recoverable — shove the fridge and ω climbs, so
# it re-adapts in seconds. self_test: static → retention x7.2, moved → x0.04. Watch omega_w/tau_w in ai2_log.
# ── DETECTOR ENVELOPE (common/detectability) — the YOLO inverse model ────────────────────────────────────
# P(detect | geometry) is UNIMODAL in projected fill, not monotonic in range: below MinFill the object is too
# few pixels to segment; above MaxFill it overflows the frame, the mask truncates and the network loses the
# whole-object context. ONE model with TWO consumers — the epistemic planner puts the stand-off at its argmax,
# and the removal channel weights absence by it, so a missing mask from nose-to-nose range reads as EXPECTED
# rather than as evidence the fridge is gone (at 0.82 m: fill 0.80 -> P(detect) 0.035).
# ★CALIBRATED 2026-08-08 from a deliberate approach/retreat tour (2296 rows, range 0.67–5.41 m, roi_fill
# 0.22–1.81, label = a fresh mask that cycle, trials weighted by P(exists)). Weighted-MLE fit of the upper
# shoulder with a detection CEILING (YOLO does not fire every cycle even when the framing is ideal — the
# observed plateau is 0.889, which is frame timing, not geometry; folding it into the shoulder would drag
# max_fill down). Replaces the previous prior 0.10 / 0.60 / 0.06, which was wrong by more than 2x:
#     max_fill  1.317   95% CI [1.21, 1.49]      (was 0.60 — the fridge was being pushed ~1 m too far back)
#     soft      0.258   95% CI [0.175, 0.51]     (was 0.06 — the real shoulder is gradual, not a cliff)
# MinFill is NOT a measurement. This tour never went far enough for the fridge to become too SMALL to
# segment: at the smallest fill sampled the mask rate was still 0.94, so the lower shoulder lies below the
# measured range and is only bounded from above. 0.10 was actively wrong — holding it there made the fit
# diverge, because the model then had to explain 94% detection at a fill it calls undetectable. Set to 0
# meaning "inactive over this object's operating range", NOT "measured as 0". A tour that backs off until
# the fridge stops being detected is what would measure it.
# ⚠ ONE `soft` serves BOTH shoulders, and this object needs them different (a likelihood-ratio test on the
# earlier dataset rejected the shared width at p<0.05). With soft=0.258 the inactive lower shoulder still
# suppresses long range by ~40%, which is the residual model error here — the fix is separate soft_min/
# soft_max in common/detectability, not further tuning of these three numbers.
DetectMinFill = 0.0
DetectMaxFill = 1.32
DetectSoft = 0.26
AI2VolatilityInfer = true    # ON 08-03 for the A/B tour. Watch omega_w/tau_w in ai2_log.csv
AI2VolatilityLr = 0.02       # gradient step on ω per MEASURED cycle (predict-only cycles never touch it)
AI2VolatilitySigma = 2.0     # hyperprior width σ_ω: how far evidence may pull ω from the configured Q
AI2WallExplainFrac = 0.25        # π_wall: prior weight of "this point belongs to a known room wall"
AI2WallExplainSigmaM = 0.05      # extra wall-plane std (m): room-polygon + localization slack (adds to WallRef σ)
# WALL NO-CROSS (one-sided): the flush factor is TWO-SIDED (drives gap→0) and its weight decays away from the wall,
# so a fit can end up CROSSING the wall (back past it into the wall/exterior). This one-sided term resists penetration
# ONLY — active when gap=(back_centre−wall.p)·(inward normal) goes negative (crossed) or within the margin; precision
# GROWS with how far past, leaving flush (gap≈0) untouched. STRONG (a wall is a hard boundary), continuous. 0 = OFF.
WallNoCrossPrecision = 2000.0    # 1/m² per m of penetration past the wall (>> the flush precision)
WallNoCrossMarginM = 0.0         # interior offset (m) inside which the constraint activates
AI2ProcessStdM = 0.005      # predict process-noise std, length DOFs (m/frame) — rigid+static ⇒ small
AI2ProcessStdYaw = 0.01     # predict process-noise std, yaw (rad/frame)
AI2AgeNominalDtS = 0.1      # stale-belief aging: mask stream nominal period (s, 10 Hz masks). Σ inflates by Q·(dt/this) while the feed is silent (measurement-age→covariance) — completes the frozen-frame fix: a stale capture stamp now AGES the belief instead of freezing it. 0 = freeze on stale (historic).
AI2TruncGateFrac = 0.10     # skip the geometric update when >this fraction of the mask silhouette is on the image border (truncated → biased)
# Static range weighting (motion-free): common-mode error grows with view distance so a far, vague mask
# can confirm existence but NOT resolve pose/orientation (can't rotate a converged refrigerator). Continuous, no gate.
AI2RangeNoiseLatPerM = 0.02 # lateral deprojection std growth (m per m of range) → feeds R + position common-mode
AI2RangeNoiseYawPerM = 0.03 # yaw common-mode std growth (rad per m of range) → the binding term vs far-view rotation
AI2RangeNoiseSizePerM = 0.08 # SIZE (w,h,H) common-mode std growth (m per m of range): the per-frame size info
                             # SATURATES lower with range, so a distant/vague mask can't reshape or INFLATE a
                             # converged refrigerator (freezes geometry afar; also caps the coverage grow-term). Raise
                             # to freeze harder at range; the sibling of the lat/yaw range terms. 0 = off.
AI2GnIters = 4              # Gauss-Newton iterations per frame
# Per-frame SHARED-ERROR common-mode stds — the information-saturation FLOORS (CLAUDE.md "encode the effect as a
# continuous covariance"): N correlated points from one frame cannot collapse Σ below these. LOAD-BEARING. They
# were previously read from these getters with the keys ABSENT from config (silent defaults) — now exposed. A NEW
# concept agent must expose its own equivalents.
AI2CommonModePosStd  = 0.03  # shared position (cx,cy) error floor (m)
AI2CommonModeSizeStd = 0.02  # shared size (w,h,H) error floor (m)
AI2CommonModeYawStd  = 0.03  # shared yaw error floor (rad)

# ── Ego-motion "be-still-to-update" (ported 1:1 from chair_concept) ────────────────────────────────────────────
# motion_magnitude = max(|motion_dotd|, ego_lin_mps + AI2AngLeverM·ego_ang_radps): a producer-INDEPENDENT motion
# signal built from the robot's OWN camera speed (transform chain). It scales the continuous common-mode (MotionCm*)
# AND drives the discrete confirm-only gate below. Geometry updates thus concentrate at STILLNESS.
MotionCmPosGain  = 0.10      # position (cx,cy) shared-error std per m/s of motion — anti-DRIFT
MotionCmSizeGain = 0.20      # extent (w,h,H) shared-error std per m/s — the anti-RESHAPE lever
MotionCmYawGain  = 0.12      # yaw shared-error std (rad) per m/s — the anti-ROTATE lever
AI2AngLeverM = 2.0           # rad/s → m/s lever (tangential speed of a fridge ~this far away) for ego-motion
AI2PeriphRef = 0.50          # centroid radius (focal-norm) at which the off-axis periphery penalty → 1
AI2MotionRefMps = 0.60       # motion magnitude (m/s) at which a fully-peripheral frame is fully unreliable
# Discrete confirm-only gate ("only update if the robot is still"): true ⇒ CONFIRM but do NOT move the geometry mean
# (predict-only) when MOVING (ego lin/ang OR motion_dotd above its still-level) AND the mask is off-centre. A
# well-centred mask (centroid radius ≤ AI2MovingUpdateCenterRadius) is trusted even while moving → still updates.
AI2MotionConfirmOnly = true
AI2StillLinMps = 0.05        # camera linear speed (m/s) below which the robot counts as "still"
AI2StillAngRadps = 0.10      # camera angular speed (rad/s) below which the robot counts as "still"
AI2StillDotd = 0.05          # per-mask ego-motion corruption speed (m/s) still-level
AI2MovingUpdateCenterRadius = 0.35  # mask centroid radius below which a moving update is still allowed

# ── YOLO-INDEPENDENT LiDAR first-hit range channel (common/ai_belief/lidar_ray_factor.h) ──────────────────
# Second, sensor-INDEPENDENT evidence: lidar3D returns on the refrigerator's LEGS + RIM pin the extent/centre in
# METRIC range along the viewing ray. Its error mechanism is uncorrelated with the YOLO segmentation, so it
# attacks the mask-erosion extent UNDER-SIZE (~6cm) the mask cannot self-correct. Consumes the lidar3D media
# plane (RefrigeratorLidarIngestor); the media subscriber is created only while this is > 0.
# ON at 2500 (load-bearing): ≈1/σ²@2cm = depth-point scale → w/h under-size shrinks and extent σ tightens.
LidarPrecision = 2500.0          # per-ray range precision (1/m², ≈1/σ²@2cm=2500 when load-bearing). 0=OFF
# A/B: use the LOW 'bpearl' LiDAR as a SEPARATE per-device ray-set (own origin, occlusion-aware first-hit) — it sees
# the LEGS / lower extent the high 'helios' grazes over. Summed into the SAME GN as helios (NOT merged: each keeps its
# origin), and feeds the existence leg-occupancy carve from its own origin. Try ~2500 to match helios. 0=OFF (helios only).
LidarBpearlPrecision = 0.0
LidarRobustCM = 0.05          # Cauchy scale (m): returns this far off the surface fade out (continuous, no gate)
LidarSelectMarginM = 0.10     # pre-select returns within (birth half-diagonal + margin) horiz, floor..birth_H vert
LidarCoverageN0 = 60.0        # LiDAR ray count for full weight; fewer → proportionally down-weighted (sparse-safe)
LidarCoverageAngPower = 1.0    # ANGULAR-coverage weight precision×=(1−R)^p (R=mean-resultant of return bearings):
                               # down-weights ONE-SIDED sweeps that over-commit the near-square w↔h mode from a
                               # single view. 0=off (flat), 1=pure circular variance. Belief still accrues over orbit.
MaxStepM = 1.0                 # divergence guard: reject a GN centre step > this (m) in one frame (static refrigerator)
# Coverage / traction (EXISTENCE_BELIEF_PLAN.md): on-plane mask points the mixture ceded to CLUTTER exert a
# GROW-ONLY pull on the top slab, so a model under-covering a large mask grows to explain it (fixes refrigerator_1.png:
# green mask far outside the box, no traction). Self-bounded + on-plane-gated. STAGED — OFF (0.0) by default;
# try 500 (≈ mask-point scale) and watch w/h grow to the mask extent without over-growing. Anti-contamination
# bound = free-space carve (not yet wired) → keep modest until then.
CoveragePrecision = 0.0          # DEBUG BASELINE: OFF (was 500). Re-add after the ZED+LiDAR pair is calibrated.
CoverageRobustCM = 0.15        # Cauchy scale (m): on-plane points this far outside fade out (stray-point guard)

# Free-space / VACATE (EXISTENCE_BELIEF_PLAN.md Step 4): the SHRINK-only counter-force that BOUNDS CoveragePrecision.
# A LiDAR beam that passes THROUGH the top-slab band and exits the far side proves that crossing is empty → pull the
# extent back IN (occupy-where-masked + vacate-where-through settle the extent where camera & LiDAR agree, so coverage
# can no longer inflate onto clutter). Uses the same sweep as LidarPrecision (auto-staged when either is > 0). Beams
# that RETURN inside the slab (occupancy) are ignored, so a real refrigeratortop is untouched. Runs SOLO at 500 here
# (CoveragePrecision is off), bounding the extent from LiDAR through-beams alone.
FreeSpacePrecision = 500.0         # shrink-only free-space pull strength (per through-beam, ~1/σ²). 0=OFF

# Footprint SECOND-MOMENT factor (refrigerator_belief.h): measures (w,h,yaw) from the top-band cloud's 2D inertia
# tensor and folds it as a linear Gaussian factor into the GN update — the escape from the clutter-trap that
# leaves a DENSE, bigger/yawed mask unable to rotate/resize the box (the refrigerators_5.png "stuck yaw"). The
# per-point SDF mixture can't do this: interior top points have ∂sdf/∂yaw≈∂sdf/∂w≈0, and the outboard rim/leg
# points that carry the signal fall outside the box → routed to clutter. This global statistic uses them all.
# Also seeds (w,h,yaw) at birth so the box starts near-right. yaw pull scales with extent anisotropy (a square
# gives none); per-frame authority capped by the range-driven common-mode (far view can't rotate a converged
# refrigerator — no manual gate). NOT applied to cx,cy (partial-view centroid bias; the mixture handles position).
FootprintMomentPrecision = 2000.0   # A/B: try ~2000 on the right refrigerator; 0=OFF (baseline births/fits unchanged)

# Orientation w↔h mode: pure sequential-Bayesian evidence on the TRUE free energy (−log mixture likelihood).
# No hysteresis/leak/discriminability knobs — those were band-aids for a BROKEN energy readout (clutter silently
# zeroed misfit → FE≈0 → the mode comparison was noise → periodic 90° flips). With a real FE the evidence is
# decisive and a near-square refrigerator rests at the honest ambiguity on its own.
# Footprint-moment per-frame covariance: the moment's measurement variance is 1/FootprintMomentPrecision (a static
# noise FLOOR) + ego-motion mask corruption (motion_var) + (FootprintMomentRangePerM·range)². The extra terms make
# the moment ACCUMULATE over frames and back off while the robot is moving / far, instead of snapping the belief to
# each frame's noisy footprint (the live yaw/extent wander). The range coeff is << AI2RangeNoiseSizePerM because a
# GLOBAL footprint fit is far more range-robust than a single boundary point. Raise to trust the moment less per frame.
FootprintMomentRangePerM = 0.03

# FE ATTENTION / SURPRISE (active-perception trigger). fe_surprise = smoothed positive gap FE−baseline. The
# baseline is the "well-fit" free-energy level: it tracks DOWN fast (consolidate a better fit) and UP SLOW so a
# SUSTAINED mismatch — the refrigerator was moved — stays surprising long enough for the robot to attend and dwell until
# the fit re-converges (FE→baseline → surprise→0). Watch fe_surprise in ai2_log.csv: move a refrigerator → spike → decay.
FeBaselineAdaptDown = 0.05
FeBaselineAdaptUp   = 0.005
FeSurpriseSmooth    = 0.10

# Ego-motion coupling (your observation: all misalignments arrive on going-away/rotation frames, where masks are
# degraded/split). moment variance += (FootprintMomentMotionGain·motion_dotd)² so a moving frame CANNOT reshape the
# established fit; the w↔h mode accumulator is halved at motion_dotd=OrientationMotionRef so a split mask can't flip
# it. Both continuous (no gate); static frames (dotd≈0) are unaffected. Raise the gain to freeze harder while moving.
FootprintMomentMotionGain = 0.30
OrientationMotionRef = 0.50

# Grazing-view yaw stability (CSV rogue-rotation fix). The refrigeratortop is viewed nearly edge-on (obliquity_cos≈0.09),
# so yaw is weakly observable and the per-point GN snaps between the box's symmetric orientations (±180° r_π /
# ±90° w↔h). The continuity fold + per-point obliquity yaw cap were validated live 2026-07-11 and are now ALWAYS
# ON (no flags): the fold lives in canonicalize(), the cap is kObliquityYawGain in refrigerator_fitter.cpp.

# MOMENT-channel yaw stability (CSV rogue-rotation fix, part 2). The per-point caps above do NOT touch the footprint
# MOMENT factor, but the live rogue rotations came in on the MOMENT channel (dyaw_moment) — a partial/foreshortened
# view yields a fragmentary footprint whose 2D inertia is spuriously anisotropic, so r_yaw=r_base/aniso² becomes
# razor-sharp and SNAPS yaw the wrong way (ai2_log.csv cyc1244: completeness≈0.01, aniso≈0.8, dyaw_moment≈-0.57).
# Both terms inflate moment_extra_var as continuous covariance — no gate. self_test (m): dyaw 0.52→0.02 rad.
FootprintMomentCompletenessGain = 0.5   # moment var += (gain·(1/completeness−1))², completeness=observed/believed footprint area → a partial-view sliver can no longer rotate a converged refrigerator. completeness≥1 (full/larger view) unchanged. 0=OFF
FootprintMomentMinCompleteness  = 0.02  # clamp floor for 1/completeness in the term above (caps the inflation of
                                        # a near-zero-completeness sliver). Active whenever the gain is >0 — was a
                                        # hidden default while its PAIR above was configurable; now exposed.
ObliquityMomentGain = 0.05              # grazing-view cap on the MOMENT channel: moment var += (gain·(1/|cosθ|−1))². Mirrors ObliquityYawGain (which only guards per-point). 0=OFF


# ── Existence / removal (common/existence_belief.h) ───────────────────────────────────────────────────────
# Each cycle the LiDAR sweep is carved against every refrigerator footprint: beams RETURNING inside → occupancy, beams
# passing THROUGH to beyond → free-space (absence). A per-refrigerator occupancy log-odds accrues (common-mode tanh
# saturated; HOLD when not looked at; free-evidence suppressed while the refrigerator is actively seen = hollow guard),
# and the refrigerator is removed when P(occupied) < ExistenceRemovalProb. Evidence-based, NOT a miss counter. STAGED —
# OFF by default (a mis-removal deletes furniture). Enable + watch the console "[existence] L=..." before trusting.
ExistenceRemovalEnabled = true    # ON (fit calibrated). Optimizer-orthogonal: writes only inst.existence log-odds, at
                                  # most delete_node — never touches θ/Σ. Silhouette channel HOLDs on occlusion (non-refrigerator
                                  # mask over the pixels) AND out-of-FoV (in_fov_frac≈0), so an unseen/occluded refrigerator is
                                  # NEVER falsely removed — it removes only when the camera LOOKS and sees empty.
ExistenceRemovalProb = 0.12    # remove when L < log(p/(1−p)); lower = more conservative
ExistenceLogoddsMax = 4.0      # clamp |L| so evidence stays finite AND recoverable
ExistenceDetectionProb = 0.85  # P(beam through an OCCUPIED footprint returns from it) — sensor hit rate
ExistenceClutterProb = 0.05    # P(beam through an EMPTY footprint returns anyway) — spurious rate
ExistenceSensorSigmaM = 0.03   # LiDAR range σ (m) for the soft occupancy/free-space surface split
ExistenceRemoveFrames = 15     # debounce: require the removal decision for this many CONSECUTIVE cycles before
                               # deleting (a transient association/fit hiccup can't delete a real refrigerator)

# ABSENCE evidence degradation vs range + occlusion (no gate). "Predicted-visible but no mask/return there" is
# weak removal evidence when the sensor likely couldn't resolve the refrigerator anyway — far away (tiny projection /
# sparse beams) or largely occluded. The FREE half of both channels is scaled by (RangeRef/range)^Power (≤1) ×
# visible_fraction; OCCUPANCY stays fully informative (a distant detection still confirms). Power=0 disables.
ExistenceAbsenceRangeRefM = 2.5   # range (m) below which absence is trusted at full weight
ExistenceAbsenceRangePower = 2.0  # decay exponent (2 ≈ angular area ∝ 1/range²)

# Verification-gated removal (active inference): a predicted-visible-but-absent observation is only evidence of
# REMOVAL in proportion to P(detect | present, geometry) = range_conf × in_fov_frac × central_frac. The REMAINING
# absence (from a far / peripheral / edge-on view that CAN'T resolve the refrigerator) is epistemic surprise, not removal:
# it feeds a decayed go-VERIFY accumulator. Above ExistenceVerifySurprise the refrigerator is flagged wants_verification
# and gets an epistemic pull (ExistenceVerifyGain nats) so the controller drives to a resolving ZED view — absence
# never deletes a refrigerator the robot never properly looked at; it sends the robot to look (confirm-or-remove).
ExistenceVerifySurprise = 20.0    # decayed un-resolvable-absence surprise above which a refrigerator wants verification
ExistenceVerifyGain     = 5.0     # epistemic gain (nats) a wants_verification refrigerator gets (drives a resolving view)

# LiDAR carve geometry — NO CONFIG KEY: it is the model's own geometry, nothing to choose. The carve covers the
# WHOLE SOLID BOX z∈[0,H] from each available ray-set (helios + the low bpearl, each with its own origin), because
# a fridge is one solid cuboid and every ring that reaches it strikes real surface at whatever height it sweeps.
# (Was the table-concept [H−3cm, H] top slab + four 2.5 cm corner "leg" columns — a sliver at 1.9 m the horizontal
# rings almost never intersect, so the fridge's solid body contributed NO confirmation and ex_locc swung 0.03…70.)
# Still OCCUPANCY-ONLY: free-space is model-consistent for a solid box now (the thin-plate objection that refuted
# it for tables does not apply), but removal deliberately stays the camera silhouette's job — the silhouette HOLDs
# out-of-FoV, so a fridge the robot is not looking at can never be deleted.

[RefrigeratorConcept]
# Convergence / cadence + a couple of tuned constants promoted here from hardcoded values (defaults unchanged).
# StateEps / KStable / DetectionAliveMaxFrames were read by getters with the keys ABSENT from config (silent
# defaults) — now exposed; a NEW concept agent must expose its own. MatchedFramesBeforeAging / CentralRegionFrac
# were bare magic numbers in the code, promoted for the same reason.
StateEps = 0.04             # Σ|Δstate| (m+rad) below which a cycle counts as converged
KStable = 30                # consecutive converged cycles before the belief is declared model_stable
DetectionAliveMaxFrames = 40 # cycles without a fresh mask before detection_alive → false
MatchedFramesBeforeAging = 5 # a barely-born belief (fewer matched frames) is not aged by a stale no-mask cycle
CentralRegionFrac = 0.25    # central image box [f,1-f]²; a detectable sample inside counts toward p_detect (removal)
FridgeFilterEnabled = true  # master switch for the "is this really a fridge?" plausibility filter (see [RefrigeratorModel] Aspect/Size/Height/Fe* keys)
FridgeFilterLog = false     # log per-instance plausibility / plaus_evidence / existence ΔL + the birth-candidate scores
# Appearance-based FRONT (door) detection + yaw resolver. A square-ish, wall-flush fridge is yaw-ambiguous; the
# door is an APPEARANCE feature (handle + seams = strong vertical lines). Project the FITTED box into the live ZED
# RGB, score vertical-edge energy per face, fold the winner's bearing into the belief's door-mode resolver. Works
# even when the robot is too close for YOLO (uses the belief's own box, not the mask). NEEDS LIVE TUNING: the edge
# metric is lighting/texture dependent — FrontMinConfidence gates how decisive a face margin must be to count.
FrontDetectEnabled = true   # master switch: subscribe to ZED RGB media plane + run detect_front/resolve_front
FrontMinFaceAreaPx = 900.0  # min projected face area (px²) to score for door-ness (rejects tiny grazing slivers)
FrontMinConfidence = 0.10   # min door-ness margin (max−second)/(max+eps) for a cue to be emitted (else nullopt)
FrontLog = true             # log each adopted door-mode flip / accepted appearance cue. ON for the door-cue
                            # diagnosis: with a square footprint (|w−h|≈8 mm live) yaw is unobservable mod 90°,
                            # so this resolver is the ONLY thing that can pick the quarter-turn. Pair with the
                            # new ai2_log columns front_mode/front_conf/cue_conf/cue_bearing.
RefrigeratorLogPeriodFrames = 30   # per-cycle log throttle (cosmetic; no effect on the fit)
ShowDashboard = true        # false = no GUI (belief dashboard + evidence monitor combined into one window)
# ObsDistance removed 2026-08-07: the epistemic stand-off is no longer a preference. It is the argmax of the
# detector envelope over BOTH image axes (DetectMinFill/DetectMaxFill below, via common/nbv), so a comfort
# distance here could only have fought the sensor model. Tune the envelope instead — that is the real knob.
EpistemicCooldownCycles = 200 # min cycles a satisfied refrigerator stays withdrawn (anti-chatter)
VoxelBankMaxPoints = 4000   # max number of refrigerator-owned voxels kept in memory
VoxelBankQuantizationM = 0.02 # dedup grid (m) for voxel-bank hashing
VoxelSelectRadiusMarginM = 0.50 # per-refrigerator XY ownership gate margin for mixed proto-refrigerators
VoxelSelectHeightMarginM = 0.25 # extra Z margin above refrigerator height when selecting owned voxels
DumpCloudPath = "/tmp/round_refrigerator.xyz" # DIAGNOSTIC one-shot: dump a refrigerator's voxel-bank cloud here for tests/compare_models ("" = off)
RtCovScale = 1.0            # scales the belief Σ → published room→refrigerator RT covariance (calibrate toward NEES≈1)
# z_o is the RAW camera-frame mask centroid carried to the base frame by the STATIC body<-zed extrinsic,
# NOT the fitted room-frame pose: it must be independent of the pose the localizer is estimating, or the
# factor just re-anchors to the last pose and the residual is ~0 at the current estimate. Position-only
# (a single view's yaw is biased), with an anisotropic R_o whose loose axis lies along the viewing ray.
# 2026-08-10: this has been true all along, but nothing consumed it -- room_concept's anchor reader only
# admitted tables. It now admits "refrigerator" (room's ObjectAnchor.subtypes) and the fridge becomes the
# localizer's first non-corner landmark.
PublishObjectObs = true     # publish per-frame ROBOT-frame fit z_o (obj_obs_robot) → room's object-anchor factor
ObjectObsFrame = "body"     # localizer base frame z_o is expressed in (== room's LIDAR_ROBOT_FRAME)

[Tracker]
# Multi-instance birth/associate/merge (shared rc::InstanceTracker; the only instance-lifecycle path —
# prior-scaffold + greedy nearest-mask were removed in Stage 2). "refrigerator" masks are associated to instances
# by a covariance-gated global 1-to-1; an unexplained mask spawns a new refrigerator; overlapping refrigerators merge
# (two can't share space); a refrigerator is NEVER retired by occlusion (a long occlusion is not absence).
GateMahalanobis = 9.0     # χ²₂ gate (~3σ) for a mask↔instance match once it has a cov
GateFallbackM = 0.50      # metric XY gate (m) before an instance has a usable covariance
DetectionNoiseM = 0.35    # det-noise std R added to fit cov in the gate (S=P+R²I): covers the mask-centroid
                          # vs fitted-centre offset of a partially-viewed refrigerator (~0.2–0.5 m), else the
                          # overconfident fit rejects its own detection. Refrigerators are far apart → safe.
# Evidence a mask must accumulate, while staying unexplained, before spawning a refrigerator. The unit is ONE
# ideal observation: a perfect mask (confidence 1, untruncated, centred, within AI2PriorFootprint range) is worth
# 1.0, and every real mask is worth less in proportion to its measured quality (see the birth-quality block in
# specificworker_lifecycle.cpp: confidence · (1−trunc_frac) · periphery · range). A STALE cycle is worth 0 — the
# candidate stays alive but does not accrue — so this counts genuine OBSERVATIONS, not compute cycles.
# VALUE UNCHANGED (8). The tightening comes from valuing each observation correctly, not from raising the bar:
# with a stale cycle worth 0 and every mask scaled by its measured quality, 8 now means 8 IDEAL observations,
# which the same detection has to work much harder to reach. Worked examples at this unchanged 8:
#   clean fridge at 1.5 m, conf 0.90, centred  → ~0.89/frame ⇒ ~9 mask frames (~0.9 s)  — unchanged in practice
#   the `refrigerator 0.53` wall blob at 2.5 m → ~0.36/frame ⇒ ~23 frames of a SUSTAINED, unexplained blob
#   anything at 7 m (q_range = (2.5/7)² = 0.13) → ~0.11/frame ⇒ ~73 frames — a distant blob cannot birth
BirthFrames = 8
# FUSED BIRTH: residual-grid surprise mass under a detection accelerates its birth (independent geometric
# corroboration). birth_evidence = (1 + Gain·m/(m+MassRef)) · quality. Needs residual_concept.
BirthFusion = true         # true to enable; needs BirthSurpriseProbe infra (reads the `grid` node)
BirthFusionGain = 6.0      # max extra evidence/frame at full corroboration (0 ⇒ baseline birth timing)
BirthFusionMassRef = 8.0   # residual mass at which corroboration is half-saturated
BirthFusionRadiusM = 0.50  # window (m) for the residual-mass sample under the detection
BirthMinSepM = 0.60       # a birth must be ≥ this (m) from every existing refrigerator (anti-duplicate)
MergeOverlap = 0.05       # physical exclusion: collapse two instances whose oriented footprints overlap by
                          # ≥ this fraction of the smaller footprint (two refrigerators cannot share space). 0=off.
BirthWidthM = 1.0         # default geometry for a refrigerator BORN from a mask (the fit refines from here)
BirthDepthM = 0.6
BirthHeightM = 0.75
# Ricoh-360 ATTENTION gate. A slice with depth_var>0 is a peripheral 360-RGB YOLO detection (dense ZED slices
# have depth_var==0). It is bearing-only: it never births/associates/fits, it only raises attention
# (process_ricoh_bearings) so the robot seeks a good ZED view.
RicohAttentionConf = 0.60         # min YOLO confidence for a ricoh detection to raise attention

# Ricoh peripheral attention (process_ricoh_bearings) is always on (validated live): ricoh (depth_var>0)
# detections raise attention targets but never fit — the ZED fits. NOTE: ricoh depth is reliable only for FRONTAL
# views; lateral/back views smear the mask cloud, which is why ricoh is attention-only, never a fit source.
# Ricoh attention association gates: small margins on the physical angular size / range roughness when deciding
# whether an unassigned ricoh bearing already matches a known refrigerator (process_ricoh_bearings).
RicohAttentionAngleMargin = 0.05  # extra angular tolerance (rad) on the refrigerator's angular half-size
RicohAttentionRangeBandM  = 1.0   # extra range band (m); ricoh range is rough/indicative

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
