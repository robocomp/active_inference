# object_priors.toml
#
# Prior refrigerator definitions for the refrigerator_concept agent.
# Each [[refrigerators]] entry is checked at startup; if the node named `node_name`
# is absent from the DSR graph it is created with the given geometry.

[[refrigerators]]
node_name  = "refrigerator_1"
width_m    = 1.5          # Prior refrigerator width  (X axis in refrigerator frame)
depth_m    = 1.4          # Prior refrigerator depth  (Y axis in refrigerator frame)
height_m   = 0.75         # Prior refrigerator-top height from floor
room_x_m   = 3.5          # Initial room-frame X (will be refined by active inference)
room_y_m   = 1.2          # Initial room-frame Y
yaw_rad    = 0.0          # Initial heading
sigma_pose = 0.1          # Prior uncertainty on position (m) — used by KL regulariser
sigma_size = 0.60         # Prior uncertainty on dimensions (m)
