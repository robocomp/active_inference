[Proxies]
# This property is used by the clients to connect to IceStorm.
TopicManager = "IceStorm/TopicManager:default -p 9999"

# Proxies for required interfaces
CameraRGBDSimple = "camerargbdsimple:tcp -h localhost -p 12001"
IMU = "imu:tcp -h localhost -p 0"
Lidar3D = "lidar3d:tcp -h localhost -p 11995"

[Endpoints]
# Endpoints for subscriptions interfaces
FullPoseEstimationPubTopic = "tcp -p 0"
FullPoseEstimationPubPrefix = ""

# --- Common Agent Data ---
[Agent]
id = 6 # Change id
name = "robot_concept"
robot_name = "Shadow"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = "shadow.json"   
domain = 0
tree = false
graph = true
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = "shadow.json"
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Period]
Compute = 100
Emergency = 500

# ── [Presence] ────────────────────────────────────────────────────────────────
# required_agent_names   = ["a","b"]  # Must be Ready before on_required_ready fires (blocks Operating state)
# optional_agent_names   = ["a","b"]  # Tracked; fires on_optional_agent_ready/lost but never blocks
# required_agent_ids     = [1,2]      # Same as required_agent_names but by numeric DSR agent ID
# optional_agent_ids     = [1,2]      # Same as optional_agent_names but by ID
# node_requires          = ["body"]   # DSR node names that must exist in graph (checked every tick)
# monitor_period_ms      = 500        # Timer period for scan + timeout checks (ms)
# heartbeat_timeout_ms   = 3000       # Silence after which a peer is downgraded to Stale (ms)
# rejoin_grace_ms        = 1500       # Grace window after detected restart before peer is Ready again (ms)
# agent_info_period_ms   = 1000       # How often this agent publishes its own heartbeat (ms)
# config_dir             = "etc"      # Dir searched for {peer}.toml to clean up crashed peer's owned nodes
#
# ── [Owns] ────────────────────────────────────────────────────────────────────
# nodes    = ["node_a","prefix_*"]    # DSR nodes deleted on clean shutdown; * is a prefix wildcard
# subtrees = ["root_node"]            # Root nodes whose entire RT-edge subtree is deleted on shutdown
# Note: other agents with config_dir set will also read this file on peer crash to clean up these nodes.
# ──────────────────────────────────────────────────────────────────────────────

[Presence]
optional_agent_names = ["room_concept", "table_concept", "controller"]
config_dir = "etc"
monitor_period_ms = 500
heartbeat_timeout_ms = 3000
rejoin_grace_ms = 1500
agent_info_period_ms = 1000

[Owns]
nodes = ["mind", "robot_concept 6"]
subtrees = ["Shadow"]

[Yolo]
model_path  = "yolo26l-seg.onnx"
conf_thresh = 0.25
iou_thresh  = 0.45
use_gpu     = true
use_trt     = true
accepted_labels = [
	"backpack", "handbag", "suitcase",
	"bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl",
	"banana", "apple", "sandwich", "orange", "broccoli", "carrot",
	"hot dog", "pizza", "donut", "cake",
	"chair", "couch", "potted plant", "bed", "dining table", "toilet", "tv",
	"laptop", "mouse", "remote", "keyboard", "cell phone",
	"microwave", "oven", "toaster", "sink", "refrigerator",
	"book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush"
]

# Hungarian association and mask erosion parameters
mask_erode_kernel = 2
track_association_max_distance_m = 0.7
track_max_missed_frames = 10

[Camera]
# DSR upload frame rates. 0 = every captured frame (no throttle).
dsr_rgb_fps   = 10   # RGB: every frame by default
dsr_depth_fps = 10   # Depth: 5 Hz (large blob, less time-critical)

[Lidar]
# DSR upload rate for lidar point cloud. 0 = every captured scan (no throttle).
dsr_lidar_fps = 0

[Transforms]
# Use RT interpolation for timestamped graph transforms. Disable to fall back to nearest sample.
interpolate_rt = true

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
