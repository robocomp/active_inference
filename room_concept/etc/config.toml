[Proxies]
# This property is used by the clients to connect to IceStorm.
TopicManager = "IceStorm/TopicManager:default -p 9999"
# Proxies for required interfaces
Lidar3D = "lidar3d:tcp -h localhost -p 11995" # FILTER"
Webots2Robocomp = "webots2robocomp:tcp -h localhost -p 10006"
OmniRobot = "omnirobot:tcp -h localhost -p 10004"

[Endpoints]
# Endpoints for subscriptions interfaces
FullPoseEstimationPubTopic = "tcp -p 0"
FullPoseEstimationPubPrefix = ""
JoystickAdapterTopic = "tcp -p 0"
JoystickAdapterPrefix = ""

[Period]
# compute() is <1 ms and the localizer optimizer is <1 ms, so the pose pipeline is period-bound,
# not compute-bound. At 50 ms the lidar-stamp→RT-publish lag was ~90-110 ms = TWO ~50 ms quantizations
# (a fresh scan waits up to one tick to be pumped+localized; the result waits up to one more tick to be
# fetched+published). The lidar source is ~20 Hz (50 ms); oversampling at 16 ms (~60 Hz) collapses both
# waits to <16 ms each → lag ~30-40 ms. Publish stays gated to fresh corrections (≈lidar rate), so no
# extra graph churn. Negligible CPU (compute duty ~6%).
Compute = 16
Emergency = 500

# --- Common Agent Data ---
[Agent]
id = 5 # Change id
name = "room_concept"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree = false
graph = false   # DSR graph viewer optional: the layout GUI is its own top-level window (RoomViewer)
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

# ── [Presence] ────────────────────────────────────────────────────────────────
# required_agent_names   = ["a","b"]  # Must be Ready before on_required_ready fires (blocks Operating state)
# optional_agent_names   = ["a","b"]  # Tracked; fires on_optional_agent_ready/lost but never blocks
# required_agent_ids     = [1,2]      # Same as required_agent_names but by numeric DSR agent ID
# optional_agent_ids     = [1,2]      # Same as optional_agent_names but by ID
# node_requires          = ["body"]   # DSR node names that must exist in graph (checked every tick)
# monitor_period_ms      = 500        # Timer period for scan + timeout checks (ms)
# heartbeat_timeout_ms   = 3000       # Silence after which a peer is downgraded to Stale (ms)
# rejoin_grace_ms        = 1500       # Grace window after detected restart before peer is Ready again (ms)
# agent_info_period_ms   = 1000       # How often this agent publishes its own heartbeat (ms)
# config_dir             = "etc"      # Dir searched for {peer}.toml to clean up crashed peer's owned nodes
#
# ── [Owns] ────────────────────────────────────────────────────────────────────
# nodes    = ["node_a","prefix_*"]    # DSR nodes deleted on clean shutdown; * is a prefix wildcard
# subtrees = ["root_node"]            # Root nodes whose entire RT-edge subtree is deleted on shutdown
# Note: other agents with config_dir set will also read this file on peer crash to clean up these nodes.
# ──────────────────────────────────────────────────────────────────────────────

[Presence]
required_agent_names   = ["robot_concept"]
optional_agent_names   = ["controller", "bottle_concept"]
config_dir             = "etc"
monitor_period_ms      = 500
heartbeat_timeout_ms   = 15000  # wider window: room_concept runs at >100% CPU, DSR signals queue up
rejoin_grace_ms        = 5000
stale_grace_ms         = 120000  # 2 min grace: covers robot_concept restart time
agent_info_period_ms   = 1000

[Owns]
# static-room phase (PreserveBootstrapRoom=true): room_concept does NOT own the room — it is a
# pre-seeded static prior. Keep "room" OUT of subtrees so neither a clean shutdown NOR a peer
# reading this file on our crash deletes it; afford_room isn't created in static mode either.
# When going DYNAMIC, restore: nodes=["room_concept 5","afford_room"], subtrees=["room"].
nodes    = ["room_concept 5"]  # our own agent presence node (cleaned on shutdown / peer-crash)
#subtrees = []                  # was ["room"]; room is a static prior, not owned, in static-room mode

# NOTE: the zero-copy media plane (RGB + LiDAR consumers) needs NO domain/topic
# config. They are read from the media descriptor JSON the producer (robot_concept)
# writes on the "zed"/"helios" nodes, so the consumer always uses the producer's
# dedicated media domain (isolated from Agent.domain = 0). Subscribers are created
# lazily, only once those nodes + descriptors exist.
#
# LiDAR source: LidarIngestor prefers the per-device high plane published by lidar3d_dds
# on the "helios" node (points in the DEVICE frame, metres), transforming them to the robot
# base via the DSR RT tree (body->helios). robot_concept publishes onto that same node while it
# bridges from Ice, so there is one name either way. Override the node/destination-frame names if needed:
# [Media]
# lidar_helios_name = "helios"
# lidar_robot_frame = "body"

[RoomConcept]

# ---- The calibration pivot (afford_calib) ----
# The robot turns 120 degrees on the spot, twelve times: four complete turns back to the heading it
# started from. That closure is the measurement — it turned exactly 8*pi radians as a FACT about
# turning, so comparing the odometry's own accumulation against it needs no map, no survey and no
# localiser. Offered as ordinary Orient affordances, one step at a time; it never drives anywhere, and
# if the controller says the body cannot sweep its diagonal where the robot stands it is believed and
# the offer waits until the day's work has carried the robot somewhere with room.
# ★OFF. This affordance has never driven a robot. The PASSIVE half — watching how well the rotation
# scale is known, from the turning the robot does anyway — runs regardless and commands nothing; look
# for the "[calib] rotation scale ..." line, once a minute.
# ★NOT A THRESHOLD WHEN ON: the offer carries its expected information gain in nats and competes in
# the controller's EFE selection like any exploration cell. It extinguishes itself as the posterior
# sharpens. Measured cold 3.46 nats, after 400 s of ordinary turning 0.01, after 400 s of straight-line
# driving 3.70. On 2026-08-20 this robot's rotation scale measured +0.00007 +/- 0.00039, so expect it
# to lose almost every contest — which is the correct outcome, not a broken feature.
CalibPivotEnabled      = false

RoomLayoutSvg          = "room_4x4.svg"  # room polygon (room_contour) loaded at start; was hardcoded beta_layout.svg
# Put the room-frame origin on the layout's geometric (bbox) centre instead of wherever the SVG
# author placed (0,0). Matters for plans traced from a corner (apartamento); layouts already
# drawn about their middle barely move. Flipping this SHIFTS the room frame: delete
# etc/last_robot_pose.txt and restart the fleet on a clean graph.
RecenterRoomPolygon    = true
PreserveBootstrapRoom  = true  # static-room phase: adopt the pre-seeded room/table from the bootstrap graph; do NOT delete on start or overwrite robot->room. Set false to go dynamic (localize + create room).
PredictionEarlyExit    = true  # Skip optimization when prediction error < threshold
SigmaSdf               = 0.15  # σ_obs del SDF para el umbral de early exit (m)
PredictionTrustFactor  = 0.7   # threshold = SigmaSdf × factor  → 12 cm
MinTrackingSteps       = 5     # Warm-up tras reset: 5 frames (default 20).
                                # Con 20 se perdían 20 frames de Adam obligatorio
                                # tras cada recovery antes de que early exit
                                # pudiera actuar. Con 5 se alcanza steady-state
                                # en cuanto la ventana está llena.
RotationSdfCoupling    = 0.5   # Extra tolerancia SDF por rotación (m/rad)

# ── 180° symmetry-flip guard (harden against spurious flips) ───────────────────
# The optimizer periodically tests whether rotating the robot 180° fits the room
# better. Evidence accumulates leakily and must cross a confidence-scaled threshold
# before the pose is actually flipped. Raising the base threshold makes a flip
# require MORE sustained contrary evidence → harder to flip on a momentary
# tight-turn degeneracy. (Header default 0.02; doubled here.)
SymmetryFlipEvidenceThresh = 0.04
# Companion knobs (header defaults shown) — raise the first two / lower the leak to
# harden further:
#   SymmetryFlipMinImprovement = 0.005  # per-check loss advantage to count as evidence
#   SymmetryEvidenceLeak       = 0.6    # per-check retention (<1 → blips decay; lower = harder)
#   SymmetryConfidenceGain     = 0.05   # extra threshold per established frame
# One row per symmetry check (loss/evidence/threshold/streak + which candidate would win),
# written to tmp/sdf_localizer/symmetry_check_<ts>.csv — use this to catch a flip in the act.
SymmetryDebugCsv = true

# ── Selección de optimizador ──────────────────────────────────────────────────
# "ADAM"  — Adam adaptativo (default probado, robusto lejos del mínimo)
# "LBFGS" — L-BFGS con line search Wolfe (convergencia más rápida, ~8-12 evals)
# "CAVI"  — reservado para implementación futura
OptimizerType          = "LBFGS"

# ── Gauss-Newton / Levenberg-Marquardt backend (room_gn_solver.h) ─────────────
# Same objective as compute_rfe_loss, solved as a 15x15 normal-equation system with ANALYTIC
# Jacobians (Model::sdf_query_at_pose already returns the SDF gradient) instead of ~29 autograd
# forward+backward passes. Measured on the autograd backend: t_update median 72.7 ms.
#
# BOTH OFF by default, at two independent levels:
#   OptimizerType = "GN"  -> GN drives the pose (authority).
#   GnShadow = true       -> GN runs BESIDE the authoritative backend, from the SAME starting state,
#                            and only WRITES the CSV. The live pose is untouched: a numerical
#                            comparison on identical inputs, not a behavioural A/B. Automatically
#                            inert while OptimizerType is "GN" (nothing left to compare against).
#
# Acceptance criteria before setting OptimizerType = "GN" (read etc/gn_shadow.csv):
#   - grad_relerr_basin < 1e-2   (needs GnGradCheck = true: analytic Jacobian matches the numeric one.
#                                 Sampled 5 mm / 2 mrad OFF the converged pose, the only band where a
#                                 RELATIVE check means anything -- at the optimum the true gradient is
#                                 ~0 so both terms are float noise, and far out the polygon SDF is
#                                 piecewise and the finite difference is not a fair reference.)
#   - |dx|,|dy| ~ mm and |dth| ~ 5e-4 rad     (same solution as Adam/L-BFGS)
#   - torch_obj_at_gn <= torch_obj_at_auth    (GN's answer is no worse ON TORCH'S OBJECTIVE; compare
#                                              against torch_obj_at_auth, NOT loss_auth -- the latter
#                                              is reported before the authority's final step)
#   - ms_gn << ms_auth                        (the whole reason this exists)
# GnGradCheck costs 2x30 extra loss evaluations per optimized frame: on to validate, off to measure
# time (it inflates ms_gn AND lengthens the frame, delaying the next one).
# The CSV only grows on OPTIMIZED frames (~0.7% of all, 4.7% while moving) -- a parked robot writes
# nothing, the run needs teleop.
# GnShadow      = false
# GnGradCheck   = false
# GnShadowCsv   = "etc/gn_shadow.csv"
# GnMaxIters    = 20     # a rejected step costs ~0.3 ms against the 63-97 ms of the autograd backend
# GnLambdaInit  = 1e-3   # Levenberg damping, relative to diag(H)
# GnStepTol     = 1e-5   # ||delta||_inf (m / rad) convergence test
# GnLossRelTol  = 1e-5   # relative improvement counting as stalled; TWO in a row are needed to stop
#                        # (one slow step is not convergence: Levenberg damping drops after every
#                        #  accepted step, so the next one usually advances much further)
# ── Parámetros L-BFGS ─────────────────────────────────────────────────────────
# Activos solo cuando OptimizerType = "LBFGS"
# LbfgsLr: paso inicial; el line search strong-Wolfe lo ajusta automáticamente.
# Usar 1.0 (paso Newton completo). No requiere escalar como Adam.
LbfgsLr               = 1.0    # Paso inicial (el line search lo ajusta)
LbfgsHistorySize      = 10     # Pares (s,y) para H^-1; igualado a W=10 (30 DOF)
LbfgsToleranceGrad    = 1e-4   # Para cuando ||grad||_inf < tol (convergencia fina)
LbfgsToleranceChange  = 1e-7   # Para cuando |Δloss| < tol entre pasos

# ── Optimizador Adam ──────────────────────────────────────────────────────────
NumIterations          = 25    # Iteraciones Adam (o pasos Newton máx para LBFGS).
                                # Con W=1 solo hay término SDF; Adam converge en ~15-20 iters.
LearningRatePos        = 0.05  # LR base; escalado a lr/√W internamente
ObsSigma               = 0.05  # σ ruido SDF en la función de pérdida (m)
HuberDelta             = 0.15  # Umbral Huber para saturar outliers (m)
ConvergenceRelTol      = 0.001 # FIX 2: de 0.01 a 0.001. El criterio anterior
                                # paraba en escalones intermedios de la cola
                                # larga del motion factor (loss ~15-20 cuando
                                # el mínimo real era ~10). Con 0.001 sólo para
                                # en el plateau verdadero.
ConvergenceMinIters    = 5     # Iters mínimas antes de aplicar el criterio

# ── Ventana deslizante (RFE) ──────────────────────────────────────────────────
WindowSize             = 5  # Slots retenidos. Objetivo del experimento.
MaxLidarPoints         = 400   # Puntos slot actual (anterior 400). Más densidad
                                # → gradiente SDF más estable con W grande.
MaxLidarOldSlot        = 200   # Puntos slots antiguos (anterior 100). Mejora el
                                # condicionamiento de los motion factors.
BoundaryQualityGate    = true  # Suprime prior de frontera si frame anterior fue
                                # malo: w = min(1, σ²/sdf_mse_prev). ON para
                                # observar su efecto a W=10.

# ── Boundary prior quality gates (Soluciones B y C) ─────────────────────────
# Evitan que el prior de frontera sea "envenenado" por scans contaminados
# (desplazamiento forzado, obstáculo persistente).
# B: si sdf_mse_final del slot > HessianQualityThreshold → Hessiana solo cinemática.
# C: si sdf_mse_final del slot > MuQualityThreshold → mu no se actualiza.
BoundaryHessianQualityThreshold = 0.06   # m — umbral para incluir H_obs en Hessiana
BoundaryMuQualityThreshold      = 0.10   # m — umbral para actualizar mu del prior
EigenvalueClampBoundaryMax      = 500.0  # techo autovalores precisión (evita over-confidence)

# ── Precisión jerárquica del prior de frontera (HIERARCHICAL_PRECISION.md) ──────
# Sustituye BoundaryQualityGate por una precisión INFERIDA π=exp(u_b): hiperprior
# Gamma/log-precisión sobre el residuo r_b del propio factor de frontera, con un
# estado lento interno v (map_trust, Opción A) que la predice top-down g(v)=u0+k·v.
# OFF por defecto ⇒ comportamiento idéntico al gate actual. NO activar en vivo sin avisar.
# HierPrecBoundaryEnabled = false
# HierPrecU0              = 0.0    # media prior de log-precisión (exp(0)=1 → prior completo)
# HierPrecSigmaU2         = 1.0    # cuánto puede desviar r_b a u de g(v)
# HierPrecLrU             = 0.1    # paso del update de π (rápido, por frame)
# HierPrecGGain           = 1.0    # k en g(v)=u0+k·v (mapa top-down)
# HierPrecLrV             = 0.02   # paso del estado lento v (map_trust)
# HierPrecSigmaV2         = 1.0    # escala prior del estado v

# ── Relocalización FE-nativa por colapso de map-trust (HIERARCHICAL_PRECISION.md) ──
# Cuando exp(u_b) cae bajo el suelo varios frames → misma grid search jerárquica que
# RecoveryManager (que se mantiene como backstop de sdf crudo). OFF por defecto.
# NO activar en vivo sin avisar ([[ask-before-changing-running-params]]).
# HierPrecRelocEnabled         = false
# HierPrecRelocFloor           = 0.10  # exp(u_b) bajo esto = colapso de confianza en el mapa
# HierPrecRelocConsecutive     = 3     # frames bajo el suelo antes de disparar (debounce)
# HierPrecRelocCooldownFrames  = 30    # frames suprimidos tras un disparo
# HierPrecEeDthetaMin          = 0.15  # rad (|Δθ|) que habilita el nudge en early-exit (giro)

# ── Recovery ──────────────────────────────────────────────────────────────────
RecoveryLossThreshold    = 0.45  # sqrt(sdf_mse) > umbral → frame malo (m).
                                  # Anterior 0.2 disparaba en giros normales.
RecoveryConsecutiveCount = 10    # Frames malos consecutivos para recovery.
                                  # Anterior 3 reseteaba la ventana cada ~30 f.
RecoveryCooldownFrames   = 60    # Frames sin detection tras recovery (default 30).
                                  # 60 garantiza que W llega a 10 antes de que
                                  # el detector vuelva a estar activo.

# ── Pesos de gradiente adaptativos por velocidad ──────────────────────────────
VelocityAdaptiveWeights  = false # OFF con LBFGS: escalar grad post-backward corrompe
                                 # los pares (s,y) de la aproximación H^-1 → el log
                                 # mostraba grad_norm residual ~0.09 (≫ tol=1e-5) y
                                 # 0/53 frames con convergencia real.
LinearVelocityThreshold  = 0.05  # m/s — por debajo = no traslación
AngularVelocityThreshold = 0.10  # rad/s — por debajo = no rotación
WeightBoostFactor        = 2.0   # Multiplicador para el eje dominante
WeightReductionFactor    = 0.5   # Multiplicador para ejes secundarios
WeightSmoothingAlpha     = 0.3   # EMA de transición entre perfiles

# ── Modelo de ruido de movimiento ────────────────────────────────────────────
UseCommandVelocityPrior = true   # Master switch for the COMMAND (joystick / controller) motion prior.
                        # true  = historical behaviour: fused (command + encoder) when both channels
                        #         are fresh, else measured, else command, else fallback_zero.
                        # false = the command channel is still computed and logged (cmd_* columns keep
                        #         their real values) but never enters the prediction; the selection
                        #         collapses to measured / fallback_zero. A command is a statement of
                        #         INTENT, not of motion — the wheels may not have obeyed it. Check the
                        #         flag took by reading `motion_prior_source` in ai2_log.csv, NOT the
                        #         cmd_* columns, which deliberately keep reporting what the channel
                        #         WOULD have said.
OdomNoiseScale  = 1.0   # Sin inflado artificial (anterior 1.5 distorsionaba
                         # el balance boundary/obs/motion en la pérdida RFE)
CmdNoiseTrans   = 0.20  # Fracción de ruido translacional del comando (m/m)
CmdNoiseRot     = 0.10  # Fracción de ruido rotacional del comando (rad/rad)
CmdNoiseBase    = 0.05  # Ruido base translacional del comando (m)
OdomNoiseTrans  = 0.08  # Fracción de ruido translacional de odometría
OdomNoiseRot    = 0.04  # Fracción de ruido rotacional de odometría
OdomNoiseBase   = 0.01  # Ruido base translacional de odometría (m)
EncoderRotSlipK = 0.05  # Incertidumbre extra por slip: (k·|ω|)² (rad/rad·s⁻¹)
StationaryMotionThreshold = 0.02  # FIX 1: de 0.001 a 0.02 m. Cuando el robot
                                   # está parado, position_std = este valor y
                                   # cov(0,0) = (0.02)² = 4e-4 m². El valor
                                   # anterior (0.001 m = 1mm) causaba spikes de
                                   # loss_motion hasta 6000: con residuo 3.4cm
                                   # y cov=1e-6 → loss = 0.5×(0.034)²/1e-6 = 578.
                                   # Con 0.02 m el mismo residuo da loss = 1.4.

# ── Online motion model learning ──────────────────────────────────────────────
# Continuously adapt three odometry noise parameters from post-optimisation
# residuals of the RFE window.  All updates are gated on localization quality
# (SDF MSE < BoundaryHessianQualityThreshold).
#
#   LearnMotionModel      — master switch (false = all static params used)
#   MotionLearnAlpha      — EMA rate for slip-k and translational noise fraction
#   MotionLearnBeta       — EMA rate for odometry bias vector (slower)
#   MotionLearnMinOmega   — min |ω| (rad/s) for slip-k sample to be used
#   MotionLearnMinFrames  — warmup: static params used until this many quality
#                           frames have been accumulated (default 50 ≈ 10 s @ 5 Hz)
LearnMotionModel            = false   # static params are authoritative -- see below
# 08-09: A/B'd and REJECTED, do not turn on again without first fixing what update_motion_model
# measures. It learns slip_k ~= 0.81 (sigma_meas 0.039 rad against a true increment of 0.036), the
# measured prior collapses to weight 0.04 during fast turns, the prior falls back onto the command
# channel, and early exit while rotating went 91.6% -> 68.5%. It was also the only configuration of
# four that LOST THE TRACK (7 recovery episodes in 6.2 min against 0). The defect is the residual it
# learns from -- a post-optimisation window-pair residual carrying the optimiser's own correction --
# so it is CODE, not a simulation artefact, and it will fail the same way on the real robot.
MotionLearnAlpha            = 0.05    # slip-k and trans-noise EMA rate
MotionLearnBeta             = 0.02    # bias EMA rate
MotionLearnMinOmega         = 0.05    # rad/s — min angular speed per slot to update slip-k
MotionLearnMinTrans         = 0.02    # m  — min *accumulated* translation over the full window
MotionLearnMinFrames        = 50      # warmup frames
MotionLearnQualityThreshold = 0.12    # Per-slot SDF MSE gate for motion learning.
                                      # Independent from BoundaryHessianQualityThreshold;
                                      # set higher so learning is not starved of data
                                      # (typical sdf_mse while moving is 0.06-0.09).

# ── Feature flags ─────────────────────────────────────────────────────────────
DifferentialTest     = false  # Sin overhead A/B: experimento limpio
SdfCurrentSlotOnly   = true   # SDF obs solo en el slot actual; slots antiguos aportan
                              # solo via motion factors + corners. ~67% menos SDF evals.
EnableCornerTracking = true  # Activa factores de esquinas en la perdida RFE
FarPointsWeight      = true   # Ponderación por distancia: puntos lejanos más peso
FarPointsExponent    = 2.0   # α — exponente de la distancia.
                              #   α=1: lineal (original). α=2: cuadrático (recomendado).
                              #   Fórmula: w_i = dist_i^α / mean(dist^α), re-norm tras floor.
                              #   Mayor α → gradiente dominado por puntos en paredes lejanas,
                              #   mejor precisión angular pero más sensible a puntos espurios.
FarPointsMinWeight   = 0.1   # Floor de peso (evita anular puntos muy cercanos).
UseCuda              = false   # Fallback automático a CPU si falla
DebugLog             = false  # CSV → tmp/sdf_localizer/log.csv

# ── Rerun (desactivado para timing limpio) ────────────────────────────────────
RerunEnabled      = false     # OFF: elimina ~3 ms/frame de overhead de red
RerunHost         = "127.0.0.1"
RerunPort         = 9877
RerunSdfEveryN    = 20
RerunSdfResolution = 150
RerunMaxQueue     = 30

# ── Epistemic Controller ───────────────────────────────────────────────────────
[EpistemicController]
PublishAffordance  = true   # publish the room exploration affordance. Set false so the room never offers an
                            # affordance and can't out-compete object affordances in the controller's EFE
                            # selection (e.g. the 360-glance chair experiment).
# ---- Arc trajectory generation ----
NumArcCurvatures   = 9      # discrete curvatures sampled (odd ⇒ includes κ=0)

# ---- Policy rollout & EFE ----
HorizonSteps       = 20     # rollout length in steps
Dt                 = 0.2    # step duration (s); rollout horizon = HorizonSteps × Dt
MaxAdvSpeed        = 0.9    # m/s
MaxRotSpeed        = 0.75   # rad/s
WEpistemic         = 0.1    # EFE weight: information gain
WPragmatic         = 3.0    # EFE weight: goal proximity
WHeading           = 2.0    # EFE weight: heading alignment
WBoundary          = 10.0   # EFE weight: room boundary avoidance

# ---- Approach speed ----
KRot               = 3.5    # proportional gain for heading correction
GaussianSigma      = 0.5    # goal proximity Gaussian σ (m)
SpeedHorizonS      = 0.4    # max time-to-target (s) for approach speed ramp
                            # decoupled from rollout horizon; lower = more decisive

# ---- Obstacle avoidance ----
ObstacleRadius     = 0.35   # robot clearance radius (m)
ObstacleK          = 0.5    # obstacle repulsion gain
ObstacleStepCap    = 10.0   # max repulsion step size
WObstacle          = 2.0    # EFE weight: obstacle penalty
WallFilterMargin   = 0.30   # lidar points within this margin of wall are ignored (m)

# ---- Perceptual bandwidth speed limit ----
BandwidthCoupling  = 0.3    # reduces max adv speed when rotating: eff_v = max_v × (1 - k×|ω|/ω_max)

# ---- Reactive speed governor ----
SdfSafe            = 0.06   # SDF-MSE below this → full speed
SdfDanger          = 0.10   # SDF-MSE at/above this → minimum speed
GovernorAlphaMin   = 0.4    # minimum speed fraction when localization is poor

# ---- FIM scoring ----
FimCornerSigma     = 0.04   # corner detection noise σ (m)
FimMaxRange        = 10.0   # max corner visibility range (m)

# ---- Target selector (EpistemicPlanner) ----
GridResolution     = 0.5    # spacing between candidate targets (m)
MinDistance        = 1.0    # ignore targets closer than this to robot (m)
MaxCandidates      = 2000   # cap on evaluated candidates
TargetWallMargin   = 1.0    # reject targets closer than this to walls (m)
AngularDominanceRatio = 50.0 # σ²_θ / max(σ²_x, σ²_y) threshold to trigger rotate-in-place
WExploration       = 0.5    # weight: distance bonus (explore farther)
IorCellSize        = 0.5    # inhibition-of-return grid resolution (m)
IorDecayTime       = 120.0  # seconds until visited cell is fully stale
WIor               = 1.0    # MULTIPLICATIVE staleness suppressor exponent on fim_gain (score *=
                            # staleness^WIor). NOTE: this vanishes once fim_gain→0, so it cannot keep
                            # the robot moving after localization — that job is WIorDrive below.
WIorDrive          = 0.5    # ADDITIVE, non-saturating IoR patrol drive (nats per unit staleness).
                            # The pose-FIM term saturates in a static convex room, so without this
                            # the robot stops after a few affordances. Staleness recovers over
                            # IorDecayTime → the robot perpetually revisits the stalest reachable
                            # cell. Kept below the info-term magnitude so real info-gathering wins
                            # first; it only dominates once info is exhausted. 0 ⇒ robot rests when
                            # the room is fully known. TUNE: raise if it still stalls; lower if it
                            # patrols too eagerly before finishing localization/coverage.
WPathInterest      = 0.7    # blend weight: 0=target staleness only, 1=path staleness only (multiplicative IoR)
ArrivalDistance    = 0.15   # target reached threshold (m)
DwellTime          = 2.0    # seconds to pause after reaching target
# Belief forgetting: the pose-FIM epistemic gain self-extinguishes once localized (afford_room goes
# silent "after a while"). >0 makes the epistemic pose-prior precision decay toward its floor over this
# many seconds WHILE IDLE, so the gain recovers and the robot periodically re-verifies the room
# (breathe-in/out with period ≈ this value). Resets while actively exploring. 0 = off. Scoring-only —
# never touches the localizer covariance.
BeliefForgetTime   = 90.0   # seconds; 0 disables

# ---- Acceleration ramp (SpecificWorker) ---- MOVE THIS TO ROBOT
MaxLinAccel        = 1.2    # m/s² max translational acceleration
MaxRotAccel        = 2.0    # rad/s² max angular acceleration

[Overlay]
# DSR node types projected as oriented boxes on the camera RGB overlay (walls are always drawn).
# Comma-separated; add/remove types here to control what appears. Default covers all concept agents.
ObjectTypes = "object,table,cylinder,chair"

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
