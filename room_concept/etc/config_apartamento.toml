[Proxies]
# This property is used by the clients to connect to IceStorm.
TopicManager = "IceStorm/TopicManager:default -p 9999"
# Proxies for required interfaces
Lidar3D = "lidar3d:tcp -h localhost -p 11995" # FILTER"
Webots2Robocomp = "webots2robocomp:tcp -h localhost -p 10006"
OmniRobot = "omnirobot:tcp -h localhost -p 10004"

[Endpoints]
# Endpoints for subscriptions interfaces
FullPoseEstimationPubTopic = "tcp -p 0"
FullPoseEstimationPubPrefix = ""
JoystickAdapterTopic = "tcp -p 0"
JoystickAdapterPrefix = ""

[Period]
Compute = 50
Emergency = 500

# --- Common Agent Data ---
[Agent]
id = 5 # Change id
name = "room_concept"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree = false
graph = false 
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

# ── [Presence] ────────────────────────────────────────────────────────────────
# required_agent_names   = ["a","b"]  # Must be Ready before on_required_ready fires (blocks Operating state)
# optional_agent_names   = ["a","b"]  # Tracked; fires on_optional_agent_ready/lost but never blocks
# required_agent_ids     = [1,2]      # Same as required_agent_names but by numeric DSR agent ID
# optional_agent_ids     = [1,2]      # Same as optional_agent_names but by ID
# node_requires          = ["body"]   # DSR node names that must exist in graph (checked every tick)
# monitor_period_ms      = 500        # Timer period for scan + timeout checks (ms)
# heartbeat_timeout_ms   = 3000       # Silence after which a peer is downgraded to Stale (ms)
# rejoin_grace_ms        = 1500       # Grace window after detected restart before peer is Ready again (ms)
# agent_info_period_ms   = 1000       # How often this agent publishes its own heartbeat (ms)
# config_dir             = "etc"      # Dir searched for {peer}.toml to clean up crashed peer's owned nodes
#
# ── [Owns] ────────────────────────────────────────────────────────────────────
# nodes    = ["node_a","prefix_*"]    # DSR nodes deleted on clean shutdown; * is a prefix wildcard
# subtrees = ["root_node"]            # Root nodes whose entire RT-edge subtree is deleted on shutdown
# Note: other agents with config_dir set will also read this file on peer crash to clean up these nodes.
# ──────────────────────────────────────────────────────────────────────────────

[Presence]
required_agent_names   = ["robot_concept"]
optional_agent_names   = ["controller", "bottle_concept"]
config_dir             = "etc"
monitor_period_ms      = 500
heartbeat_timeout_ms   = 15000  # wider window: room_concept runs at >100% CPU, DSR signals queue up
rejoin_grace_ms        = 5000
stale_grace_ms         = 120000  # 2 min grace: covers robot_concept restart time
agent_info_period_ms   = 1000

[Owns]
# static-room phase (PreserveBootstrapRoom=true): room_concept does NOT own the room — it is a
# pre-seeded static prior. Keep "room" OUT of subtrees so neither a clean shutdown NOR a peer
# reading this file on our crash deletes it; afford_room isn't created in static mode either.
# When going DYNAMIC, restore: nodes=["room_concept 5","afford_room"], subtrees=["room"].
nodes    = ["room_concept 5"]  # our own agent presence node (cleaned on shutdown / peer-crash)
#subtrees = []                  # was ["room"]; room is a static prior, not owned, in static-room mode

# Zero-copy RGBD media plane (RGB consumer). DEDICATED DDS domain, isolated from
# the DSR Agent.domain = 0 so media discovery churn never perturbs cortex/DSR
# resync. Must MATCH the robot_concept producer.
[Media]
#domain_id = 7          # media-plane DDS domain comes from the producer descriptor; leave commented
#rgb_topic = "rc/zed/rgb"
# Upper bound of the LiDAR high band (m, body frame). The apartamento ceiling (3 m) is above the
# helios's vertical reach (~2.77 m), so the topmost returns are clean upper-WALL points, not ceiling.
# Keep the band up near the reach limit so those points feed the SDF; the CeilingCheck's perimeter-vs-
# interior test only cuts the band when the high returns are genuinely interior (a real low ceiling).
lidar_high_max_height = 2.75

[RoomConcept]

# ---- The calibration pivot (afford_calib) ----
# The robot turns 120 degrees on the spot, twelve times: four complete turns back to the heading it
# started from. That closure is the measurement — it turned exactly 8*pi radians as a FACT about
# turning, so comparing the odometry's own accumulation against it needs no map, no survey and no
# localiser. Offered as ordinary Orient affordances, one step at a time; it never drives anywhere, and
# if the controller says the body cannot sweep its diagonal where the robot stands it is believed and
# the offer waits until the day's work has carried the robot somewhere with room.
# ★OFF. This affordance has never driven a robot. The PASSIVE half — watching how well the rotation
# scale is known, from the turning the robot does anyway — runs regardless and commands nothing; look
# for the "[calib] rotation scale ..." line, once a minute.
# ★NOT A THRESHOLD WHEN ON: the offer carries its expected information gain in nats and competes in
# the controller's EFE selection like any exploration cell. It extinguishes itself as the posterior
# sharpens. Measured cold 3.46 nats, after 400 s of ordinary turning 0.01, after 400 s of straight-line
# driving 3.70. On 2026-08-20 this robot's rotation scale measured +0.00007 +/- 0.00039, so expect it
# to lose almost every contest — which is the correct outcome, not a broken feature.
CalibPivotEnabled      = false

RoomLayoutSvg          = "apartamento_layout.svg"  # apartamento layout; walls in webots-piso/Piso.wbt regenerated to match (room frame = -x_svg, y_svg)
# Put the room-frame origin on the layout's geometric (bbox) centre instead of wherever the SVG
# author placed (0,0). Matters for plans traced from a corner (apartamento); layouts already
# drawn about their middle barely move. Flipping this SHIFTS the room frame: delete
# etc/last_robot_pose.txt and restart the fleet on a clean graph.
RecenterRoomPolygon    = true
RoomHeight             = 3.0   # m — real apartamento ceiling. Sets the room DSR node room_height (walls/ceiling overlay) and the expected ceiling for the LiDAR startup check. The LiDAR can't reach 3 m, so set it here rather than relying on detection.
PreserveBootstrapRoom  = false  # static-room phase: adopt the pre-seeded room/table from the bootstrap graph; do NOT delete on start or overwrite robot->room. Set false to go dynamic (localize + create room).
PredictionEarlyExit    = true  # Skip optimization when prediction error < threshold
SigmaSdf               = 0.15  # σ_obs del SDF para el umbral de early exit (m)
PredictionTrustFactor  = 0.7   # threshold = SigmaSdf × factor  → 12 cm
MinTrackingSteps       = 5     # Warm-up tras reset: 5 frames (default 20).
                                # Con 20 se perdían 20 frames de Adam obligatorio
                                # tras cada recovery antes de que early exit
                                # pudiera actuar. Con 5 se alcanza steady-state
                                # en cuanto la ventana está llena.
RotationSdfCoupling    = 0.5   # restored to original after rot_boost=0 validation (07-15). FEJ+Schur now handles turn poisoning without this crutch.

# ── Innovation-based adaptive covariance ──────────────────────────────────────
# The published sigma is otherwise inert: a 26x change in innovation (2.4 -> 62.7 mm) moves sigma_xy by
# 6%. It comes from the Laplace curvature — how SHARP the minimum is, not whether it is the RIGHT one —
# so a confident wrong pose is published as confident, the controller's speed governor never engages,
# and every concept agent folds a constant into its common-mode variance.
# Two process-noise approaches were tried and BOTH measured as failures: accumulating the full Q gave
# mean sigma +69% and 29.7% of frames above the 0.080 throttle knee for a ratio of only 1.122 (Q is 86%
# a per-frame constant, so that was accumulating TIME, which has r=+0.001 against the correction that
# follows); accumulating only the motion-proportional part preserved the mean but gave ratio 1.000.
# INSTEAD: the innovation is a direct sample of the estimator's own error, so publish
#     sigma_ii = max(laplace_ii, EMA[innovation_i^2])
# The covariance then cannot claim more precision than the estimator's disagreements demonstrate.
# At the median innovation (12 mm) the Laplace term (44 mm) dominates and the mean is untouched; a
# sustained run of large innovations (p99 97 mm — the corridor) lifts it. Mean unchanged, range restored.
AdaptiveCovEnabled     = true 
AdaptiveCovLambda      = 0.02   # EMA rate ~= 50-frame memory: one bad frame cannot spike the governor

# ── Strided RFE window ────────────────────────────────────────────────────────
# The window holds WindowSize poses, but at the lidar rate they are nearly the SAME pose: measured
# while moving, max pairwise separation across the 5 slots is 76 mm (p50) in a ~9 m room, and 75.8% of
# frames span under 20 mm. That is the conditioning under which LATERAL position is weakly observable,
# and the published pose then rattles sideways — consecutive cross-track increments alternate sign 61%
# of the time (heading is clean at 4.8%). That lateral rattle is the wobble felt on the robot, and it
# is built from individually legal steps (99% inside the kinematic clamp budget), so no magnitude cap
# removes it. Striding admits a new slot only after real motion; until then the newest slot is replaced
# in place, so the current frame is always represented without consuming the window's span.
# Predicted baseline: 76 mm -> ~222 mm at 0.10 m spacing, ~448 mm at 0.25 m.
# ★ Watch loss_boundary for a ratchet — a longer stride means each admitted slot carries more drift.
WindowStrideEnabled    = true 
WindowMinTravel        = 0.10   # m of travel before a new slot is admitted
WindowMinTurn          = 0.15   # rad of turn before a new slot is admitted (whichever comes first)

# ── Preintegrated motion covariance (OFF — see src/se2_preintegration.h) ──────
# Replaces the ASSERTED diagonal from compute_motion_covariance() with one PROPAGATED through the
# interval's odometry samples. The MEAN is untouched (same midpoint-θ integration, same arithmetic),
# so this is covariance-only and both optimizer backends pick it up unchanged — MotionFactor and the
# torch motion term already consume a full 3x3 precision, so there is no factor edit and no risk of
# the two objectives diverging in the shadow log.
#
# WHAT IT FIXES, in order of how much it matters here:
#  1. WindowStrideEnabled is TRUE above, and the strided path accumulates the motion covariance as
#     `stride_cov_accum_ += slot_motion_cov` ("independent increments"). That drops the transport
#     term — an error in the heading accumulated so far rotates ALL the translation that follows.
#     Measured in gn_selftest against one continuous integration: chain() is exact to 3.6e-7 where
#     the additive sum is off by 7.8%. This is a LIVE defect, not a hypothetical one — but size it
#     honestly: 7.8% is the selftest trajectory (0.4 rad over 0.5 s). At the stride limits actually
#     configured above (0.10 m / 0.15 rad) the additive sum is off by only 2.2-3.6%, reaching 8.8% if
#     an interval ever spans twice the turn limit. So this is a correctness fix worth having, not a
#     large numerical error at today's settings.
#  2. The legacy floor DROPS from StationaryMotionThreshold (0.02) to OdomNoiseBase (0.01) the moment
#     |Δp| clears 0.02 m, so it asserts MORE position uncertainty when barely moving than when moving
#     fast. The propagated form has no switch.
#  3. RotationPositionCoupling inflates position by 0.15·|Δθ| even for a pivot in place, where a
#     heading error has no translation to rotate. Geometry says 0 there; the recursion says 0.
#  4. dt enters where the physics puts it, so the constants stop being update-rate dependent. This is
#     the 08-09 units defect (k·|Δθ|/dt used as rad, σ inflated 16x) made structurally impossible.
#
# The densities are DERIVED in room_config.cpp from the legacy constants below, so the two models
# cannot drift apart; the Preint* keys are overrides for when they are actually measured. Verified
# against 40k Monte Carlo at 0.6% relative Frobenius error (make -C build gn_selftest && ./bin/gn_selftest).
#
# ⚠ BEFORE FLIPPING THIS, read the measured A/B table in Params::motion_preintegration. Summary: for
# the ODOMETRY channel the parked regime is identical and everywhere else the propagated form is
# 1.3-1.7x LOOSER in position, not tighter. That is the legacy shape being wrong, but it IS a
# behavioural change and needs a MOVING run to settle — watch early exit while translating, innov_norm
# and loss_motion, and note that loss_motion is exactly what StationaryMotionThreshold = 0.02 was
# raised to suppress.
# ⚠ AND THE PARKED REGIME DOES CHANGE, through the COMMAND channel: legacy's stationary branch gives
# the command the same 0.02 floor as the encoder (verified live — cmd_cov_xx and meas_cov_xx both read
# 4e-4), while the derivation gives it CmdNoiseBase 0.05. Parked, that takes the fused cov_xx from
# 2.00e-4 to 3.45e-4 and the fusion weight on the encoder from 0.50 to 0.86. Kept on purpose (a parked
# encoder is worth more than a parked open-loop command, and legacy discards that distinction exactly
# where it is strongest) — but if the A/B must differ in one thing only, set
# PreintCmdSigmaVLat/PreintCmdSigmaVLong = 0.0894 to restore the legacy parked value.
# ⚠ The cross terms are nearly invisible at these constants (rho(y,θ) = -0.028) because that 0.02 m
# per-frame floor = 0.089 m/√s of position random walk for a PARKED robot swamps them. Calibrating
# sigma_* against the real odometry stream is the load-bearing next step, not a refinement.
MotionPreintegration   = true   # 2026-08-13 LANDED ON. The controlled A/B (same route, spans matched to
                                # 3 cm) is NULL in every moving band and +0.63 pp early exit while parked
                                # (the only difference outside its Wilson 95% CI); cov_tt unchanged,
                                # no boundary ratchet, timing identical. So this is kept on STRUCTURAL
                                # grounds — dt enters where the physics puts it, chain() is exact where
                                # the additive sum was 2-4% off, the cross terms exist, and ~8 hand-set
                                # constants become measurable densities — NOT on measured performance.
                                # ⚠ It cannot earn its keep until PreintOdomSigma* is calibrated against
                                # the real odometry stream; today's derived floor swamps the new shape.
                                # ARM log_2026-08-13_12-05-32.csv / BASE log_2026-08-13_12-12-57.csv.
                                # THE WAY BACK IS ONE WORD: false — no rebuild needed.
# PreintOdomSigmaVLat  = 0.0894   # m/√s   — derived from max(StationaryMotionThreshold, OdomNoiseBase)/√0.05
# PreintOdomSigmaVLong = 0.0894
# ★★ STAGED DOWN 2026-08-18, 0.0447 -> 0.010. The derived value comes from RotationNoiseBase/√0.05,
# and RotationNoiseBase is a PRE-GYRO constant: the pipeline has taken heading from the gyro since that
# path landed (imu_cover 0.98), and the gyro's own noise is 0.002 rad/√s — 22x quieter than the prior.
#
# WHY THIS IS THE TERM THAT MATTERS. Measured on a 4-turn pivot, the rotation variance splits as
#     random  sigma_w^2 * T   = 3.80e-4   (94%)
#     scale   (s * dtheta)^2  = 2.37e-5    (6%)
# so lowering PreintOdomScaleOmega 0.064 -> 0.02 moved the total by 2.7% and read as NULL — motion
# sigma_th 0.01569 -> 0.01649, inside run-to-run noise. The density is where 94% of it lives. Random
# and scale are equal at T = (sigma/(s*w))^2 = 3.05 s against a 0.19 s strided interval, so the random
# term dominates by ~16x; at 0.010 that crossover falls to ~0.15 s and the two become comparable.
#
# ⚠ STAGED, NOT TAKEN TO 0.002, ON PURPOSE. This term is currently the ONLY thing absorbing everything
# else that makes heading prediction wrong — odometry/lidar window misalignment, the ~1.4% gyro scale
# residual the closure tests measured, and the interval quantisation. None of those are modelled
# anywhere else, so dropping straight to the raw sensor noise would assume they are zero. 0.010 is 4.5x
# tighter and leaves headroom; go further only if nothing destabilises.
# ⚠ AND THIS IS A SIM NUMBER. A real gyro has bias drift a Webots one does not — measure it on hardware
# (SIM2REAL_CALIBRATION.md, Phase 1, applied to the gyro channel).
#
# ★★ MEASURED, three matched 4-turn pivots, ~1000-1200 rotating frames each:
#     sigma .0447 scale .064   motion sig_th 0.01569   pub sig_th 0.03647   EE 76.64%
#     sigma .0447 scale .020   motion sig_th 0.01653   pub sig_th 0.03570   EE 81.29%
#     sigma .0100 scale .020   motion sig_th 0.00460   pub sig_th 0.02867   EE 90.84%
# The motion factor tightened 3.6x, published sigma_th fell 20%, and early exit DURING ROTATION rose
# 9.5 points. sigma_xy is untouched (0.04587 -> 0.04573), so nothing coupled that should not have.
# ★ The prediction genuinely improved rather than merely claiming to: |innov_theta| — how far the SDF
# has to move the predicted HEADING — fell 0.0343 -> 0.0125 rad, and the optimizer ran on 9.2% of
# rotating frames instead of 18.7%.
# ★ sigma_th's p90 ROSE (0.0456 -> 0.0517) while its median fell. That is the adaptive covariance
# working as designed, not a regression: a stiffer prior means the frames where the SDF does disagree
# carry a larger innovation (innov_norm 0.0143 -> 0.0293), and sigma = max(laplace, EMA[innov^2]) lifts
# sigma to match. More confident when it is right, honestly less when it is not.
# ⚠ WATCH loss_motion: 3.72 -> 46.5, a 12x rise, which is just the 1/sigma^2 arithmetic of a 3.6x
# tighter prior — but it is the term that once spiked to 6000 and caused StationaryMotionThreshold to
# be raised as a stabiliser. loss_boundary 1.39 -> 5.1, still far under the 559 ratchet signature.
# recovery_bad 0 in every run; nothing destabilised.
# ⇒ STOP HERE rather than pushing toward 0.002: the motion factor is already at 0.0046 rad against a
# gyro whose measured error is ~1.4%, so the remaining headroom is small and going further mostly buys
# loss_motion while spending the margin that absorbs the window misalignment and scale residual.
PreintOdomSigmaOmega = 0.010
# PreintOdomScaleV     = 0.08     # = OdomNoiseTrans
# ★★ MEASURED 2026-08-18, and it is the ONLY Preint* value here that is no longer a translation of
# the legacy constants. The derived default is hypot(OdomNoiseRot 0.04, EncoderRotSlipK 0.05) = 0.0640
# — but both of those describe the WHEEL channel (EncoderRotSlipK is named for encoder slip), and the
# pipeline has not taken heading from the wheels since the gyro path landed: imu_cover measures 0.98.
#
# TWO CLOSURE PIVOTS, four turns each, net travel 0.040 and 0.118 m, closing to within 0.049 turn
# (17 deg on 1440, so the test resolves to ~1.2%):
#     gyro/truth 1.0114 and 1.0172  ->  the gyro is ~1.4% high, i.e. accurate to within ~2%
#     wheel/truth 1.2302 (with +0.06 injected) and 1.1450 (clean)
# So the prior was ~4.5x looser than the channel it actually describes. 0.02 sits above the measured
# 1.4% AND above the test's own 1.2% resolution, so it stays conservative while tightening 3.2x.
#
# WHY IT MATTERS BEYOND THE MOTION FACTOR: an over-loose rotation prior leaves the factor
# under-confident in heading, which inflates sigma_theta — and since the RT covariance packing fix
# (69cb5e3) sigma_theta actually REACHES the controller, where adv_scale <- rot_scale^(0.5*turning)
# charges forward speed for heading uncertainty. A loose prior here costs tour time.
#
# ⚠ UNRUN. A/B on the same tour route: watch sigma_th (pose_theta_std_rad in the controller's
# profile.csv), unc_adv_scale, and tour duration. Revert by commenting this line out — the derivation
# in room_config.cpp then takes over again.
PreintOdomScaleOmega = 0.02
# PreintCmdSigmaVLat   = 0.2236   # = CmdNoiseBase 0.05 / √0.05
# PreintCmdSigmaVLong  = 0.2236
# PreintCmdSigmaOmega  = 0.0447
# PreintCmdScaleV      = 0.20     # = CmdNoiseTrans
# PreintCmdScaleOmega  = 0.18     # = CmdNoiseRot

# ── ZUPT: the rest hypothesis as a factor (see the NoiseModel block in se2_preintegration.h) ──
# ★★MEASURED DEFECT it cures, 2026-08-18 (log_2026-08-18_11-57-49.csv, 12 261 rows, 24% moving):
#       MOVING  preint_T  0.16 s med   motion sigma  3 cm
#       STILL   preint_T 95.6 s med (p95 294 s)   motion sigma 82 cm
#   The stride gate only resets the accumulator when a slot is ADMITTED, so a parked robot chains the
#   interval for minutes and the free-drift densities grow it as sqrt(T) until the prior is vacuous.
#   It was not corrupting the pose — published sigma_x was 61.6 mm parked vs 58.3 mm moving, and
#   corr(preint_T, published sigma) was NEGATIVE (-0.291) — it was silently withdrawing a constraint.
#   Note the legacy (non-preintegrated) path had a stationary clamp at room_concept.cpp:4307; turning
#   preintegration on bypassed it and put nothing in its place.
# ★NOT A CLAMP AND NOT A THRESHOLD. "The body is at rest" is an observation with its own precision:
#   R = sigma_rest^2 + (observed motion)^2, so at rest it bites and in motion it fades out on its own.
#   The crossover is not tuned — it falls where the two variances meet, |v| ~ sigma_v/sqrt(dt).
#   gn_selftest pins all four properties (bounded parked, fades out, a pivot is not rest, continuous
#   under grid refinement).
PreintZupt           = true
# ★★MEASURED 2026-08-18, not guessed. Take every row whose COMMAND is exactly zero — 83 791 of
# them across two runs — and the spread of the RAW reported velocity IS this sigma, by definition:
#     odom_adv_raw   mean +0.000018   std 0.020200 m/s
#     odom_rot_raw   mean -0.000106   std 0.032326 rad/s
# The first values here were 0.002 / 0.005, guessed from "encoder quantisation" — 10.1x and 6.5x too
# TIGHT, i.e. 100x and 42x over-confident in variance.
# ★★RETRACTION, same day. This block first claimed the tight sigma was doing visible harm: "published
# parked sigma got WORSE, 62 -> 92 mm". That was FALSE — it was read off a log still being written, at
# 311 s. The same run at 680 s reads 41.8 mm, BETTER than the 62.2 mm baseline. The 92 mm was a
# transient. loss_motion/loss_obs 0.30 -> 7.19 was likewise measured across runs of 4165 s / 97% parked
# against 680 s / 63% parked, which are not comparable and cannot support a causal claim either.
# ★What justifies these values is ONLY that they are measured and the previous ones were guessed. There
# is at present NO evidence that the guess was harmful, and no controlled A/B has been run. Do not cite
# this block as evidence that the tight sigma hurt anything.
# ★Decide stillness from the COMMAND, never from the measurement — using the measurement to select
# "parked" rows and then measuring their spread selects for small noise and biases sigma low.
PreintZuptSigmaV     = 0.0202   # m/s   — measured residual linear velocity, commanded-zero rows
PreintZuptSigmaOmega = 0.0323   # rad/s — measured residual yaw rate, commanded-zero rows
# Lever arm coupling the two channels so a PIVOT cannot claim to be at rest: v_lat = v_long = 0 while
# spinning, and the wheels are scrubbing. Shadow's wheel anchors are +-0.259 m (ShadowDiff.proto).
PreintZuptLeverM     = 0.26

# ── Kinematic clamp on the published pose ─────────────────────────────────────
# Bounds the pose delta between two published RT blocks to what the robot can physically do in the
# elapsed time. Measured on this agent's own debug log: 92.8% of frames coast on the odometry
# prediction, then the optimizer discharges the whole accumulated drift in ONE frame — |innovation|
# p99 96.7 mm / max 280.2 mm, i.e. an implied 2.2 m/s at p99 and 7.2 m/s peak against a 0.70 m/s robot
# (13.6% of those frames break the linear limit, 13.1% the angular). The controller independently
# measured the same events as 6.9% of its updates, moving its steering carrot up to 1.79 m in a cycle.
# NOT a tuning threshold — it is the support of the motion model. The correction is legitimate, so it
# is rate-limited rather than rejected, and the un-applied residual is added to the published
# covariance so the lag is visible instead of hidden.
# ★ Limits are the CONTROLLER's (MaxAdvSpeed 0.7 / MaxRotSpeed 0.8), NOT this agent's MaxLinAccel block
#   further down, which claims 0.9 / 0.75. Neither config is a superset of the other; keep these
#   tracking controller/etc/config.toml.
PoseClampEnabled       = true 
PoseClampVMax          = 0.7    # m/s
PoseClampWMax          = 0.8    # rad/s
PoseClampMaxDt         = 0.5    # s; longer gap => skip the clamp (stream restart / long silence)

# ── 180° symmetry-flip guard (harden against spurious flips) ───────────────────
# The optimizer periodically tests whether rotating the robot 180° fits the room
# better. Evidence accumulates leakily and must cross a confidence-scaled threshold
# before the pose is actually flipped. Raising the base threshold makes a flip
# require MORE sustained contrary evidence → harder to flip on a momentary
# tight-turn degeneracy. (Header default 0.02; doubled here.)
SymmetryFlipEvidenceThresh = 0.04
# SDF mse below which a frame counts as a "good fit" and builds the flip-inertia streak (which grows
# the flip threshold). Header default 0.02 was UNREACHABLE here — this room fits chronically at ~0.32 m
# mean SDF (mse ≈ 0.10), so the streak stayed 0 and a minutes-stable pose had ZERO flip protection and
# flipped on a transient 0.184 evidence spike. Raised to 0.12 (> chronic mse) so a STABLE pose builds
# the streak → the threshold climbs toward ~0.44 → transient near-symmetric flips are rejected.
SymmetryGoodFitMse = 0.101  # (x0.845 on 2026-08-13: sdf_mse became a MEDIAN abs residual, was a MEAN on the early-exit path; was 0.12)
# Companion knobs (header defaults shown) — raise the first two / lower the leak to
# harden further:
#   SymmetryFlipMinImprovement = 0.005  # per-check loss advantage to count as evidence
#   SymmetryEvidenceLeak       = 0.6    # per-check retention (<1 → blips decay; lower = harder)
#   SymmetryConfidenceGain     = 0.05   # extra threshold per established frame
# One row per symmetry check (loss/evidence/threshold/streak + which candidate would win),
# written to tmp/sdf_localizer/symmetry_check_<ts>.csv — use this to catch a flip in the act.
SymmetryDebugCsv = true

# ── Selección de optimizador ──────────────────────────────────────────────────
# "ADAM"  — Adam adaptativo (default probado, robusto lejos del mínimo)
# "LBFGS" — L-BFGS con line search Wolfe (convergencia más rápida, ~8-12 evals)
# "GN"    — Levenberg-Marquardt on ANALYTIC Jacobians (room_gn_solver.h)
# "CAVI"  — reservado para implementación futura
#
# 2026-08-10: GN now DRIVES the pose, after 4 shadow runs (~300 optimized frames):
# objective identity 5.3e-06; Jacobian validated (grad_relerr_basin median 5.8e-4, and its tail does
# NOT land on the frames where the poses disagree); quality better on 41 / tied 51 / worse on 10, and
# of the 18 frames differing by more than 2 mm GN is CLOSER to the minimum on 14. Cost: ms_gn 8.87
# with instrumentation still running (1.3-4.1 ms offline) against 66.8 ms for L-BFGS.
#
# WARNING: setting "GN" switches shadow mode OFF by itself (gn_shadow and optimizer_type != "GN"), so
# etc/gn_shadow.csv stops growing and keeps the PREVIOUS run's data. Going back to "LBFGS" re-arms it
# with nothing else to change -- that is the way back if something goes wrong.
#
# WARNING: one path shadow mode could not test -- compute_posterior_covariance runs AFTER the
# optimizer, and until now always on L-BFGS's poses. Watch cov_tt in the debug log (baseline: median
# 5.8e-4, sigma_theta ~1.4 deg; 1.75 deg on rotating early-exit frames).
OptimizerType          = "GN"

# ── Gauss-Newton / Levenberg-Marquardt backend (room_gn_solver.h) ─────────────
# Same objective as compute_rfe_loss, solved as a 15x15 normal-equation system with ANALYTIC
# Jacobians (Model::sdf_query_at_pose already returns the SDF gradient) instead of ~29 autograd
# forward+backward passes. Measured on the autograd backend: t_update median 72.7 ms.
#
# Two independent levels:
#   OptimizerType = "GN"  -> GN drives the pose (authority).
#   GnShadow = true       -> GN runs BESIDE the authoritative backend, from the SAME starting state,
#                            and only WRITES the CSV. The live pose is untouched: a numerical
#                            comparison on identical inputs, not a behavioural A/B. Automatically
#                            inert while OptimizerType is "GN" (there is nothing to compare against).
#
# Acceptance criteria that were used before setting OptimizerType = "GN" (read etc/gn_shadow.csv):
#   - grad_relerr_basin < 1e-2   (needs GnGradCheck = true: analytic Jacobian matches the numeric one.
#                                 Sampled 5 mm / 2 mrad OFF the converged pose, which is the only band
#                                 where a RELATIVE check means anything -- at the optimum the true
#                                 gradient is ~0 so both terms are float noise, and far out the polygon
#                                 SDF is piecewise and the finite difference is not a fair reference.)
#   - |dx|,|dy| ~ mm and |dth| ~ 5e-4 rad     (same solution as Adam/L-BFGS)
#   - torch_obj_at_gn <= torch_obj_at_auth    (GN's answer is no worse ON TORCH'S OBJECTIVE; compare
#                                              against torch_obj_at_auth, NOT loss_auth -- the latter
#                                              is reported before the authority's final step)
#   - ms_gn << ms_auth                        (the whole reason this exists)
GnShadow      = true
# OFF since run 4: the Jacobian is validated (grad_relerr_basin median 5.8e-4, p90 6.2e-3, and its tail
# does NOT land on the frames where the poses disagree -- correlation with max_dxy is +0.013). Leaving it
# on costs 2x30 extra loss evaluations per optimized frame, which both inflate ms_gn and lengthen the
# frame itself, delaying the next one. Turn it back on only if the Jacobians are touched.
GnGradCheck   = false
GnShadowCsv   = "etc/gn_shadow.csv"
GnMaxIters    = 20     # raised from 10: a rejected step costs ~0.3 ms against 63-97 ms of autograd
GnLambdaInit  = 1e-3   # Levenberg damping, relative to diag(H)
GnStepTol     = 1e-5   # ||delta||_inf (m / rad) convergence test
GnLossRelTol  = 1e-5   # relative improvement counting as stalled; TWO in a row are needed to stop
                       # (one slow step is not convergence: Levenberg damping drops after every
                       #  accepted step, so the next one usually advances much further)

# ── Parámetros L-BFGS ─────────────────────────────────────────────────────────
# Activos solo cuando OptimizerType = "LBFGS"
# LbfgsLr: paso inicial; el line search strong-Wolfe lo ajusta automáticamente.
# Usar 1.0 (paso Newton completo). No requiere escalar como Adam.
LbfgsLr               = 1.0    # Paso inicial (el line search lo ajusta)
LbfgsHistorySize      = 10     # Pares (s,y) para H^-1; igualado a W=10 (30 DOF)
LbfgsToleranceGrad    = 1e-4   # Para cuando ||grad||_inf < tol (convergencia fina)
LbfgsToleranceChange  = 1e-7   # Para cuando |Δloss| < tol entre pasos

# ── Optimizador Adam ──────────────────────────────────────────────────────────
NumIterations          = 25    # Iteraciones Adam (o pasos Newton máx para LBFGS).
                                # Con W=1 solo hay término SDF; Adam converge en ~15-20 iters.
LearningRatePos        = 0.05  # LR base; escalado a lr/√W internamente
ObsSigma               = 0.05  # σ ruido SDF en la función de pérdida (m)
HuberDelta             = 0.15  # Umbral Huber para saturar outliers (m)
ConvergenceRelTol      = 0.001 # FIX 2: de 0.01 a 0.001. El criterio anterior
                                # paraba en escalones intermedios de la cola
                                # larga del motion factor (loss ~15-20 cuando
                                # el mínimo real era ~10). Con 0.001 sólo para
                                # en el plateau verdadero.
ConvergenceMinIters    = 5     # Iters mínimas antes de aplicar el criterio

# ── Ventana deslizante (RFE) ──────────────────────────────────────────────────
WindowSize             = 5  # Slots retenidos. Objetivo del experimento.
MaxLidarPoints         = 400   # Puntos slot actual (anterior 400). Más densidad
                                # → gradiente SDF más estable con W grande.
MaxLidarOldSlot        = 200   # Puntos slots antiguos (anterior 100). Mejora el
                                # condicionamiento de los motion factors.
BoundaryQualityGate    = true  # Suprime prior de frontera si frame anterior fue
                                # malo: w = min(1, σ²/sdf_mse_prev). ON para
                                # observar su efecto a W=10.

# ── Boundary prior quality gates (Soluciones B y C) ─────────────────────────
# Evitan que el prior de frontera sea "envenenado" por scans contaminados
# (desplazamiento forzado, obstáculo persistente).
# B: si sdf_mse_final del slot > HessianQualityThreshold → Hessiana solo cinemática.
# C: si sdf_mse_final del slot > MuQualityThreshold → mu no se actualiza.
BoundaryHessianQualityThreshold = 0.051  # m — umbral para incluir H_obs en Hessiana (LEGACY path)  # (x0.845 on 2026-08-13: sdf_mse became a MEDIAN abs residual, was a MEAN on the early-exit path; was 0.06)
BoundaryMuQualityThreshold      = 0.084  # m — umbral para actualizar mu del prior (LEGACY path)  # (x0.845 on 2026-08-13: sdf_mse became a MEDIAN abs residual, was a MEAN on the early-exit path; was 0.10)
EigenvalueClampBoundaryMax      = 500.0  # techo autovalores precisión (evita over-confidence)
# FEJ + Schur marginalization boundary prior (replaces the legacy rough prior + its hard quality
# gates above). ON = exact Schur complement of the dropped slot folded into a First-Estimates-
# Jacobian-frozen prior on the survivor (no re-linearization → no loss_boundary poisoning ratchet).
# Default OFF for A/B against the legacy path. See room-fast-rotation-track-lag memory (2026-07-15).
# PyTorch intra-op CPU threads for the window solve. Was hard-coded 5 (= the 4-core budget). The
# solve is tiny (3 DOF × ~5 slots × ~400 pts) so parallelism mostly buys dispatch overhead. Lower
# to shed cores; watch t_adam_ms in optimizer_timing.csv. Try 1 vs 2.
TorchNumThreads       = 1
BoundaryFejSchur      = true   # VALIDATION 07-15: ON to test FEJ+Schur vs the loss_boundary ratchet (rot_boost restored to 0.5). Set false for legacy A/B.
BoundaryQualitySigma  = 0.10   # m — σ_q for the continuous obs-quality weight w=1/(1+(sdf/σ_q)²)

# ── Recovery ──────────────────────────────────────────────────────────────────
# UNITS CHANGED 2026-07-29. sdf_mse is MEDIAN |SDF| IN METRES (it is not a mean and not squared);
# the recovery trigger used to sqrt() it, i.e. the square root of a length. This threshold is now
# compared to it DIRECTLY, in metres. 0.45-under-sqrt == 0.2025 m, so 0.20 here reproduces exactly
# the behaviour that 0.45 gave before -- this is NOT a retune.
# DO NOT 'restore' 0.45, and do not read the old note below as an argument against 0.20: the 0.2
# that once fired on normal turns was 0.2 in the old sqrt units, i.e. 0.04 m -- 5x tighter than this.
RecoveryLossThreshold    = 0.20  # median|sdf| > this (m) => bad frame. Also DERIVES the grid-search
                                 # success bar (GridSearchGoodFactor x this), so a search that claims
                                 # success cannot leave a pose recovery instantly calls lost again.
GridSearchGoodFactor     = 0.5   # search must halve the 'lost' error before reporting success
RecoveryConsecutiveCount = 10    # Frames malos consecutivos para recovery.
                                  # Anterior 3 reseteaba la ventana cada ~30 f.
RecoveryCooldownFrames   = 60    # Frames sin detection tras recovery (default 30).
                                  # 60 garantiza que W llega a 10 antes de que
                                  # el detector vuelva a estar activo.

# ── Pesos de gradiente adaptativos por velocidad ──────────────────────────────
VelocityAdaptiveWeights  = false # OFF con LBFGS: escalar grad post-backward corrompe
                                 # los pares (s,y) de la aproximación H^-1 → el log
                                 # mostraba grad_norm residual ~0.09 (≫ tol=1e-5) y
                                 # 0/53 frames con convergencia real.
LinearVelocityThreshold  = 0.05  # m/s — por debajo = no traslación
AngularVelocityThreshold = 0.10  # rad/s — por debajo = no rotación
WeightBoostFactor        = 2.0   # Multiplicador para el eje dominante
WeightReductionFactor    = 0.5   # Multiplicador para ejes secundarios
WeightSmoothingAlpha     = 0.3   # EMA de transición entre perfiles

# ── Modelo de ruido de movimiento ────────────────────────────────────────────
OdomNoiseScale  = 1.0   # Sin inflado artificial (anterior 1.5 distorsionaba
                         # el balance boundary/obs/motion en la pérdida RFE)
CmdNoiseTrans   = 0.20  # Fracción de ruido translacional del comando (m/m)
CmdNoiseRot     = 0.18  # Fracción de ruido rotacional del comando (rad/rad). Raised from 0.10 on
                        # 08-09 and KEPT ON MEASURED OUTCOME, not on the calibration story that first
                        # justified it — that story was wrong, see below. Matched in-place populations,
                        # n=798 vs 833 frames: early exit above 0.4 rad/s 91.6% → 95.6%, frames over
                        # the early-exit gate 3.6% → 0.5%, w_enc 0.552 → 0.647, cov_tt 9.8e-4 → 8.8e-4,
                        # zero recovery episodes. rotation_std = rotation_noise_base +
                        # CmdNoiseRot*|dtheta| already had the right functional form; this shifts
                        # fusion weight toward the encoder, which is the better per-frame predictor.
                        #
                        # ⚠ 0.18 is NOT the command channel's measured error. The first version of this
                        # comment claimed the command delivers 0.822 of the real rotation (a 0.178
                        # error); that came from integrating the velocity columns as Σ ω(row)*wall-gap,
                        # which mangles the COMMAND because it is a sparse stepwise signal sampled at
                        # frame times. Integrated properly — use the localizer's own meas_dth/cmd_dth
                        # columns, which clip segments and use midpoint theta — 15 in-place turns give
                        # cmd/post 0.967 ±0.014, meas/post 1.072 ±0.011, cmd/meas 0.902. Per-frame
                        # 0.908 and summed 0.902 agree and a lag scan is best at zero shift with a 40x
                        # smaller residual, so the command/encoder gap is a clean in-phase SCALE of
                        # ~10%, not 34% and not lag. 0.18 therefore over-weights the encoder relative
                        # to what the scale alone supports, and part of the benefit may be
                        # compensating the ~7% meas/post residual below. Re-derive it if that is fixed.
CmdNoiseBase    = 0.05  # Ruido base translacional del comando (m)
OdomNoiseTrans  = 0.08  # Fracción de ruido translacional de odometría
OdomNoiseRot    = 0.04  # Fracción de ruido rotacional de odometría
OdomNoiseBase   = 0.01  # Ruido base translacional de odometría (m)
EncoderRotSlipK = 0.05  # RESTORED 08-09 (the 07-16 A/B below said "restore after test" and never was).
                        # At 0.25 this made meas_cov_tt = (0.25|ω|)² = 1.5e-2 at ω=0.5 rad/s against a
                        # cmd_cov_tt of 1.5e-4 — 95x — so the command/measured fusion put weight 0.011
                        # on the ENCODER and the motion prior was effectively the command alone
                        # so the motion prior was effectively the command alone (sel_dth/cmd_dth =
                        # 1.002). Signature: sign(innov_th) == sign(ω) on 100% of rotation frames —
                        # the SDF had to push heading further into the turn on EVERY frame, against a
                        # confident (σ=0.012 rad) prior that was short. That fight is the elevated
                        # loss_init while turning, and it is what the fix removed: early exit above
                        # 0.4 rad/s went 79.3% → 91.5%, and the sign test 100% → 95%.
                        # ⚠ Earlier versions of this comment quoted "the command is 25% short,
                        # odometry 1.068" from ratios that were measurement artefacts — see the
                        # CmdNoiseRot note above for the corrected figures (cmd/post 0.967,
                        # meas/post 1.072). The units bug and every measured OUTCOME stand; only the
                        # channel-vs-truth magnitudes were wrong.
StationaryMotionThreshold = 0.02  # FIX 1: de 0.001 a 0.02 m. Cuando el robot
                                   # está parado, position_std = este valor y
                                   # cov(0,0) = (0.02)² = 4e-4 m². El valor
                                   # anterior (0.001 m = 1mm) causaba spikes de
                                   # loss_motion hasta 6000: con residuo 3.4cm
                                   # y cov=1e-6 → loss = 0.5×(0.034)²/1e-6 = 578.
                                   # Con 0.02 m el mismo residuo da loss = 1.4.

# ── Online motion model learning ──────────────────────────────────────────────
# Continuously adapt three odometry noise parameters from post-optimisation
# residuals of the RFE window.  All updates are gated on localization quality
# (SDF MSE < BoundaryHessianQualityThreshold).
#
#   LearnMotionModel      — master switch (false = all static params used)
#   MotionLearnAlpha      — EMA rate for slip-k and translational noise fraction
#   MotionLearnBeta       — EMA rate for odometry bias vector (slower)
#   MotionLearnMinOmega   — min |ω| (rad/s) for slip-k sample to be used
#   MotionLearnMinFrames  — warmup: static params used until this many quality
#                           frames have been accumulated (default 50 ≈ 10 s @ 5 Hz)
LearnMotionModel            = false   # A/B'd 08-09 and REJECTED — do not turn this on again without
                                      # first fixing what update_motion_model() measures.
                                      # It learns slip_k ≈ 0.81 (clamped at 1.0 on 5% of frames), i.e.
                                      # σ_meas = 0.039 rad against a true increment of 0.036 rad: it
                                      # declares the encoder's per-update rotation uninformative. The
                                      # measured-prior weight then collapses to 0.04 during fast turns,
                                      # the prior falls back onto the ~18%-short command channel, and
                                      # everything the units fix bought is undone — early exit while
                                      # rotating 91.6% → 68.5%, over-gate frames 3.6% → 26.7%.
                                      # ★ 0.814 × dt(42 ms) = 0.034, the same value as the old static
                                      # 0.05/0.25 in the PRE-fix units: the learner normalises by the
                                      # same quantity build_motion_covariance multiplies by, so the loop
                                      # closes in either convention and the units fix is a NO-OP here.
                                      # The defect is the residual it learns from — r[2] is a
                                      # post-optimisation window-pair residual carrying the optimiser's
                                      # own correction and the marginalisation, so attributing all of it
                                      # to odometry double-counts. Corroboration: every learned
                                      # parameter came out implausibly large in the same direction
                                      # (ml_odom_noise_trans 0.538 vs static 0.08; ml_bias_theta
                                      # 3.66e-02 rad = 2.1°). Decisive: a covariance that makes
                                      # predictions WORSE when you trust it is mis-estimated.
                                      # It is also the only one of three runs that LOST THE TRACK — 7
                                      # recovery episodes in 6.2 min, against 0 in a static-k run that
                                      # drove twice as much rotation above 1.4 rad/s.
MotionLearnAlpha            = 0.05    # slip-k and trans-noise EMA rate
MotionLearnBeta             = 0.02    # bias EMA rate
MotionLearnMinOmega         = 0.05    # rad/s — min angular speed per slot to update slip-k
MotionLearnMinTrans         = 0.02    # m  — min *accumulated* translation over the full window
MotionLearnMinFrames        = 50      # warmup frames
MotionLearnQualityThreshold = 0.12    # Per-slot SDF MSE gate for motion learning.
                                      # Independent from BoundaryHessianQualityThreshold;
                                      # set higher so learning is not starved of data
                                      # (typical sdf_mse while moving is 0.06-0.09).

# ── Feature flags ─────────────────────────────────────────────────────────────
DifferentialTest     = false  # Sin overhead A/B: experimento limpio
SdfCurrentSlotOnly   = true   # SDF obs solo en el slot actual; slots antiguos aportan
                              # solo via motion factors + corners. ~67% menos SDF evals.
EnableCornerTracking = true  # Activa factores de esquinas en la perdida RFE
# ── Graded-covariance corner factor (replaces hard rej_angle/rej_orient gates) ──
# Corners now break the room's 180° (rot180) ambiguity via the ASYMMETRIC notch on the left wall.
# Each detection carries a 2×2 information matrix Λ_det whose precision shrinks smoothly with wall-fit
# scatter + orientation deviation, and goes rank-1 for a shallow (aperture-ambiguous) corner. The loss
# uses it anisotropically → marginal corners contribute weakly, clean asymmetric corners strongly.
# CornerWallBand: perpendicular gather band (m) around the PREDICTED wall line. MUST exceed the chronic
#   model misfit (~0.32 m here) or the real wall points fall outside → NO detection forms (the actual
#   reason corners fired in only 46/77559 frames). Was hardcoded 0.12; raised to 0.35.
CornerWallBand       = 0.35
# Landmark admissibility, in units of the detector's map_sigma (0.06 m). A vertex whose shorter
# adjacent wall is below this is not a feature the traced SVG can assert (it cannot tell a 6 cm
# step from a straight wall), and its neighbour sits closer than the sensor can resolve, so the
# pair can only alias. Such vertices never become point landmarks; they REMAIN in the polygon and
# in the SDF, so no geometry is lost. 0 disables. apartamento: 3 -> drops v8,v9,v15,v16,v21,v22,
# v27,v28 (walls 0.062-0.149 m) and keeps all 24 real corners (>=0.315 m). Identical for 3..5.
CornerMinWallMapSigmas = 3.0
# Per-model-corner attribution -> etc/corner_stats.csv (rewritten every 200 corner frames).
CornerStatsCsv         = true
# Landmark RETIREMENT by observed information. A corner is retired when its running lambda_min
# (smallest eigenvalue of the Lambda_det the loss consumes, already scaled by the association
# posterior) stays below 1/(k*map_sigma)^2 -- i.e. it cannot pin its own position along its
# weakest axis to better than k*map_sigma, so it says less than the polygon already does.
# Scored ONLY on frames where it produced a match: silence costs nothing, misinformation does.
# Leaky, so a retired corner keeps being detected and recovers by itself. 0 disables.
# Live (apartamento, 23400 frames): k=5 -> lambda_bar=11.1, inside the observed gap (worst kept
# 45.2, best retired 1.60). Retires v11, v13, v27 -- the aliasing/degenerate pillar corners.
CornerMinYieldMapSigmas = 5.0
CornerYieldLeak         = 0.02   # per matched frame (~2.5 s at 20 Hz)
CornerYieldWarmup       = 10     # MATCHED frames tolerated before retiring. An evidence budget in
CornerYieldReleaseFactor = 2.0   # hysteresis: retire below lambda_bar, release only above this
                                 # multiple of it. These corners are strongly viewpoint-dependent
                                 # (v27's yield went 0.09 -> 185 as the robot reached a view where
                                 # the pillar face is observable), so bar crossings are frequent and
                                 # real; without a band a corner toggles every few frames and the
                                 # pose sees a landmark set changing under it. 1.0 = no hysteresis.
                                 # "uninformative votes", NOT a delay: a corner can only mislead the
                                 # loss on a frame it matched. Keep small -- at 100 the worst aliaser
                                 # (v11, matching 0.86% of frames) needed ~10 min to retire.
CornerBaseSigma      = 0.04   # detection noise floor σ0 (m) per wall
CornerOrientTauDeg   = 20.0   # smooth orientation-trust scale (deg): ori_scale = exp(−(dev/τ)²)
CornerPrecisionGain  = 1.0    # global scale on corner precision vs the SDF term
CornerHuberSigma     = 3.0    # Huber saturation in WHITENED (σ) units
# Corner-consistency gate on the prediction early-exit. The SDF early-exit is BLIND to a 180° flip (a
# rot180 pose fits the walls nearly as well), so without this a flip slips through while the corners —
# the one signal that disagrees — are bypassed. When true, a predicted pose whose worst corner whitened
# residual m=√(rᵀΛ_det r) exceeds CornerEarlyExitSigma is rejected → Adam runs → corners pull it back.
# OFF by default (A/B): the ANCHOR early-exit gate destabilized before, but corners are re-detected each
# frame + graded, so a bad detection can't force a bad correction. Flip true + watch flips/early-exit rate.
CornerEarlyExitCheck = true
CornerEarlyExitSigma = 4.0    # per-corner whitened-residual (σ) disagreement tolerance
# CONSENSUS gate: a lone mismatched corner (a flaky notch detection / one misassociation) must NOT force
# a full optimization when the other corners corroborate the prediction. Force Adam only when at least
# this many corners disagree. A true rot180 flip trips ALL corners so it's still caught; a single outlier
# is outvoted. (Was worst-case max → 1 bad corner pinned early-exit at 0%; see corners_1.png.)
CornerEarlyExitMinBad = 2
# Watch the new [corners] stdout line: fewpoints(FORMATION) should DROP sharply with the wider band;
# accepted should rise. If fewpoints still dominates, raise CornerWallBand further.
FarPointsWeight      = true   # Ponderación por distancia: puntos lejanos más peso
FarPointsExponent    = 2.0   # α — exponente de la distancia.
                              #   α=1: lineal (original). α=2: cuadrático (recomendado).
                              #   Fórmula: w_i = dist_i^α / mean(dist^α), re-norm tras floor.
                              #   Mayor α → gradiente dominado por puntos en paredes lejanas,
                              #   mejor precisión angular pero más sensible a puntos espurios.
FarPointsMinWeight   = 0.1   # Floor de peso (evita anular puntos muy cercanos).
UseCuda              = false   # CPU is FASTER here: windowed LBFGS (3-30 DOF, few-hundred pts) is
                               # launch/sync-overhead-bound on GPU — measured 2.4× slower early-exit,
                               # full-opt 82/397ms vs CPU 68/112ms. GPU path is crash-free now (host
                               # memcpy→device bug fixed) but not worth it. Flip true only to re-measure.
DebugLog             = true   # CSV → tmp/sdf_localizer/log.csv (ON to observe loss_object live)

# ── Rerun (desactivado para timing limpio) ────────────────────────────────────
RerunEnabled      = false     # OFF: elimina ~3 ms/frame de overhead de red
RerunHost         = "127.0.0.1"
RerunPort         = 9877
RerunSdfEveryN    = 20
RerunSdfResolution = 150
RerunMaxQueue     = 30

# ── Room stabilisation → DSR graph upload gate (room_scene_graph.cpp) ──
# A frame is "stable" when iters==0 (early-exit) AND sdf_mse<StableSdfMseMax AND cov_tt<StableCovTtMax;
# after StableFramesRequired consecutive stable frames the room node is created and the robot reparented.
# ── HIERARCHICAL PRECISION ON THE BOUNDARY PRIOR (A/B, HIERARCHICAL_PRECISION.md) ──
# The legacy gate is a hard map: w = min(1, sigma_sdf^2 / sdf_mse_prev). A bad fit RELEASES the
# boundary prior so ADAM can escape a bad pose — deliberate recovery behaviour, and measured on
# 2026-08-05 to work: corrections of 50-150 mm improve the fit 68% of the time, up from 57% at 5-20 mm.
# ★THE TAIL IS WHERE IT MISFIRES: of the 29 corrections above 150 mm, only 34% improve the fit, and
# they start from an sdf_mse of 0.183 against a normal 0.09. Those are the events that move every model
# obstacle in the controller's ESDF by >150 mm for a cycle — the far-field noise that made the route
# tracker's clearance bound collapse. Small population, disproportionate damage.
# This replaces the hard gate with a log-precision hyperprior that has to be PULLED away from full
# trust and relaxes back, so a single bad frame cannot release the prior outright.
# ★A/B: baseline traces saved as etc/*.baseline-legacy-gate.csv. Compare the >150 mm population —
# count, and the fraction that improve the fit — not the median, which the legacy gate already handles.
HierPrecBoundaryEnabled = true

[DSR]
# This apartment fits chronically at ~0.079 mean|SDF| on early-exit frames (5th–95th pct 0.075–0.083),
# so the 0.06 header default was UNREACHABLE on the very (iters==0) frames the gate requires → the room
# never uploaded (0/2213 frames stable, longest streak 0). Raised above the 95th pct with margin.
StableSdfMseMax = 0.076  # (x0.845 on 2026-08-13: sdf_mse became a MEDIAN abs residual, was a MEAN on the early-exit path; was 0.09)
# StableCovTtMax (0.001) and StableFramesRequired (30) left at header defaults — both already pass 100%.

# ── Object anchors (validated modelled objects as SE(2) pose landmarks in the RFE loss) ──
[ObjectAnchor]
# 2026-08-10: back ON, but for the REFRIGERATOR only. It was turned off by an A/B checking whether the
# flips/delocalizations persisted without the anchor -- anchorSD=85 at good poses implicated a wrong PIN
# as the destabilizer, and that pin was a TABLE's. So this re-opens the landmark path without re-opening
# the suspect: a fridge is position-only (no mode-ambiguous yaw to pin wrong), large, and static.
# If flips return, the first thing to check is whether they track the fridge's pin.
enable   = true
subtypes = ["refrigerator"]   # classes admitted as landmarks; add "table" back only deliberately

# ── p_o as a PRIVATE VARIABLE instead of a pin (GATED OFF) ────────────────────────────────────
# The pin freezes p_o at whatever pose was believed when the object's map sigma first went under
# validateSigma. That breaks the circularity (a p_o re-derived from the robot pose each frame agrees
# with the robot by construction and carries zero information) but it does so by turning "no
# information" into "infinitely confident information, possibly wrong, forever" -- which is what the
# 07-13 delocalizations were traced to.
#
# With this on, room instead carries its OWN estimate of the object's position as a 2-DOF variable of
# the same optimisation as the robot poses and the corners. Born from the producing agent's belief
# (mean + Sigma_o as the prior) and refined by room's observations alone.
#
#   - The prior is spent on the BIRTH frame only. Sigma_o was itself derived through the robot pose,
#     so re-applying it every frame would keep feeding the same evidence back and shrink both agents'
#     covariance without new information entering -- the data incest that makes two estimators
#     confidently agree on the wrong thing.
#   - Room NEVER writes it back. The producer stays the sole authority for the published pose, so the
#     gap between the two is a diagnostic (white ring vs magenta ring on the 2D canvas) instead of a
#     silent merge.
#   - No line-of-sight gate: a grazing, distant or stale view already arrives with a huge sigma_along
#     from ray_anisotropic_cov plus the freshness inflation, so it moves the landmark barely. "Good
#     conditions" is a continuous weight here, not a switch.
#   - Observability: robot and landmark slide together as a pair under robot-only observations. What
#     pins the gauge is the SDF against the walls plus the corners; where those constrain the robot the
#     landmark is determined, and where they do not both inflate -- which is the honest answer.
#
# Requires OptimizerType = "GN" (the autograd backends have no landmark variables); the loader refuses
# it loudly otherwise rather than leaving a flag that reads true while nothing optimises.
optimizeLandmark = false
weight   = 1.0     # global scale (keep < walls: objects refine, never outvote geometry)
huber    = 3.0     # robust cutoff in whitened σ units
maxSlots = 3       # apply object factors to the newest N window slots
measSigmaXY = 0.30 # raised 0.05→0.30 to match MEASURED fresh-observation accuracy (07-13 table_landmark
                   # CSV: even age==0 obs reconstruct ~0.32 m mean / 0.67 m p90 off the believed table pose —
                   # a mask-centroid / partial-view bias). 0.05 was 6× overconfident → the anchor would
                   # over-pull on a biased fresh reading. (Freshness handles STALENESS; this handles the
                   # per-obs ACCURACY gap — independent. Revisit down once the centroid bias is fixed.)
earlyExitSigma = 2.0  # prediction early-exit gate: whitened anchor-residual σ above which the optimizer is
                      # forced to run — low so a flip (huge residual) reliably triggers a correction.
validateSigma  = 0.10 # map-pose σ (m) below which room PINS the table's world pose (fixed landmark) —
                      # breaks the circularity so the anchor carries real information
# Freshness as precision: obj_obs_robot PERSISTS in the graph between actual sightings (the producer only
# rewrites it when a mask is assigned; table_detection_alive stays true ~40 frames). A stale in-front obs
# paired with the moved robot pose is a PHANTOM landmark (confirmed 07-13 via table_landmark CSV: 18% of
# frames had the table geometrically BEHIND yet observed in front). Grow R_o with the producer's own age
# counter (table_frames_since_detection): R_o ← R_o·(1+age/ageScale)² ⇒ a stale obs lands with Λ≈0 and
# pulls nothing; a fresh (age 0) one keeps full weight. No threshold — smooth precision decay.
freshnessEnable   = true
freshnessAgeScale = 3.0  # frames of staleness at which σ roughly doubles (variance ×4)

# ── Epistemic Controller ───────────────────────────────────────────────────────
[EpistemicController]
# ---- Arc trajectory generation ----
NumArcCurvatures   = 9      # discrete curvatures sampled (odd ⇒ includes κ=0)

# ---- Policy rollout & EFE ----
HorizonSteps       = 20     # rollout length in steps
Dt                 = 0.2    # step duration (s); rollout horizon = HorizonSteps × Dt
MaxAdvSpeed        = 0.9    # m/s
MaxRotSpeed        = 0.75   # rad/s
WEpistemic         = 0.1    # EFE weight: information gain
WPragmatic         = 3.0    # EFE weight: goal proximity
WHeading           = 2.0    # EFE weight: heading alignment
WBoundary          = 10.0   # EFE weight: room boundary avoidance
PublishAffordance  = true    # publish the room exploration affordance. Set false so the room never offers an
                             # affordance and can't out-compete object affordances in the controller's EFE

# ---- Approach speed ----
KRot               = 3.5    # proportional gain for heading correction
GaussianSigma      = 0.5    # goal proximity Gaussian σ (m)
SpeedHorizonS      = 0.4    # max time-to-target (s) for approach speed ramp
                            # decoupled from rollout horizon; lower = more decisive

# ---- Obstacle avoidance ----
ObstacleRadius     = 0.35   # robot clearance radius (m)
ObstacleK          = 0.5    # obstacle repulsion gain
ObstacleStepCap    = 10.0   # max repulsion step size
WObstacle          = 2.0    # EFE weight: obstacle penalty
WallFilterMargin   = 0.30   # lidar points within this margin of wall are ignored (m)

# ---- Perceptual bandwidth speed limit ----
BandwidthCoupling  = 0.3    # reduces max adv speed when rotating: eff_v = max_v × (1 - k×|ω|/ω_max)

# ---- Reactive speed governor ----
SdfSafe            = 0.051  # median|SDF| below this → full speed  # (x0.845 on 2026-08-13: sdf_mse became a MEDIAN abs residual, was a MEAN on the early-exit path; was 0.06)
SdfDanger          = 0.084  # median|SDF| at/above this → minimum speed  # (x0.845 on 2026-08-13: sdf_mse became a MEDIAN abs residual, was a MEAN on the early-exit path; was 0.10)
GovernorAlphaMin   = 0.4    # minimum speed fraction when localization is poor

# ---- FIM scoring ----
FimCornerSigma     = 0.04   # corner detection noise σ (m)
FimMaxRange        = 10.0   # max corner visibility range (m)

# ---- Target selector (EpistemicPlanner) ----
GridResolution     = 0.5    # spacing between candidate targets (m)
MinDistance        = 1.0    # ignore targets closer than this to robot (m)
MaxCandidates      = 2000   # cap on evaluated candidates
TargetWallMargin   = 0.55   # reject targets closer than this to walls (m). Must be >= the CONSUMER's
                            # near-goal clearance, else the executor will not stop at what we offer:
                            #   max(body_extent + GoalObstacleMargin, ComfortStandoff * GoalClearanceMinRatio)
                            #   = max(0.32 + 0.08, 0.6 * 0.85) = 0.51 m with the live controller config.
                            # Effective value is max(this, robot_footprint_radius = 0.32).
                            # Was 1.0, which admits NO candidate in a corridor narrower than 2 m and so
                            # deleted the apartment's ~1.68 m upper arm outright. 0.55 keeps the arm
                            # (needs < 0.84) while still clearing the controller's bar.
TargetObstacleClearance = 0.55  # same clearance, from object/obstacle footprints. Was the bare robot
                            # footprint radius (0.32 m) — 0.19 m under the controller's requirement, so
                            # room routinely proposed targets the controller refused to settle at.
AngularDominanceRatio = 50.0 # σ²_θ / max(σ²_x, σ²_y) threshold to trigger rotate-in-place
WTravelCost        = 0.5    # NATS per unit (distance / room_diagonal), SUBTRACTED from the score.
                            # Travel distance is a COST in expected free energy, not a reward — the
                            # controller already scores affordances as (gain - lambda*dist) and this
                            # is the same quantity applied to the planner's own choice of cell.
                            # Replaces WExploration, which had the opposite sign. That mattered: the
                            # neglect field is FLAT across large regions (every never-visited cell
                            # reports the same ~9 nats), so this term alone decides the arg-max there
                            # — and far-is-better makes it the most DISTANT cell, whose own most
                            # distant cell is the one you just left. Measured on the apartment
                            # contour: bonus => mean leg 6.2 m, 13/40 legs over 60% of the diagonal,
                            # 26 distinct cells; cost => 2.9 m, 0/40, 36 distinct cells.
IorCellSize        = 0.5    # inhibition-of-return grid resolution (m)
IorDecayTime       = 120.0  # τ: knowledge-decay time constant. Sets BOTH the staleness suppressor
                            # and the scale of the neglect drive log(1 + age/τ).
WIor               = 2.0    # exponent of the route-staleness suppressor on the pose-info term
WPathInterest      = 0.7    # blend weight: 0=target cell only, 1=path cells only (suppressor + neglect)
WIorDrive          = 0.5    # NATS per unit neglect information log(1 + age/τ). This is the
                            # non-saturating exploration drive: strictly monotone and unbounded in
                            # neglect age, so a least-recently-visited cell always exists and the
                            # robot keeps sweeping. Replaces the old PatrolEnabled / PatrolGainFloor
                            # / InfoExhaustedGain switch, which is gone — the pose-info term is now
                            # MARGINAL (value of moving over staying put) and extinguishes itself,
                            # so the hand-off to inhibition-of-return happens continuously.
ArrivalDistance    = 0.15   # target reached threshold (m)
DwellTime          = 2.0    # seconds to pause after reaching target
# ---- Execution-stall watchdog (liveness on the affordance handshake, not a model threshold) ----
# The planner idles while the controller holds the execution claim, so a target the controller can
# never reach would park the run. If the closest approach fails to improve by ExecStallProgress for
# ExecStallTimeout seconds, the claim is released and the target is stamped visited. 0 ⇒ disabled.
ExecStallTimeout   = 25.0   # seconds without approach progress before abandoning the target
ExecStallProgress  = 0.10   # metres of new closest-approach that counts as progress

# ---- Acceleration ramp (SpecificWorker) ---- MOVE THIS TO ROBOT
MaxLinAccel        = 1.2    # m/s² max translational acceleration
MaxRotAccel        = 2.0    # rad/s² max angular acceleration

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
