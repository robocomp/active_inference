# room_concept for the P3Bot WAF scenario (webots-p3bot/worlds/WAF.wbt).
# Derived from config.toml; the ONLY change is RoomLayoutSvg. Nothing else here is robot-specific:
# the lidar plane is "helios" by default and the robot frame is auto-derived from the node of type
# "robot", so the same file serves any robot whose room this describes.
[Proxies]
# This property is used by the clients to connect to IceStorm.
TopicManager = "IceStorm/TopicManager:default -p 9999"
# Proxies for required interfaces
Lidar3D = "lidar3d:tcp -h localhost -p 11995" # FILTER"
Webots2Robocomp = "webots2robocomp:tcp -h localhost -p 10006"
OmniRobot = "omnirobot:tcp -h localhost -p 10004"

[Endpoints]
# Endpoints for subscriptions interfaces
FullPoseEstimationPubTopic = "tcp -p 0"
FullPoseEstimationPubPrefix = ""
JoystickAdapterTopic = "tcp -p 0"
JoystickAdapterPrefix = ""

[Period]
# compute() is <1 ms and the localizer optimizer is <1 ms, so the pose pipeline is period-bound,
# not compute-bound. At 50 ms the lidar-stamp→RT-publish lag was ~90-110 ms = TWO ~50 ms quantizations
# (a fresh scan waits up to one tick to be pumped+localized; the result waits up to one more tick to be
# fetched+published). The lidar source is ~20 Hz (50 ms); oversampling at 16 ms (~60 Hz) collapses both
# waits to <16 ms each → lag ~30-40 ms. Publish stays gated to fresh corrections (≈lidar rate), so no
# extra graph churn. Negligible CPU (compute duty ~6%).
Compute = 16
Emergency = 500

# --- Common Agent Data ---
[Agent]
id = 5 # Change id
name = "room_concept"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree = false
graph = false   # DSR graph viewer optional: the layout GUI is its own top-level window (RoomViewer)
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

# ── [Presence] ────────────────────────────────────────────────────────────────
# required_agent_names   = ["a","b"]  # Must be Ready before on_required_ready fires (blocks Operating state)
# optional_agent_names   = ["a","b"]  # Tracked; fires on_optional_agent_ready/lost but never blocks
# required_agent_ids     = [1,2]      # Same as required_agent_names but by numeric DSR agent ID
# optional_agent_ids     = [1,2]      # Same as optional_agent_names but by ID
# node_requires          = ["body"]   # DSR node names that must exist in graph (checked every tick)
# monitor_period_ms      = 500        # Timer period for scan + timeout checks (ms)
# heartbeat_timeout_ms   = 3000       # Silence after which a peer is downgraded to Stale (ms)
# rejoin_grace_ms        = 1500       # Grace window after detected restart before peer is Ready again (ms)
# agent_info_period_ms   = 1000       # How often this agent publishes its own heartbeat (ms)
# config_dir             = "etc"      # Dir searched for {peer}.toml to clean up crashed peer's owned nodes
#
# ── [Owns] ────────────────────────────────────────────────────────────────────
# nodes    = ["node_a","prefix_*"]    # DSR nodes deleted on clean shutdown; * is a prefix wildcard
# subtrees = ["root_node"]            # Root nodes whose entire RT-edge subtree is deleted on shutdown
# Note: other agents with config_dir set will also read this file on peer crash to clean up these nodes.
# ──────────────────────────────────────────────────────────────────────────────

[Presence]
required_agent_names   = ["robot_concept"]
optional_agent_names   = ["controller", "bottle_concept"]
config_dir             = "etc"
monitor_period_ms      = 500
heartbeat_timeout_ms   = 15000  # wider window: room_concept runs at >100% CPU, DSR signals queue up
rejoin_grace_ms        = 5000
stale_grace_ms         = 120000  # 2 min grace: covers robot_concept restart time
agent_info_period_ms   = 1000

[Owns]
# static-room phase (PreserveBootstrapRoom=true): room_concept does NOT own the room — it is a
# pre-seeded static prior. Keep "room" OUT of subtrees so neither a clean shutdown NOR a peer
# reading this file on our crash deletes it; afford_room isn't created in static mode either.
# When going DYNAMIC, restore: nodes=["room_concept 5","afford_room"], subtrees=["room"].
nodes    = ["room_concept 5"]  # our own agent presence node (cleaned on shutdown / peer-crash)
#subtrees = []                  # was ["room"]; room is a static prior, not owned, in static-room mode

# NOTE: the zero-copy media plane (RGB + LiDAR consumers) needs NO domain/topic
# config. They are read from the media descriptor JSON the producer (robot_concept)
# writes on the "zed"/"helios" nodes, so the consumer always uses the producer's
# dedicated media domain (isolated from Agent.domain = 0). Subscribers are created
# lazily, only once those nodes + descriptors exist.
#
# LiDAR source: LidarIngestor prefers the per-device high plane published by lidar3d_dds
# on the "helios" node (points in the DEVICE frame, metres), transforming them to the robot
# base via the DSR RT tree (body->helios). robot_concept publishes onto that same node while it
# bridges from Ice, so there is one name either way. Override the node/destination-frame names if needed:
# [Media]
# lidar_helios_name = "helios"
# lidar_robot_frame = "body"

[RoomConcept]

# ---- The calibration pivot (afford_calib) ----
# The robot turns 120 degrees on the spot, twelve times: four complete turns back to the heading it
# started from. That closure is the measurement — it turned exactly 8*pi radians as a FACT about
# turning, so comparing the odometry's own accumulation against it needs no map, no survey and no
# localiser. Offered as ordinary Orient affordances, one step at a time; it never drives anywhere, and
# if the controller says the body cannot sweep its diagonal where the robot stands it is believed and
# the offer waits until the day's work has carried the robot somewhere with room.
# ★ON as of 2026-08-23 — FIRST RUN THAT CAN DRIVE THE ROBOT. Until now this affordance had never
# commanded anything. Two things changed that make the test meaningful and also make it more likely
# to actually fire than the numbers below suggest:
#   · the offer now prices the posterior that STEERS (room_concept's joint BatchEstimator), not the
#     passive ScaleEstimator that feeds nothing back. k_omega's sigma there is ~0.75%, far wider than
#     the 0.00039 quoted below, so the advertised gain is correspondingly larger.
#   · the manoeuvre is 4 turns in 120-degree steps at the consumer's ~0.06 rad/s, i.e. of order
#     minutes of robot time. It is Orient-only and never navigates, but it does occupy the robot.
# WATCH FOR: an Orient that reports Completed on cycle one having turned NOTHING. That exact defect
# existed here (evaluate_goal({}) returns true for a predicate-less Orient) and was fixed, but has
# never been exercised with a live pivot. If steps complete instantly and the accumulated degrees do
# not move, stop and say so -- a producer sequencing off those completions would book a whole 4-turn
# pivot in half a second and report a perfect closure.
# ★The PASSIVE half ran regardless of this flag and still does. The PASSIVE half — watching how well the rotation
# scale is known, from the turning the robot does anyway — runs regardless and commands nothing; look
# for the "[calib] rotation scale ..." line, once a minute.
# ★NOT A THRESHOLD WHEN ON: the offer carries its expected information gain in nats and competes in
# the controller's EFE selection like any exploration cell. It extinguishes itself as the posterior
# sharpens. Measured cold 3.46 nats, after 400 s of ordinary turning 0.01, after 400 s of straight-line
# driving 3.70. On 2026-08-20 this robot's rotation scale measured +0.00007 +/- 0.00039, so expect it
# to lose almost every contest — which is the correct outcome, not a broken feature.
CalibPivotEnabled      = true 

# ★TESTING SCAFFOLD, NOT A TUNING KNOB. >0 replaces the advertised gain with this constant so
# afford_calib wins the EFE contest on demand. It exists because the four-turn closure has never once
# run end to end: priced honestly this robot's pivot is worth fractions of a nat, it loses to every
# exploration cell, and everything downstream of selection -- the claim, the Orient contract, the
# per-step turn measurement, the closure -- has therefore never been exercised. Forcing the price
# forces only the CONTEST; the manoeuvre itself runs exactly as it would in earnest.
# The true valuation is still computed and printed beside the forced one on the "[calib] ★TESTING"
# line. Nothing measured while this is set may be quoted as a valuation. Back to 0.0 when the pivot
# closes on its own merit.
CalibForcedGainNats    = 0.0    # Back to honest pricing 2026-08-26. The pivot now competes at its
                       # true valuation, which on this robot is fractions of a nat, so expect it to
                       # lose essentially every contest and effectively never fire. That is the
                       # correct outcome and not a regression — but it does mean the four-turn
                       # closure goes back to never being exercised end to end, which is what the
                       # forcing existed to work around. Set it back above 0 to test that path.

RoomLayoutSvg          = "p3bot_layout.svg"  # 8x6 room of webots-p3bot/worlds/WAF.wbt, with the
                       # 0.7x0.7 corner column that breaks the rectangle's 180-degree symmetry.
                       # The contour and the WAF.wbt walls must stay identical; room frame = (-x_svg, y_svg).
# Put the room-frame origin on the layout's geometric (bbox) centre instead of wherever the SVG
# author placed (0,0). Matters for plans traced from a corner (apartamento); layouts already
# drawn about their middle barely move. Flipping this SHIFTS the room frame: delete
# etc/last_robot_pose.txt and restart the fleet on a clean graph.
RecenterRoomPolygon    = true
PreserveBootstrapRoom  = false  # DYNAMIC for P3Bot: localize and CREATE the room node.
                       # true is the static-room phase, which adopts a room pre-seeded in the bootstrap
                       # graph. p3bot.json has NO room node to adopt, so true meant nothing ever created
                       # one: maybe_publish_corrected_pose() returns on its first line when this is set,
                       # which is the only path that reaches RoomSceneGraph::update() and therefore the
                       # only place stable_frames_ is incremented. Symptom was a hard "STABILIZING 0/30"
                       # that never moved, while the localiser itself was converging perfectly
                       # (etc/optimizer_timing.csv: sdf_mse p50 0.028 vs a 0.06 limit, 100% of frames
                       # stable after t+120 s). A counter pinned at exactly 0 is not a threshold that is
                       # too tight; it is a code path that never runs.
# ── Preintegrated motion covariance ───────────────────────────────────────────
# The motion prior's covariance is PROPAGATED through the interval's samples instead of asserted
# from per-frame constants. The MEAN is unchanged (same midpoint-theta integration), so this is a
# covariance-only change and both optimizer backends pick it up with no factor edit.
#
# WHY, for the sawtooth: the prediction accumulates error fastest in a pivot because a heading error
# ROTATES all subsequent translation. That coupling is real and the legacy covariance has no term
# for it, so the motion prior stays over-confident exactly while turning — and an over-confident
# prior is what lets error build before the SDF is allowed to pull it back. Propagation gives the
# covariance its theta<->xy and x<->y cross terms, and puts dt where the physics puts it, so the
# constants stop being update-rate dependent. This is the precision-shaped answer to the sawtooth,
# as opposed to widening or narrowing a threshold.
#
# Measured side by side at the live constants (sigma in m and rad, legacy / propagated):
#   parked, 50 ms            sigma_xy 0.0200 / 0.0200   sigma_th 0.0100 / 0.0100   <- IDENTICAL
#   pivot 1.0 rad/s, 50 ms            0.0214 / 0.0200            0.0123 / 0.0105
# i.e. it changes nothing at rest and only bites under rotation, which is the intent.
#
# The densities are DERIVED in room_config.cpp from the legacy constants just above, not hard-coded,
# so this A/B tests the covariance's SHAPE and not a simultaneous re-tuning.
# ⚠ Recorded blocker: a PARKED sigma floor can swamp the cross terms, so the benefit may be masked.
# If it shows nothing, that floor is the thing to look at, not this flag.
MotionPreintegration   = true

PredictionEarlyExit    = true  # Skip optimization when prediction error < threshold.
                       # ⚠ DO NOT SET false: room stabilisation is DEFINED in terms of early exit.
                       # room_scene_graph.cpp:185 requires (res.iterations_used == 0) for a frame to
                       # count as stable, i.e. "the optimiser did not need to run". With early exit
                       # off the optimiser runs every frame, iterations_used is never 0, and the room
                       # NEVER stabilises — measured 2026-08-22. The sawtooth in the prediction trace
                       # is the price of that coupling: the stability test and the correction policy
                       # are the same switch. Decoupling them means changing that gate to test the
                       # RESIDUAL rather than whether the optimiser ran.
SigmaSdf               = 0.15  # σ_obs del SDF para el umbral de early exit (m)
PredictionTrustFactor  = 0.40  # threshold = SigmaSdf × factor → 6.0 cm (the red "opt threshold" line
                       # in the UI timeseries is exactly this product). Was 0.7 → 10.5 cm.
                       # Lowered 2026-08-22 and CONFIRMED IN USE: noticeably less lag when the robot
                       # rotates. Affordable because OptimizerType = "GN" made a correction 6x cheaper
                       # (7.80 ms mean vs 47.2 on LBFGS; whole loop 0.69 ms of a 50 ms period).
                       # ⚠ Do not judge this knob by the AGGREGATE early-exit rate: it barely moved
                       # (97.9% -> 98.7%) because turns are a small share of all frames. The extra
                       # corrections land where they matter, and the aggregate hides them.
MinTrackingSteps       = 5     # Warm-up tras reset: 5 frames (default 20).
                                # Con 20 se perdían 20 frames de Adam obligatorio
                                # tras cada recovery antes de que early exit
                                # pudiera actuar. Con 5 se alcanza steady-state
                                # en cuanto la ventana está llena.
RotationSdfCoupling    = 0.2   # Extra SDF tolerance per radian of rotation (m/rad). Was 0.5; the
                       # instance running on 2026-08-22 had 0.3, so this is a further step.
                       # This term WIDENS the early-exit threshold in proportion to turn rate
                       # (room_concept.cpp:3088): threshold = sigma_sdf*trust + coupling*|dtheta|.
                       # It exists for a real geometric reason — a yaw error e at range R displaces
                       # the SDF by ~R*e, so 0.02 rad at 5 m is already ~10 cm — but it is also the
                       # term that makes the optimiser fire LEAST while turning, which is where the
                       # lag is felt. Lowering it makes the threshold be reached EARLIER in a turn.
                       # At 1 rad/s and 20 Hz (dtheta 0.05 rad) against the 6.0 cm base:
                       #     0.5 -> +2.5 cm (8.5 cm, +42%)   0.3 -> +1.5 cm (7.5 cm, +25%)
                       #     0.2 -> +1.0 cm (7.0 cm, +17%)   0.0 -> no widening at all
                       # ⚠ Do NOT zero it: measured on Shadow, that doubled the stall rate during
                       # motion (0.91 -> 1.8 per second). 0.2 keeps a margin against that.

# ── 180° symmetry-flip guard (harden against spurious flips) ───────────────────
# The optimizer periodically tests whether rotating the robot 180° fits the room
# better. Evidence accumulates leakily and must cross a confidence-scaled threshold
# before the pose is actually flipped. Raising the base threshold makes a flip
# require MORE sustained contrary evidence → harder to flip on a momentary
# tight-turn degeneracy. (Header default 0.02; doubled here.)
SymmetryFlipEvidenceThresh = 0.04
# Companion knobs (header defaults shown) — raise the first two / lower the leak to
# harden further:
#   SymmetryFlipMinImprovement = 0.005  # per-check loss advantage to count as evidence
#   SymmetryEvidenceLeak       = 0.6    # per-check retention (<1 → blips decay; lower = harder)
#   SymmetryConfidenceGain     = 0.05   # extra threshold per established frame
# One row per symmetry check (loss/evidence/threshold/streak + which candidate would win),
# written to tmp/sdf_localizer/symmetry_check_<ts>.csv — use this to catch a flip in the act.
SymmetryDebugCsv = true

# ── Selección de optimizador ──────────────────────────────────────────────────
# "ADAM"  — Adam adaptativo (default probado, robusto lejos del mínimo)
# "LBFGS" — L-BFGS con line search Wolfe (convergencia más rápida, ~8-12 evals)
# "CAVI"  — reservado para implementación futura
OptimizerType          = "GN"
# GN is VALIDATED — including pivots (2026-08-22). Measured on this rig: 7.80 ms mean / 21.32 ms max
# per correction against LBFGS's 47.2 / 84.9, i.e. 6x cheaper, whole loop 0.69 ms mean of a 50 ms
# period. The old "UNTESTED: pivot" caveat is retired.

# ── Gauss-Newton / Levenberg-Marquardt backend (room_gn_solver.h) ─────────────
# Same objective as compute_rfe_loss, solved as a 15x15 normal-equation system with ANALYTIC
# Jacobians (Model::sdf_query_at_pose already returns the SDF gradient) instead of ~29 autograd
# forward+backward passes. Measured on the autograd backend: t_update median 72.7 ms.
#
# BOTH OFF by default, at two independent levels:
#   OptimizerType = "GN"  -> GN drives the pose (authority).
#   GnShadow = true       -> GN runs BESIDE the authoritative backend, from the SAME starting state,
#                            and only WRITES the CSV. The live pose is untouched: a numerical
#                            comparison on identical inputs, not a behavioural A/B. Automatically
#                            inert while OptimizerType is "GN" (nothing left to compare against).
#
# Acceptance criteria before setting OptimizerType = "GN" (read etc/gn_shadow.csv):
#   - grad_relerr_basin < 1e-2   (needs GnGradCheck = true: analytic Jacobian matches the numeric one.
#                                 Sampled 5 mm / 2 mrad OFF the converged pose, the only band where a
#                                 RELATIVE check means anything -- at the optimum the true gradient is
#                                 ~0 so both terms are float noise, and far out the polygon SDF is
#                                 piecewise and the finite difference is not a fair reference.)
#   - |dx|,|dy| ~ mm and |dth| ~ 5e-4 rad     (same solution as Adam/L-BFGS)
#   - torch_obj_at_gn <= torch_obj_at_auth    (GN's answer is no worse ON TORCH'S OBJECTIVE; compare
#                                              against torch_obj_at_auth, NOT loss_auth -- the latter
#                                              is reported before the authority's final step)
#   - ms_gn << ms_auth                        (the whole reason this exists)
# GnGradCheck costs 2x30 extra loss evaluations per optimized frame: on to validate, off to measure
# time (it inflates ms_gn AND lengthens the frame, delaying the next one).
# The CSV only grows on OPTIMIZED frames (~0.7% of all, 4.7% while moving) -- a parked robot writes
# nothing, the run needs teleop.
# GnShadow      = false
# GnGradCheck   = false
# GnShadowCsv   = "etc/gn_shadow.csv"
# GnMaxIters    = 20     # a rejected step costs ~0.3 ms against the 63-97 ms of the autograd backend
# GnLambdaInit  = 1e-3   # Levenberg damping, relative to diag(H)
# GnStepTol     = 1e-5   # ||delta||_inf (m / rad) convergence test
# GnLossRelTol  = 1e-5   # relative improvement counting as stalled; TWO in a row are needed to stop
#                        # (one slow step is not convergence: Levenberg damping drops after every
#                        #  accepted step, so the next one usually advances much further)
# ── Parámetros L-BFGS ─────────────────────────────────────────────────────────
# Activos solo cuando OptimizerType = "LBFGS"
# LbfgsLr: paso inicial; el line search strong-Wolfe lo ajusta automáticamente.
# Usar 1.0 (paso Newton completo). No requiere escalar como Adam.
LbfgsLr               = 1.0    # Paso inicial (el line search lo ajusta)
LbfgsHistorySize      = 10     # Pares (s,y) para H^-1; igualado a W=10 (30 DOF)
LbfgsToleranceGrad    = 1e-4   # Para cuando ||grad||_inf < tol (convergencia fina)
LbfgsToleranceChange  = 1e-7   # Para cuando |Δloss| < tol entre pasos

# ── Optimizador Adam ──────────────────────────────────────────────────────────
NumIterations          = 25    # Iteraciones Adam (o pasos Newton máx para LBFGS).
                                # Con W=1 solo hay término SDF; Adam converge en ~15-20 iters.
LearningRatePos        = 0.05  # LR base; escalado a lr/√W internamente
ObsSigma               = 0.05  # σ ruido SDF en la función de pérdida (m)
HuberDelta             = 0.15  # Umbral Huber para saturar outliers (m)
ConvergenceRelTol      = 0.001 # FIX 2: de 0.01 a 0.001. El criterio anterior
                                # paraba en escalones intermedios de la cola
                                # larga del motion factor (loss ~15-20 cuando
                                # el mínimo real era ~10). Con 0.001 sólo para
                                # en el plateau verdadero.
ConvergenceMinIters    = 5     # Iters mínimas antes de aplicar el criterio

# ── Ventana deslizante (RFE) ──────────────────────────────────────────────────
WindowSize             = 5  # Slots retenidos. Objetivo del experimento.
MaxLidarPoints         = 400   # Puntos slot actual (anterior 400). Más densidad
                                # → gradiente SDF más estable con W grande.
MaxLidarOldSlot        = 200   # Puntos slots antiguos (anterior 100). Mejora el
                                # condicionamiento de los motion factors.
BoundaryQualityGate    = true  # Suprime prior de frontera si frame anterior fue
                                # malo: w = min(1, σ²/sdf_mse_prev). ON para
                                # observar su efecto a W=10.

# ── Boundary prior quality gates (Soluciones B y C) ─────────────────────────
# Evitan que el prior de frontera sea "envenenado" por scans contaminados
# (desplazamiento forzado, obstáculo persistente).
# B: si sdf_mse_final del slot > HessianQualityThreshold → Hessiana solo cinemática.
# C: si sdf_mse_final del slot > MuQualityThreshold → mu no se actualiza.
BoundaryHessianQualityThreshold = 0.06   # m — umbral para incluir H_obs en Hessiana
BoundaryMuQualityThreshold      = 0.10   # m — umbral para actualizar mu del prior
EigenvalueClampBoundaryMax      = 500.0  # techo autovalores precisión (evita over-confidence)

# ── Precisión jerárquica del prior de frontera (HIERARCHICAL_PRECISION.md) ──────
# Sustituye BoundaryQualityGate por una precisión INFERIDA π=exp(u_b): hiperprior
# Gamma/log-precisión sobre el residuo r_b del propio factor de frontera, con un
# estado lento interno v (map_trust, Opción A) que la predice top-down g(v)=u0+k·v.
# OFF por defecto ⇒ comportamiento idéntico al gate actual. NO activar en vivo sin avisar.
# HierPrecBoundaryEnabled = false
# HierPrecU0              = 0.0    # media prior de log-precisión (exp(0)=1 → prior completo)
# HierPrecSigmaU2         = 1.0    # cuánto puede desviar r_b a u de g(v)
# HierPrecLrU             = 0.1    # paso del update de π (rápido, por frame)
# HierPrecGGain           = 1.0    # k en g(v)=u0+k·v (mapa top-down)
# HierPrecLrV             = 0.02   # paso del estado lento v (map_trust)
# HierPrecSigmaV2         = 1.0    # escala prior del estado v

# ── Relocalización FE-nativa por colapso de map-trust (HIERARCHICAL_PRECISION.md) ──
# Cuando exp(u_b) cae bajo el suelo varios frames → misma grid search jerárquica que
# RecoveryManager (que se mantiene como backstop de sdf crudo). OFF por defecto.
# NO activar en vivo sin avisar ([[ask-before-changing-running-params]]).
# HierPrecRelocEnabled         = false
# HierPrecRelocFloor           = 0.10  # exp(u_b) bajo esto = colapso de confianza en el mapa
# HierPrecRelocConsecutive     = 3     # frames bajo el suelo antes de disparar (debounce)
# HierPrecRelocCooldownFrames  = 30    # frames suprimidos tras un disparo
# HierPrecEeDthetaMin          = 0.15  # rad (|Δθ|) que habilita el nudge en early-exit (giro)

# ── Recovery ──────────────────────────────────────────────────────────────────
RecoveryLossThreshold    = 0.45  # sqrt(sdf_mse) > umbral → frame malo (m).
                                  # Anterior 0.2 disparaba en giros normales.
RecoveryConsecutiveCount = 10    # Frames malos consecutivos para recovery.
                                  # Anterior 3 reseteaba la ventana cada ~30 f.
RecoveryCooldownFrames   = 60    # Frames sin detection tras recovery (default 30).
                                  # 60 garantiza que W llega a 10 antes de que
                                  # el detector vuelva a estar activo.

# ── Pesos de gradiente adaptativos por velocidad ──────────────────────────────
VelocityAdaptiveWeights  = false # OFF con LBFGS: escalar grad post-backward corrompe
                                 # los pares (s,y) de la aproximación H^-1 → el log
                                 # mostraba grad_norm residual ~0.09 (≫ tol=1e-5) y
                                 # 0/53 frames con convergencia real.
LinearVelocityThreshold  = 0.05  # m/s — por debajo = no traslación
AngularVelocityThreshold = 0.10  # rad/s — por debajo = no rotación
WeightBoostFactor        = 2.0   # Multiplicador para el eje dominante
WeightReductionFactor    = 0.5   # Multiplicador para ejes secundarios
WeightSmoothingAlpha     = 0.3   # EMA de transición entre perfiles

# ── Modelo de ruido de movimiento ────────────────────────────────────────────
UseCommandVelocityPrior = false  # A/B 2026-08-22: was true. MEASURED on 1245 deg of open-loop rotation
                        # (gt_error.csv, iters==0 runs only, so the predictor runs with no optimizer
                        # correction hiding it): the odometry prior tracks GT to +0.78%, but the
                        # PUBLISHED pose over-rotates by +2.49%. The missing +1.70% is added between
                        # the two — i.e. in fuse_priors(), by this channel. IMU coverage was 99.1%
                        # (gyro 18.87 rad vs wheels 0.170), so neither sensor can account for it.
                        # That +1.70% is what ramps the prediction error into the early-exit gate and
                        # produces the sawtooth. Verify the flag took by the published/odometry gain
                        # in gt_error.csv collapsing 1.0170 -> ~1.0000; do NOT read the cmd_* columns,
                        # which deliberately keep reporting what the channel would have said.
                        # Master switch for the COMMAND (joystick / controller) motion prior.
                        # true  = historical behaviour: fused (command + encoder) when both channels
                        #         are fresh, else measured, else command, else fallback_zero.
                        # false = the command channel is still computed and logged (cmd_* columns keep
                        #         their real values) but never enters the prediction; the selection
                        #         collapses to measured / fallback_zero. A command is a statement of
                        #         INTENT, not of motion — the wheels may not have obeyed it. Check the
                        #         flag took by reading `motion_prior_source` in ai2_log.csv, NOT the
                        #         cmd_* columns, which deliberately keep reporting what the channel
                        #         WOULD have said.
OdomNoiseScale  = 1.0   # Sin inflado artificial (anterior 1.5 distorsionaba
                         # el balance boundary/obs/motion en la pérdida RFE)
CmdNoiseTrans   = 0.20  # Fracción de ruido translacional del comando (m/m)
CmdNoiseRot     = 0.10  # Fracción de ruido rotacional del comando (rad/rad)
CmdNoiseBase    = 0.05  # Ruido base translacional del comando (m)
OdomNoiseTrans  = 0.08  # Fracción de ruido translacional de odometría
OdomNoiseRot    = 0.04  # Fracción de ruido rotacional de odometría
OdomNoiseBase   = 0.01  # Ruido base translacional de odometría (m)
EncoderRotSlipK = 0.05  # Incertidumbre extra por slip: (k·|ω|)² (rad/rad·s⁻¹)
StationaryMotionThreshold = 0.02  # FIX 1: de 0.001 a 0.02 m. Cuando el robot
                                   # está parado, position_std = este valor y
                                   # cov(0,0) = (0.02)² = 4e-4 m². El valor
                                   # anterior (0.001 m = 1mm) causaba spikes de
                                   # loss_motion hasta 6000: con residuo 3.4cm
                                   # y cov=1e-6 → loss = 0.5×(0.034)²/1e-6 = 578.
                                   # Con 0.02 m el mismo residuo da loss = 1.4.

# ── Online motion model learning ──────────────────────────────────────────────
# Continuously adapt three odometry noise parameters from post-optimisation
# residuals of the RFE window.  All updates are gated on localization quality
# (SDF MSE < BoundaryHessianQualityThreshold).
#
#   LearnMotionModel      — master switch (false = all static params used)
#   MotionLearnAlpha      — EMA rate for slip-k and translational noise fraction
#   MotionLearnBeta       — EMA rate for odometry bias vector (slower)
#   MotionLearnMinOmega   — min |ω| (rad/s) for slip-k sample to be used
#   MotionLearnMinFrames  — warmup: static params used until this many quality
#                           frames have been accumulated (default 50 ≈ 10 s @ 5 Hz)
# ── The EMA motion learner was DELETED on 2026-08-26, with its six knobs ────────────────────────
# LearnMotionModel / MotionLearnAlpha / Beta / MinOmega / MinTrans / MinFrames / QualityThreshold are
# gone from the code, so leaving them here would document an intent nothing implements.
#
# ★ IT WAS A/B'd AND REJECTED IN 2026-08 and the reason is worth keeping: it learned slip_k ~= 0.81
# (sigma_meas 0.039 rad against a true increment of 0.036), the measured prior collapsed to weight
# 0.04 during fast turns so the prior fell back on the command channel, early exit while rotating
# went 91.6% -> 68.5%, and it was the only one of four configurations that LOST THE TRACK. The defect
# was the residual it learned from — a post-optimisation window-pair residual carrying the
# optimiser's own correction — i.e. code, not a simulation artefact.
#
# ★★ AND TURNING IT OFF TURNED OFF SOMETHING ELSE. `LearnMotionModel` also gated the batch
# estimator's entire bookkeeping — closures reaching the solve, the state file, the reset — because
# all of it lived in the same function. One switch, two unrelated features, and nothing said so.
# The batch estimator (MotionCalibEnabled, below) is the learner that replaced this one; it learns
# from a different quantity and is now serviced unconditionally.


# ── Feature flags ─────────────────────────────────────────────────────────────
DifferentialTest     = false  # Sin overhead A/B: experimento limpio
SdfCurrentSlotOnly   = true   # SDF obs solo en el slot actual; slots antiguos aportan
                              # solo via motion factors + corners. ~67% menos SDF evals.
EnableCornerTracking = true  # Activa factores de esquinas en la perdida RFE
FarPointsWeight      = true   # Ponderación por distancia: puntos lejanos más peso
FarPointsExponent    = 2.0   # α — exponente de la distancia.
                              #   α=1: lineal (original). α=2: cuadrático (recomendado).
                              #   Fórmula: w_i = dist_i^α / mean(dist^α), re-norm tras floor.
                              #   Mayor α → gradiente dominado por puntos en paredes lejanas,
                              #   mejor precisión angular pero más sensible a puntos espurios.
FarPointsMinWeight   = 0.1   # Floor de peso (evita anular puntos muy cercanos).
UseCuda              = false   # Fallback automático a CPU si falla
DebugLog             = false  # Off again 2026-08-26, measurement done. It was on for one run to
                       # verify the ZUPT density change end to end, and the decisive column was
                       # sel_cov_xx on parked windows: binning by preint_n showed sigma/sqrt(T)
                       # roughly FLAT (0.0171 -> 0.0216 over n = 2..5) where the old per-sample form
                       # requires it to FALL 37%. Parked prior 3.22 mm against 1.20 mm before, at the
                       # modal 33 ms window. ⚠ A ~26% drift with n is unexplained and still open.
                       # ★ gt_error.csv cannot answer this: it carries the localiser POSTERIOR, a
                       # different quantity from the motion prior. Turn this on, don't substitute.
                       # CSV -> tmp/sdf_localizer/log_<ts>.csv. Also useful to chase a
                       # localiser question: `wg_ratio` (wheel/gyro heading ratio, an
                       # odometry-independent witness of rotation), `imu_cover`, `clamp_hit`,
                       # `innov_theta`, and pre/post-clamp `cov_tt`. Writes a row per update.

# ── Rerun (desactivado para timing limpio) ────────────────────────────────────
RerunEnabled      = false     # OFF: elimina ~3 ms/frame de overhead de red
RerunHost         = "127.0.0.1"
RerunPort         = 9877
RerunSdfEveryN    = 20
RerunSdfResolution = 150
RerunMaxQueue     = 30

# ── Epistemic Controller ───────────────────────────────────────────────────────
# ── Online motion-model learning (self-calibration) ──────────────────────────
# Slow parameters estimated from the optimizer's OWN corrections, so the robot improves while it
# drives instead of needing a calibration procedure. See src/motion_calibration.h.
#
# WHY, measured 2026-08-22 on P3Bot: between corrections the predictor over-rotates ~4% and over-runs
# forward ~1.0-1.7%, while the CORRECTED output tracks ground truth to <1%. The optimizer removes the
# same error every few seconds and never learns from it — that is the sawtooth. Precision-only
# adaptation (AdaptiveCovEnabled, HierPrec*) cannot fix it: widening the posterior lengthens the tooth
# but never moves the mean.
#
# There is no learning-rate constant here on purpose. The gain is P*H/(H*P*H+R) with R taken from the
# optimizer's posterior covariance, so an uninformative episode (parked robot: H->0) and a
# low-confidence correction both teach ~nothing without any threshold saying so.
ImuLinearInjection  = true   # Add the accelerometer's within-segment double integration to the
                        # wheel displacement. The integrator holds a 10 Hz wheel velocity flat across
                        # each segment; the true displacement is v0*dt + the double integral, and
                        # odom.adv IS v0, so this supplies the term the zero-order hold drops -- zero
                        # at constant speed, largest under acceleration. Bounded by construction:
                        # confined to one segment, never chained, so it cannot drift however wrong
                        # the accelerometer is.
                        # Measured before enabling (2026-08-23): no static tilt (6326 parked cycles
                        # at -0.0013/-0.0024 m/s^2), no speed-dependent term (0.04 deg of pitch at
                        # 0.5 m/s), integrated dv tracks GT with slope 0.8-0.95 and no bias.
                        # Expect a SMALL effect: the double integral was ~69 um per cycle.
                        # A/B on err/m and ramp steepness, NOT on opt/m (not comparable across runs).
# ── ZUPT: the rest hypothesis, MEASURED ON THIS ROBOT 2026-08-26 ────────────────────────────────
# Stated here rather than inherited from the header default so the provenance is visible in the file
# that runs. 8166 parked samples at 16.0 ms (etc/odom_samples.csv, tools/odom_whiteness.py): the
# per-sample spread was 0.1183 m/s and 0.2372 rad/s, giving these densities. The previous values were
# Shadow's 0.0202 / 0.0323 — 5.9x and 7.3x too tight for this base — which made the parked prior
# 0.81 mm per 100 ms window where the measurement says 4.67 mm.
# ★ DENSITIES, m/√s and rad/√s. The per-sample spread is provably 1/√dt (0.0683 m/s at 48 ms vs
# 0.1183 at 16 ms), so a per-sample constant cannot describe it and the old keys are refused at load.
PreintZuptDensityV     = 0.01496
PreintZuptDensityOmega = 0.03001

# ── The rest hypothesis as a FACTOR on the state, rather than covariance shaping ────────────────
# OFF. It moves the published pose, so it earns its place by measurement, not by argument.
#
# ★ WHAT IT FIXES. The per-sample form collapses the velocity VARIANCE and never touches the mean,
# because the preintegrator is a pure observer by design. So of a parked robot the estimator says
# "the increment is 3.5 mm of noise, and I am very confident" — confidently wrong rather than
# correctly still. MEASURED 2026-08-26 with ground truth motionless for 3963 cycles: the published
# pose wandered 210 mm in x, 193 mm in y and 2.07 deg. A textbook random walk — 3.49 mm per cycle,
# and 3.49*sqrt(3963) = 220 mm — and nothing arrests it, because the optimizer fired on 12 of those
# 3963 cycles and between firings the pose runs open-loop on odometry noise.
#
# ★ WHAT IT IS. Not a new mechanism: a motion factor between the same two slots with a ZERO delta
# and its own precision, so the solver weighs "you moved by Delta" against "you did not move" and
# the MEAN goes where the evidence says. Its covariance is the interval-level analogue of the
# per-sample rule:  R_trans = d_v^2*T + (|dp| + L*|dth|)^2 ,  R_rot = d_w^2*T + (|dth| + |dp|/L)^2.
# At rest the second term vanishes and it bites; in motion the hypothesis is wrong by exactly the
# displacement the interval measured, R grows with it, and it fades out on its own. No threshold.
# Self-test: rate-invariant to 0.16% across an 8x rate change, 11154x looser at 0.5 m/s than parked.
#
# ★ IT REPLACES the per-sample shaping rather than joining it — running both counts one hypothesis
# twice. The loader enforces that, so this flag alone switches the form.
#
# ★ THE A/B IS PRE-REGISTERED: park with the controller idle and measure the published pose's wander
# over a few thousand cycles against the 210 mm above. It should also remove the residual m^2*dt
# rate dependence the per-sample form still carries at speed (1.47x across a 3x rate change).
PreintZuptAsFactor   = false   # ★ TRIED AND MEASURED, 2026-08-26: it does not work, and the reason is
                       # placement, not the mechanism. The factor lives in the Gauss-Newton problem,
                       # and Gauss-Newton runs on ~1% of cycles — on the other 99% the published pose
                       # is the raw prediction and no factor is evaluated at all. Measured with it on:
                       # per-cycle step 3.54 mm against 3.49 mm before, i.e. UNCHANGED, while the
                       # optimizer rate went 0.30% -> 1.03% because switching it on disables the
                       # per-sample shaping and the prior reverts to free drift. So it cost a looser
                       # prior and 3x the solver load for no drift benefit.
                       # The mechanism itself is sound and the self-test still covers it; the cure for
                       # drift is SdfPolishOnEarlyExit below, which acts where the pose is published.
                       # ⚠ Compare NORMALISED, span/sqrt(cycles): raw spans of stretches of different
                       # length are not comparable, and 108 mm over 484 cycles is WORSE than 210 mm
                       # over 3963 (4.91 vs 3.34 mm/sqrt(cycle)), not better.
                       # (original A/B note follows) The number to beat is: 210 mm of
                       # wander in x and 193 mm in y over 3963 cycles with ground truth motionless.
                       # ★ Judge it PARKED, on the published pose, not on err/m — err/m is dominated
                       # by the cycles where the map corrects, and this term acts precisely on the
                       # ones where it does not. And check the MOVING case too: this replaces the
                       # per-sample shaping, so if it is too weak the prior loosens everywhere, and
                       # if it is too strong it will fight real motion at low speed.

# ── One damped SDF step on the cycles that skip the optimizer ───────────────────────────────────
# OFF. It moves the published pose on ~99% of cycles, so it is measured before it is believed.
#
# ★ WHY IT EXISTS. The gate's verdict is "good enough not to need a full solve", and that has been
# implemented as "do nothing" — so on the cycles it passes, the published pose is dead reckoning
# with no absolute reference at all. MEASURED with ground truth motionless for 3963 cycles: 210 mm
# of wander in x, 193 in y, 3.49 mm per cycle, optimizer firing on 12 of them. The cause is entirely
# the odometry noise: WheelSigmaV 0.015 m/sqrt(s) is 0.118 m/s per sample, ~0.068 m/s averaged over
# a cycle, 3.4 mm integrated — against 3.49 measured, and 3.49*sqrt(3963) = 220 mm against 210.
#
# ★ WHY SHRINKING THE INCREMENT IS NOT THE FIX, having tried it twice. A random walk with a smaller
# step is still a random walk: it grows without bound, just more slowly, still as sqrt(N). Only an
# ABSOLUTE reference applied every cycle turns it into a mean-reverting process. The map is that
# reference, and the gate is already evaluating it here.
#
# ★ NOTHING IS TUNED. The steepest-descent step for a scalar residual is exactly L/|g|^2 — there is
# no step size to choose — and it is then scaled to lie inside the MOTION PRIOR's own 1-sigma
# ellipsoid, delta' Lambda delta <= 1. So the correction may go anywhere the prior considers a
# plausible amount of motion for this interval and no further: it cannot overrule a confident
# prediction, and it can undo a wander the prior says could not have happened. Both bounds come from
# quantities the estimator already states.
#
# ★ THE A/B: park with the controller idle and compare the published pose's wander against the
# 210 mm above, NORMALISED as span/sqrt(cycles) since a walk's span grows with duration — the raw
# spans of two different stretches are not comparable. Watch the optimizer rate too: if the polish
# is doing its job the prediction should stay good and the rate should not rise.
#
# ★ ON 2026-08-26 as the first thing tried that attacks the CAUSE rather than the step size. If it
# works the parked wander should stop growing with sqrt(N) altogether — bounded rather than slower —
# which is the property to look for, not a smaller number at one particular duration.
SdfPolishOnEarlyExit = false   # ★ TRIED AND MEASURED 2026-08-26, and it is NOT viable at one
                       # iteration with either regulariser. The idea stands — 99% of cycles publish
                       # with no absolute reference and the pose random-walks 210 mm over 4000 parked
                       # cycles — but a single slot's SDF cannot supply the information to fix it.
                       #
                       # ★ BOTH EXTREMES WERE MEASURED. With the single-INTERVAL motion prior as the
                       # regulariser, Lambda ~ 45000 against H_sdf ~ 20: the step was crushed and the
                       # growth exponent stayed at 0.522, a pure random walk. With the POSE covariance,
                       # Lambda ~ 22 against H ~ 20: nearly a full Gauss-Newton step, which overshoots
                       # a curved residual, so the next prediction starts worse. Measured: sdf_mse
                       # 0.026 -> 0.031-0.037 with a p90 of 0.26-0.44 that was not there before, and
                       # EARLY EXIT 99% -> 60%, i.e. 40x the optimizer load for a worse fit.
                       #
                       # ★ WHY, and it is the useful part: at equilibrium P = (H_sdf + P^-1)^-1, so
                       # with one slot's SDF as the only information the pose settles at sigma ~ 21 cm.
                       # That is what ONE scan against the field is worth. The full optimizer's
                       # confidence comes from the WINDOW — many slots, motion factors between them,
                       # corners, boundary — none of which a single-slot polish has.
                       # The candidate that remains is to run the OPTIMIZER at a low fixed rate
                       # regardless of the gate, so the pose gets a proper multi-slot solve every N
                       # cycles instead of only once it has already drifted past 6 cm.

OdomSampleLog = true    # One CSV line per ARRIVING odometry sample -> etc/odom_samples.csv.
                        # An INSTRUMENT, not telemetry: turn it off when the measurement is done.
                        # It exists because the per-cycle log (tmp/sdf_localizer/log_*.csv) records
                        # only the LATEST odometry sample once per lidar sweep, which aliases a 50 Hz
                        # stream onto ~20 Hz rows. Any autocorrelation computed on those rows answers
                        # a different question than the one asked, and looks reasonable doing it.
                        # Purpose: measure the per-sample std and lag-1 autocorrelation of reported
                        # velocity on ZERO-COMMAND rows, which decides whether the ZUPT's per-sample
                        # application earns its sqrt(N) or double-counts one fact.
OdomVarianceInjection = true   # ★ AND NOW IT CARRIES INFORMATION. Written 2026-08-26 and documented
                       # then as "wired but inert, because the producer publishes one nominal
                       # constant". p3bot-bridge now makes its wheel noise SPEED-DEPENDENT —
                       # sigma(v) = hypot(floor, k_slip*|v|) — and advertises the same sigma it
                       # injected, so velCov finally varies. That is the condition this channel was
                       # explicitly waiting for: "it earns its keep when the producer reports a
                       # variance that actually varies."
                       # At rest the consumer now recovers ~0.0005 m/sqrt(s) instead of 0.015, so
                       # there is essentially nothing to integrate when the wheels report nothing.
                       # Use the WHEELS' OWN per-sample velocity variance for the motion
                        # prior, instead of only the asserted PreintOdomSigma* constants. The producer
                        # states it in FullPoseEuler::velCov; robot_concept forwards it onto the robot
                        # node as robot_current_speed_variance; here it becomes a density,
                        # sigma = sqrt(var_sample * dt_sample), with dt_sample MEASURED from the
                        # stamps -- so the bridge's [FullPose] PublishPeriod (100 -> 20 ms on
                        # 2026-08-25) can change again without editing anything.
                        # ADDS IN QUADRATURE to the constants, never replaces them: those are lumped
                        # MODEL error and this is SENSOR noise. It can therefore only ever LOOSEN the
                        # prior -- which is the honest asymmetry. It tells us when a producer says its
                        # wheels are degrading; it can never claim the model is better than we know.
                        # ON 2026-08-25, and EXPECT NO MEASURABLE EFFECT TODAY -- that is the point
                        # of turning it on now. At NominalVelVar = 1e-4 and dt_sample = 0.02 s the
                        # density is sqrt(1e-4*0.02) = 0.0014 m/sqrt(s) against the model's 0.0045:
                        # a 5% widening of the linear channels, +0.05% on yaw. The bridge publishes
                        # ONE NOMINAL CONSTANT there, not a measured variance, so the channel is wired
                        # and inert. It earns its keep when a producer reports a variance that VARIES.
                        # ★ So the thing to check first is the [OdomVar] line, NOT err/m: it says the
                        # path is live, the measured dt_sample, and the densities it is really adding.
                        # If err/m moves at all, something other than this changed -- a 5% widening of
                        # a prior that the SDF already out-argues cannot show up in an outcome metric,
                        # and reading one into it is how a null result gets a story attached.

MotionCalibEnabled  = true   # A/B CONCLUDED 2026-08-22, restored to true.
                        # Matched A/B, 262 m ON vs 105 m OFF, per-60s windows, bursts excluded:
                        #   err/m  0.0263 -> 0.0303 when OFF  (+14.9%, t=2.67 z=2.31 SIGNIFICANT)
                        #   floor  0.0179 -> 0.0220           (+23.3%, n.s. at n=6 windows)
                        #   mm/m   6.90   -> 6.49             (unchanged, as predicted)
                        # So it lowers the error FLOOR, it does not flatten the sawtooth: a ramp of
                        # the same slope simply starts lower and takes longer to reach the gate.
                        # What it found: a real body/mount yaw offset of -0.536 deg +/- 0.13,
                        # reproducible across restarts from a cold zero and independently matching
                        # straight-episode least squares (-0.532 deg). Forward scale converged to
                        # 1.00004 +/- 0.003 -- i.e. there is NO forward scale error, and the earlier
                        # -1% figure was an artifact of turns confounding the estimator.
                        # NOT responsible for the large drop in optimizer firing seen between runs
                        # (opt/m 0.34 vs 0.44 here, against 2.33 in an earlier run); that cause is
                        # still unidentified, so do not credit this feature with it.
MotionCalibYawP0    = 1.0e-4   # (rad)^2 initial uncertainty on the body/mount yaw offset (1σ ≈ 0.57°)
MotionCalibYawQ     = 1.0e-7   # (rad)^2 per episode — see the note on Q below
MotionCalibScaleP0  = 4.0e-4   # fractional² initial uncertainty on both scales (1σ ≈ 2%)
MotionCalibScaleQ   = 3.0e-7   # fractional² per episode
MotionCalibRotModelSigma = 0.030  # m/rad — position-R growth during turns; see below
MotionCalibFitModelGain  = 2.0    # x mean|SDF| — R growth when the FIT itself is poor. Protects the
                        # parameters from the pathological window where the localiser loses tracking
                        # and the optimizer fires every cycle: on 2026-08-23 two such windows made 497
                        # fragment "episodes" in 180 s and dragged k_v 1.0059 -> 0.8907 and yaw to
                        # -1.78 deg, destroying 20 min of correct estimation. Residual there ran
                        # 0.05-0.26 against a normal 0.027, so this collapses the gain, no threshold.
#
# Q IS THE RESPONSIVENESS KNOB, and it is not optional. Without it P collapses on the first episode
# that has a long baseline (K*h -> 1 consumes almost all the uncertainty) and the filter freezes
# wherever that one sample put it — classic RLS windup. Verified offline against 6 recorded episodes:
# Q=1e-9 removed 1.4% of the residual per episode (~70-episode time constant, i.e. dead), Q=3e-7
# removes ~19% (~5 episodes), Q=1e-6 removes ~30% (~3 episodes). 3e-7 is the balance: fast enough to
# be useful within one session, slow enough that a single bad correction cannot move the model.
# It is also what lets the estimate TRACK a real change (a knocked mount, tyre wear) instead of
# averaging it away with the whole history.
#
# Stability does not depend on this choice: the step is K*resid with K*h = h²P/(h²P+R) < 1 strictly,
# so every episode is a contraction and the loop cannot overshoot however large Q is.

[EpistemicController]
PublishAffordance  = true   # publish the room exploration affordance. Set false so the room never offers an
                            # affordance and can't out-compete object affordances in the controller's EFE
                            # selection (e.g. the 360-glance chair experiment).
# ---- Arc trajectory generation ----
NumArcCurvatures   = 9      # discrete curvatures sampled (odd ⇒ includes κ=0)

# ---- Policy rollout & EFE ----
HorizonSteps       = 20     # rollout length in steps
Dt                 = 0.2    # step duration (s); rollout horizon = HorizonSteps × Dt
MaxAdvSpeed        = 0.9    # m/s
MaxRotSpeed        = 0.75   # rad/s
WEpistemic         = 0.1    # EFE weight: information gain
WPragmatic         = 3.0    # EFE weight: goal proximity
WHeading           = 2.0    # EFE weight: heading alignment
WBoundary          = 10.0   # EFE weight: room boundary avoidance

# ---- Approach speed ----
KRot               = 3.5    # proportional gain for heading correction
GaussianSigma      = 0.5    # goal proximity Gaussian σ (m)
SpeedHorizonS      = 0.4    # max time-to-target (s) for approach speed ramp
                            # decoupled from rollout horizon; lower = more decisive

# ---- Obstacle avoidance ----
ObstacleRadius     = 0.35   # robot clearance radius (m)
ObstacleK          = 0.5    # obstacle repulsion gain
ObstacleStepCap    = 10.0   # max repulsion step size
WObstacle          = 2.0    # EFE weight: obstacle penalty
WallFilterMargin   = 0.30   # lidar points within this margin of wall are ignored (m)

# ---- Perceptual bandwidth speed limit ----
BandwidthCoupling  = 0.3    # reduces max adv speed when rotating: eff_v = max_v × (1 - k×|ω|/ω_max)

# ---- Reactive speed governor ----
SdfSafe            = 0.06   # SDF-MSE below this → full speed
SdfDanger          = 0.10   # SDF-MSE at/above this → minimum speed
GovernorAlphaMin   = 0.4    # minimum speed fraction when localization is poor

# ---- FIM scoring ----
FimCornerSigma     = 0.04   # corner detection noise σ (m)
FimMaxRange        = 10.0   # max corner visibility range (m)

# ---- Target selector (EpistemicPlanner) ----
GridResolution     = 0.5    # spacing between candidate targets (m)
MinDistance        = 1.0    # ignore targets closer than this to robot (m)
MaxCandidates      = 2000   # cap on evaluated candidates
TargetWallMargin   = 1.0    # reject targets closer than this to walls (m)
AngularDominanceRatio = 50.0 # σ²_θ / max(σ²_x, σ²_y) threshold to trigger rotate-in-place
WExploration       = 0.5    # weight: distance bonus (explore farther)
IorCellSize        = 0.5    # inhibition-of-return grid resolution (m)
IorDecayTime       = 120.0  # seconds until visited cell is fully stale
WIor               = 1.0    # MULTIPLICATIVE staleness suppressor exponent on fim_gain (score *=
                            # staleness^WIor). NOTE: this vanishes once fim_gain→0, so it cannot keep
                            # the robot moving after localization — that job is WIorDrive below.
WIorDrive          = 0.5    # ADDITIVE, non-saturating IoR patrol drive (nats per unit staleness).
                            # The pose-FIM term saturates in a static convex room, so without this
                            # the robot stops after a few affordances. Staleness recovers over
                            # IorDecayTime → the robot perpetually revisits the stalest reachable
                            # cell. Kept below the info-term magnitude so real info-gathering wins
                            # first; it only dominates once info is exhausted. 0 ⇒ robot rests when
                            # the room is fully known. TUNE: raise if it still stalls; lower if it
                            # patrols too eagerly before finishing localization/coverage.
WPathInterest      = 0.7    # blend weight: 0=target staleness only, 1=path staleness only (multiplicative IoR)
ArrivalDistance    = 0.15   # target reached threshold (m)
DwellTime          = 2.0    # seconds to pause after reaching target
# Belief forgetting: the pose-FIM epistemic gain self-extinguishes once localized (afford_room goes
# silent "after a while"). >0 makes the epistemic pose-prior precision decay toward its floor over this
# many seconds WHILE IDLE, so the gain recovers and the robot periodically re-verifies the room
# (breathe-in/out with period ≈ this value). Resets while actively exploring. 0 = off. Scoring-only —
# never touches the localizer covariance.
BeliefForgetTime   = 90.0   # seconds; 0 disables

# ---- Acceleration ramp (SpecificWorker) ---- MOVE THIS TO ROBOT
MaxLinAccel        = 1.2    # m/s² max translational acceleration
MaxRotAccel        = 2.0    # rad/s² max angular acceleration

[Overlay]
# DSR node types projected as oriented boxes on the camera RGB overlay (walls are always drawn).
# Comma-separated; add/remove types here to control what appears. Default covers all concept agents.
ObjectTypes = "object,table,cylinder,chair"

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

# ═══ RGB edge alignment — structural contours vs the image gradient ══════════════════════════════
# The localizer's only exteroceptive term is the LiDAR SDF. This adds a second, independent view of
# the SAME room geometry from a sensor with completely different failure modes: where the model's
# wall-wall corner lines and floor-wall junction project into the RGB image, the image should show
# an intensity edge, and the signed pixel displacement is a measurement with a real precision.
#
# ── Staging: OFF at three independent levels (mirrors how GnShadow / OptimizerType were staged) ──
#   enable = false  -> nothing is constructed: no subscriber, no thread, no extraction. ZERO cost.
#   shadow = true   -> the term is extracted, evaluated and logged, and the pose is UNTOUCHED.
#   drive  = true   -> the factor enters build_factors() and moves the published pose.
# Reversion is one word: enable = false.
#
# ★ There is deliberately NO weight key. If this term needs a hand-set scalar to behave, its
#   covariance model is wrong — the per-sample precision is DERIVED (Cramer-Rao from the measured
#   gradient profile, with the frame's own noise sigma measured per frame) and the shared-nuisance
#   cap is physical. Do not add a weight; fix the covariance.
#
# ── WHY CORNERS FIRST AND THE FLOOR JUNCTION SECOND ──
# A vertical wall-wall corner has a HORIZONTAL image normal, so it measures BEARING and the mount
# pitch/height errors barely project onto it. 1 px at fx=448 is 2.2 mrad, against ~10 mrad for a
# LiDAR corner at 3 m -- roughly 4.5x, and it is the DOF the image genuinely adds.
# The floor-wall junction measures RANGE (v = cy + fy*h/d, so d = fy*h/(v-cy)) and is far more
# informative per pixel -- at 3 m one pixel is 1.9 cm against the LiDAR's ObsSigma of 0.05 m -- but
# it is exposed to the mount: delta_d = theta_pitch * d^2 / h, i.e. 1 degree of pitch error is 14 cm
# at 3 m, and 0.1 degree is 1.4 cm. Because the image term is PRECISE, a mis-calibrated pitch does
# not merely add noise, it WINS and drags the pose. So the junction stays off until the
# systematic-residual monitor shows pitch is trusted (bias_const_px ~ 0).
[ObjectAnchor]
# ★ ON 2026-08-26 so the RGB edge term can EXPLAIN AWAY wall samples that furniture stands in front
# of. Default is false, and with it false `latest_object_anchors_` is never populated: the anchor list
# reaches the extractor EMPTY, the occlusion loop iterates over nothing, and `occluded` keeps reading
# 0 — which is indistinguishable from "nothing was in the way". A built, wired, compiled and inert
# feature is the failure mode this file keeps recording; this is the switch that avoids it.
#
# ★ WHAT IT BUYS. An object in front of a wall junction does NOT make the edge search fail — it makes
# it SUCCEED on the object's edge, returning a confidently wrong sub-pixel position with a small
# Cramer-Rao sigma. Those samples survive residual-based rejection, so they have to be explained away
# by the models that predict them. Occlusion enters as a soft visibility PRIOR (pi_vis), never a cull:
# graded by how centrally the ray passes the footprint, widened and weakened by the anchor's own
# map_pos_sigma, scaled by obj_exist_prob, and multiplicative so several partial occluders compound.
#
# ⚠ enable=true only turns on the ANCHOR GATHER. optimizeLandmark stays false: this is about
# occlusion, not about letting object poses become state variables in the room's solve.
enable = true
optimizeLandmark = false

[ImageEdge]
enable = true    # build the subscriber + ingest thread and run the extraction each tick
shadow = false   # OFF 2026-08-28 for a clean BASELINE drive. `drive` has been false throughout, so
                 # the factor was never in the published pose (room_gn_solver.cpp:613 requires
                 # enable AND drive) — but shadow runs an EXTRA GN solve to compute the with/without
                 # comparison, and that costs cycle time, which does affect pose quality. Removing it
                 # is the only change that actually alters the baseline. Turn back on to resume the
                 # mount diagnostics; the extraction and all the CSVs still run either way.
                 # WAS: ON 2026-08-26 to MEASURE THE MOUNT, not to use the factor. Solves twice and
                 # logs etc/image_edge.csv; the published pose is untouched, so this is free of
                 # risk to the run and costs one extra solve per cycle.
                 # ★ WHAT TO READ, and why this is not circular: the pose comes from LiDAR + SDF,
                 # which do not depend on camera pitch at all, so the camera's residual against
                 # that pose is a clean target-free observation of the camera's own extrinsic —
                 # the same trick the motion calibrator uses one tier down, where the optimizer's
                 # correction is the free teacher. bias_const_px is a constant row offset =>
                 # PITCH (implied_dpitch_rad = bias_const_px / fy); bias_invd_m scales as 1/d =>
                 # HEIGHT. Those two covariates are what separate them, and the code already knows
                 # it: height sensitivity h_k ~ fy/d_k varies ~3x along a single wall.
                 # ⚠ Judge it on se_const_px and on STABILITY across the run, not on one row. And
                 # ⚠ pitch trades against the FLOOR DATUM — a floor plane at the wrong height
                 # produces a similar range bias on floor junctions. useWallCorners is what breaks
                 # that: a vertical corner's image normal is horizontal, so pitch and height barely
                 # project onto it (h ~ 0) while bearing is unaffected.
                 # Set back to false once the mount is characterised; drive stays false until then.
drive  = true    # ★ ON 2026-08-28 — the FIRST time this term moves the published pose. Corners
                 # only: useTriplePoints below is true, so the evidence is one 2-D residual per
                 # floor-wall-wall corner and the per-sample contour residuals do NOT enter.
                 #
                 # ── THE BASELINE THIS IS BEING COMPARED AGAINST (same config, drive = false) ──
                 # Measured against the Webots supervisor, "driving" defined on GT speed > 0.05 m/s
                 # so a localiser glitch cannot reclassify its own bad samples out of the set:
                 #     position   DRIVING  median 27.1 mm  p90 57.4  p99 134.6  max 173.4
                 #                parked   median  6.7 mm
                 #     heading    DRIVING  median 0.239 deg  p90 2.31  p99 4.11  max 6.11
                 #                parked   median 0.046 deg  p90 0.066
                 #
                 # ★ THE PRE-REGISTERED QUESTION IS THE DRIVING TAIL, NOT THE MEDIAN. Parked, the
                 #   localiser is already at 2-7 mm and 0.05 deg and nothing can improve it. Driving,
                 #   heading is 35x worse (p90 2.31 deg vs 0.066) — and bearing is precisely what a
                 #   corner measures well (0.019 px repeatability; a 0.7 px sigma is 0.09 deg). So
                 #   the question is whether p90/p99 of heading and position improve.
                 # ★ AND IT MAY LEGITIMATELY FAIL. The factor carries a MEASURED 27 mm bias: parked
                 #   with 4 corners it proposed a 26.6 mm correction where the true error was 2.0 mm.
                 #   That bias is a third of the driving p99. A result that improves the tail while
                 #   degrading the median is a TRADE, not a win, and must be reported as one.
                 # ★ chi2 CANNOT ADJUDICATE THIS. chi2_post is the residual after the pose absorbs
                 #   everything it can, so a pose bias is invisible to it by construction — 1.411
                 #   looked like a pass while the factor was 27 mm out. Only ground truth decides.
                 # Set back to false if the tail does not improve.

# ── WHICH FORM OF THE EVIDENCE THE FACTOR USES ──────────────────────────────────────────────────
# false = the per-sample contour residuals (~43 scalars/frame, each along its contour's normal).
# true  = TRIPLE POINTS: the floor-wall-wall corner as a 0-D feature, one 2-D residual per corner
#         with the covariance of the two-line intersection.
# ★ INSTEAD, never as well. A triple point is those same segment offsets re-expressed, so running
#   both would count the same photons twice.
#
# What the triple-point form buys, measured 2026-08-28:
#   * no aperture problem — a corner has two independent components, where a sample on a straight
#     edge has one by necessity (a 2-D residual there would fabricate a tangential constraint)
#   * a covariance that is CONSERVATIVE rather than optimistic: fixed-pose repeatability 0.019 px
#     (u) and 0.093 px (v) against a stated 0.692 and 0.213, i.e. 36x and 2.3x conservative
#   * accuracy checked two independent ways: 0.25 px against the rigid-shift fit, and ZED depth at
#     the DETECTED pixel flat at 1.00x the model's forward distance across 12.6-55.9 deg off axis
#   * post-fit chi2/dof 1.6-1.7, and ~5 mm / 0.08 deg of pose precision from just TWO corners
#
# ★★★ THREE OBJECTIONS I RAISED AGAINST IT WERE ALL WRONG, in the same way — judging a factor by
#   whether it can solve the pose ALONE rather than by what it contributes to a graph:
#     - "cond(H) = 530" was the RAW information matrix, which mixes metres and radians and is
#       unit-dependent. Correlation-normalised it is 97, and the posterior is 5.6 mm / 0.083 deg.
#       What it shows is STRUCTURE — corr(x,theta) ~ 0.98, the ordinary bearing-only ambiguity when
#       the visible corners sit ahead and clustered — with y determined independently.
#     - "31.5% of frames see only one corner" — a rank-2 constraint is a real contribution. A
#       factor adds J'WJ and J'Wr; it never has to be invertible on its own.
#     - "too few measurements to replace 43 samples" — in a multi-modal graph which landmarks are
#       visible changes frame to frame BY DESIGN. That is the premise, not a defect.
useTriplePoints = true

camera = "zed"            # DSR node name. "ricoh" selects the 360 equirect model; no code changes.

useWallCorners   = true   # bearing; nearly immune to mount pitch/height
useFloorJunction = true   # ★ RESTORED 2026-08-28 after PHASE 0 / TEST A. Result recorded here so the
                          # experiment is not repeated:
                          #   corners only -> chi2/dof 8.97 (baseline with both: 8.6). NO reduction,
                          #   so the residual excess is NOT specific to floor junctions and NOT
                          #   occlusion — which the empty room already implied, since there is
                          #   nothing in it to occlude.
                          # ⚠ WEAK EVIDENCE, stated as such: only 72 rows with sum_gamma ~1.16, and
                          # at nu~1 the spread of chi2/dof is ~140%.
                          # ★★ THE REAL FINDING OF THE TEST. Corners alone produced data on ~5% of
                          # cycles — 0.95 rows/s against a ~20 Hz localiser, versus ~every cycle with
                          # junctions on. This room has six polygon vertices and the ZED sees ~110
                          # degrees, so the camera is usually looking at a flat stretch of wall with no
                          # corner in it; the extraction then returns nothing and the shadow writes no
                          # row. The wall-corner channel — the bearing information the image genuinely
                          # adds, and the part immune to mount pitch — is simply not available most of
                          # the time here. The floor junction carries the term.

useWallCeiling   = false  # cluttered by lamps/ducts, and off the ZED's FoV at close range

# Arc-length spacing along each contour, in 3-D metres -- NOT in pixels. Uniform-in-pixels would
# concentrate samples at the near end, which is exactly where the height nuisance is weakest, and
# would silently reweight the estimator toward the least informative geometry.
sampleSpacingM = 0.10

# The normal search half-length is DERIVED per sample: sqrt(J*Sigma_pose*J' + shared nuisances +
# edge sigma), times this. It is a Gaussian truncation point, not a pixel constant, and it is
# TESTABLE as such: sweep 2/3/4 in shadow mode and the residual distribution and chi2_per_dof must
# not move. If they do, the inlier/outlier mixture is mis-specified -- fix that, not this number.
searchSigmas = 3.0
maxSearchPx  = 64         # a COMPUTE bound only; n_clamped in the CSV shows if it ever binds
maxSlots     = 1          # newest window slot only, like corners

# ── Shared-nuisance priors: how well the mount is known ──
# ★ THIS IS THE ONE THING THAT STOPS THE TERM SWAMPING THE LIDAR. N samples along one straight
#   junction are NOT N measurements: a line has 2 DOF and every sample on it shares camera pitch,
#   height, boresight yaw and the image/LiDAR time offset. Summed naively the term claims ~sqrt(N)
#   times the precision it has. These sigmas define the common-mode covariance that a Woodbury
#   marginalisation uses to cap ONE contour segment at roughly ONE nuisance-limited observation --
#   while leaving its internal near-vs-far contrast at full weight, which is real information.
#   They are PHYSICAL quantities, not tuning knobs. Widen them if the mount is less well known.
mountPitchSigma  = 0.0017   # rad (0.097 deg) — MEASURED 2026-08-26, down from 0.0035 (0.20 deg).
                        # 218 windows of the shadow monitor, of which 8 were well-conditioned
                        # (cond 19..47): pitch +0.102 deg median, +0.098 weighted, BETWEEN-WINDOW
                        # spread 0.099 deg. That spread is the honest sigma — the formal per-window
                        # figure was 0.0127 and is an eightfold overstatement, because samples along
                        # one junction share the mount they are being used to estimate.
                        # ★ WHY TIGHTENING MATTERS MORE THAN THE VALUE: this sigma scales the pitch
                        # NUISANCE COLUMN, h = sigma*fy ~ 2.45 px at the old value, which dominated
                        # the effective residual sigma and made the common-mode marginalisation
                        # discount the whole term by info_ratio ~1356. Halving it is what lets the
                        # RGB factor carry information at all; the term was weak BECAUSE the mount
                        # was uncertain, not because the camera is bad.
                        # ⚠ The EXTRINSIC IS NOT CORRECTED. +0.10 +/- 0.10 deg is consistent with
                        # zero at 1 sigma, so moving the mount on it would be acting on noise. If the
                        # well-conditioned windows keep landing near +0.10 as cond falls below ~20,
                        # revisit — but a correction the size of its own uncertainty is not one.
mountHeightSigma = 0.010    # m — LEFT ALONE, deliberately, and the measurement says why.
                        # The same 8 well-conditioned windows put the height error at -0.021 m with a
                        # spread of 0.017 — so the data thinks this prior is OPTIMISTIC, not tight.
                        # ⚠ But height is CONFOUNDED WITH THE FLOOR DATUM: a floor plane at the wrong
                        # z is geometrically indistinguishable from a camera at the wrong height, and
                        # this codebase has a known 3 cm floor-datum offset on record. -0.021 m is
                        # exactly that scale. Correcting the camera on this reading would bake a map
                        # error into the mount, so it stays until the floor datum is settled
                        # independently. Wall corners are what break the degeneracy: their image
                        # normal is horizontal, so pitch and height barely project onto them.
mountYawSigma    = 0.0035   # rad

# ── STAGE 2 RESULT, 2026-08-28: the camera against the LIDAR, with no pose in the residual ──
# The three priors above are now EMPIRICALLY JUSTIFIED rather than asserted, and the reading that
# justified them is pose-free. A room corner is seen by both sensors and is the same physical (x,y);
# CornerMatch::model_index and TriplePoint::vertex are both polygon vertex indices, so the pairing is
# a lookup, not a gated nearest-neighbour. CornerMatch::detected is in the ROBOT frame, so the LiDAR
# corner goes through the extrinsic ALONE and the localiser's pose never enters:
#     r = uv_image - project(cam_R_robot * p_robot + cam_t_robot)
# Verified in simulation that this is what it claims: with an injected heading bias of 0 / +0.15 /
# +0.30 / -0.30 deg, the old image-minus-MODEL estimate reads 0.856 / 1.006 / 1.156 / 0.556 deg while
# this one reads 0.8591 every time, against a truth of 0.8600.
#
# Measured over ~30 000 pairs:
#     residual u   +0.109 px  = +0.014 deg     <- mountYawCorrection below is COMPLETE
#     residual v   +0.071 px at 4-6 m          <- where 78% of the weight lives
#     pitch -0.052 deg, height +3.0 mm         <- both far INSIDE the priors above
#     chi2/dof 0.38                            <- the covariance model is CONSERVATIVE by ~1.6x
#     live cam height 1.0798 m vs the graph's 1.0800   <- recovered from the projections themselves
#
# ★★★ PITCH AND HEIGHT REMAIN ONE RIDGE, AND THAT IS STRUCTURAL — NOT A DRIVING PROBLEM.
#   rho held at -0.988 through a whole session including deliberate near-wall passes. The reason is
#   not the trajectory: a LiDAR corner's positional uncertainty projects through Pxy ~ fy/d, so a
#   fixed few-cm corner error subtends MORE pixels the closer you are. Measured share of total fit
#   weight by range: under 2 m = 0.00% (sigma_v 18-161 px), 4-6 m = 78% (sigma_v 1.1 px). The very
#   measurements that would separate a constant from an fy/d column are the ones this geometry makes
#   worthless. Driving closer cannot fix it, and it does not matter: the pair's COMBINATION is
#   -0.4 px / +3 mm, smaller than the term's own noise.
#
# ★★★ TWO ANALYSIS ERRORS THIS RESULT CORRECTS, both mine, both from trusting an unchecked source:
#   1. An UNWEIGHTED offline fit of rv ~ a + b(fy/d) reported height -42 mm. It handed full leverage
#      to close-range points whose own covariance declares them near-worthless. The agent's
#      accumulator weights by cov^-1 and sees +3 mm. The code was right; the check was not.
#   2. A "24 cm zed height inconsistency" against a Webots proto that is NOT the running world — the
#      same file says fieldOfView 2.09 and width 1920 while the live camera is 1.9198 and 1280.
#      p3bot.json's 1.08 is correct, confirmed to 0.2 mm from the live projections.

# ── MEASURED boresight-yaw correction, applied LOCALLY to the graph's camera<-robot extrinsic ──
# +0.814 +/- 0.022 deg, 2026-08-28. This is a physical angle, not a tuning knob: do not "adjust it
# until chi2 looks good".
#
# How it was measured. The old mount monitor fitted the along-normal residual on [1, fy/d] and read
# b_const = -0.15 +/- 0.11 px -- under 0.7 px of a 6.11 px r_rms -- which was mistaken for the mount
# being exonerated. It is not: the residual is SCALAR along each contour's OWN normal, so a rigid
# image displacement enters as t.n_hat, positive on some contours and negative on others, averaging
# to zero in a constant column. A second monitor in the basis that CAN see it (r ~ tx*nx + ty*ny)
# gave tx = 6.5 px with chi2_t = 1.25 -- a rigid shift explains the residual down to its noise.
#
# Boresight vs localiser heading produce an IDENTICAL shift; they were separated by joining 99
# windows against the Webots supervisor over ~20 poses:
#     correlation(tx, true heading error) = +0.816
#     tx - heading error                  = +0.832 deg, and FLAT across 7 heading bins (spread 0.058)
# Flat across heading is what makes it a boresight. Localiser heading error is separately ~0.18 deg
# sd and is healthy. The one stop reading tx ~ 0 was not an outlier: its heading error was -0.748
# deg, cancelling the boresight almost exactly.
#
# ★ WHY NOT widen mountYawSigma (0.0035 rad) to cover it: that makes chi2/dof fall to 1 by telling
#   the term to stop caring, and hands a real 0.8 deg error authority over the pose once drive=true.
# ★ WHY LOCAL and not in the robot geometry: the graph's RT is shared by every agent, so a wrong
#   sign here cannot propagate. Once confirmed, move it there and set this back to 0.
# ★ SIGN IS A PREDICTION, NOT A MEASUREMENT. Derived from the ZED convention (x-right, y-depth,
#   z-up) as delta = +tx/fx. If tx goes to ~0 the sign is right; if it goes to ~12.7 px it is
#   inverted and this becomes -0.01421.
mountYawCorrection = 0.01421   # rad (+0.814 deg)

csv = "etc/image_edge.csv"
