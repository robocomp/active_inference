
# --- Common Agent Data ---
[Agent]
id = 27  # ids 5-26 are taken; unique across the shared graph (CRDT actor id)
name = "self_calibration"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree = false
graph = false   # headless: the DSR node-link viewer is not needed by a calibration agent
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Period]
Compute = 20      # 50 Hz: wheel odometry is polled (no DSR signal), so the tick sets its sampling rate
Emergency = 500

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

# ── Agent-presence protocol (same keys and values as bottle_concept) ──────────
[Presence]
required_agent_names = ["robot_concept", "room_concept"]
config_dir = "etc"
monitor_period_ms = 500
heartbeat_timeout_ms = 25000
rejoin_grace_ms = 8000
stale_grace_ms = 120000
agent_info_period_ms = 1000

# Owned graph nodes torn down on shutdown / peer-loss. The agent node is "<name> <id>".
[Owns]
nodes = ["self_calibration 27"]

# ── Input layer (src/sensor_inputs.h) ─────────────────────────────────────────
[Inputs]
camera_rate_hz = 1.5     # zed rgb/depth + ricoh: COMPUTE budget (frames beyond it are drained, not converted)
stall_lidar_ms = 2000    # a stream silent this long is marked stalled + logged once; its data is not used
stall_camera_ms = 5000
stall_imu_ms = 1000
log_period_ms = 10000    # stream rates logged once per this period

[Harvester]
keyframe_spacing_s = 0.5   # COMPUTE budget (decimator), 0.5 s is the UPPER BOUND: 0.1-0.5 s leaves sigma stable, 1.0 s loses hairpin rotation (trajectory_harvester_test)
ring_span_s = 30.0         # COMPUTE budget: pairs are committed when the ring holds more than this
max_keyframes = 120
reg_sigma_m = 0.01         # ASSUMED scan-registration floor, to be replaced by Phase 0 data
odo_sigma_per_m = 0.002    # ASSUMED odometry error per metre
odo_sigma_per_rad = 0.005  # ASSUMED odometry error per radian rotated
wheel_rot_sigma_rel = 0.2   # wheel rotation over-reports ~41 % on Shadow: wide
wheel_rot_sigma_floor = 0.01
gyro_sigma_rel = 0.01
gyro_sigma_floor = 0.002

# ── LiDAR mount factors (src/lidar_mount_stage.*; plan Phase 3, moved from room_concept 2026-10-29) ──
# bpearl floor (roll, pitch, z), helios tilt (roll, pitch) from walls + ceiling, bpearl planar (x, y, yaw)
# relative to the published room polygon. ESTIMATE + LOG only (tmp/mount_factors/mounts_<ts>.csv).
# To PLANT a mount error in Webots, use robot_concept's overlay (etc/mount_calib_<robot>_webots.txt).
[MountFactors]
enabled = true
rate_hz = 2.0              # COMPUTE budget: sweeps fed per second per LiDAR (room_concept's BpearlMountRate)
pose_sigma_xy = 0.05       # m, WIDE per-sweep pose nuisance prior (never the localiser's own marginal)
pose_sigma_yaw_deg = 2.0   # deg
log_period_ms = 10000      # summary line + one mounts CSV row this often

# ── ZED floor plane (src/zed_floor_stage.*; plan Task 4.1): ESTIMATE + LOG ONLY ───────
# roll, pitch and z of the zed mount from the floor in its depth image (tmp/zed_floor/zed_floor_<ts>.csv).
# z includes the depth-scale error until 4.2; roll and pitch do not.
[ZedFloor]
enabled = true
rate_hz = 1.0              # COMPUTE budget: depth frames fed per second (Inputs.camera_rate_hz decimates upstream)
stride = 4                 # COMPUTE budget: every 4th pixel in u and v
log_period_ms = 10000      # summary line + one CSV row this often

# ── Helios planar mount (src/helios_mount_stage.*; plan Task 4.4): ESTIMATE + LOG ONLY ───────
[HeliosMount]
enabled = true
band_min_m = 1.5           # the 2-D wall band: room_concept's Media.lidar_high_min_height
band_max_m = 2.0           # room_concept's Media.lidar_high_max_height
gyro_bias_sigma = 0.002    # rad/s, prior on the common gyro bias (nuisance, marginalised by Schur)
gyro_scale_sigma = 0.01    # fractional prior on the common gyro scale (nuisance)
log_period_ms = 10000      # summary line + one mount CSV row this often

# ── Live dashboard window (src/specificworker_dashboard.cpp): DISPLAY ONLY ───────
[Dashboard]
show = true    # false: no window is built and nothing is fed (no cost)
