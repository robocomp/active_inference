
# --- Common Agent Data ---
[Agent]
id = 12 # MUST be unique across the shared graph: room=5 robot=6 retina=9 bottle=10 controller=11. A collision = CRDT actor-id clash → SIGSEGV.
name = "self_calibration"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree =false 
graph = true
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

# Self-calibration: subscribe to the arm camera's media plane (discovered from the
# DSR MediaDescriptor on this node) for the reprojection residual.
[SelfCalib]
camera_node = "zed"
residual_gate_m = 0.06   # depth inlier band (m): reject samples beyond this |pred−obs| (model breakdown / occlusion)
tau_vspread_min = 0.1    # min depth-velocity std (m/s) to report τ; below this τ is unseparable from bias (skip, don't print garbage)

# Probabilistic FK / predictive depth covariance — per-sample residual weight = 1/σ_d².
encoder_sigma_deg    = 0.02    # per-joint encoder σ (deg). Gen3 publishes no σ; seeded from repeatability 1mm@2σ. Swamped in sim; re-measure on HW (hold arm still, take per-joint std)
depth_sensor_sigma_m = 0.005   # base depth-sensor noise floor (m)
depth_sensor_range_k = 0.001   # depth noise grows ≈ k·range² (per m)
geom_sigma_m         = 0.008   # single-capsule model floor (m)
grazing_cos_min      = 0.2     # clamp on |ray·surface-normal|; grazing/silhouette samples inflate σ_geom up to 1/this (downweights unreliable edge samples)

# Information filter — belief on the T_body_arm correction δξ∈se(3), written from the depth residual.
filter_enabled       = true
model_sigma_m        = 0.020   # per-pose nuisance bias σ (m): the ±22mm config-dependent single-capsule model error, correlated within a pose
prior_sigma_trans_m  = 0.05    # extrinsic prior σ, translation (m) — how far the mount may be off; loose = let observable DOFs move
prior_sigma_rot_deg  = 5.0     # extrinsic prior σ, rotation (deg)
pose_min_dq          = 0.05    # min ‖Δq‖ (rad) for a frame to count as a NEW pose (viewpoint), so sitting still doesn't over-count
apply_filter_to_overlay = false # draw the self-projection skeleton with the CORRECTED extrinsic (zed_T_arm·Exp(dxi)) — toggle to test if dxi snaps the overlay onto the arm
# Validation (active-vs-passive): corrupt the working extrinsic by a KNOWN offset; the filter should recover δξ ≈ −offset on observable DOFs.
inject_tx_m          = 0.0
inject_ty_m          = 0.0
inject_tz_m          = 0.0
inject_rx_deg        = 0.0
inject_ry_deg        = 0.0
inject_rz_deg        = 0.0

[Period]
Compute = 100
Emergency = 500

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
