
# --- Common Agent Data ---
[Agent]
id = 27  # ids 5-26 are taken; unique across the shared graph (CRDT actor id)
name = "sensor_calibration"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree = false
graph = false   # headless: the DSR node-link viewer is not needed by a calibration agent
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Period]
Compute = 20      # 50 Hz: wheel odometry is polled (no DSR signal), so the tick sets its sampling rate
Emergency = 500

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

# ── Agent-presence protocol (same keys and values as bottle_concept) ──────────
[Presence]
required_agent_names = ["robot_concept", "room_concept"]
config_dir = "etc"
monitor_period_ms = 500
heartbeat_timeout_ms = 25000
rejoin_grace_ms = 8000
stale_grace_ms = 120000
agent_info_period_ms = 1000

# Owned graph nodes torn down on shutdown / peer-loss. The agent node is "<name> <id>".
[Owns]
nodes = ["sensor_calibration 27"]

# ── Input layer (src/sensor_inputs.h) ─────────────────────────────────────────
[Inputs]
camera_rate_hz = 1.5     # zed rgb/depth + ricoh: COMPUTE budget (frames beyond it are drained, not converted)
stall_lidar_ms = 2000    # a stream silent this long is marked stalled + logged once; its data is not used
stall_camera_ms = 5000
stall_imu_ms = 1000
log_period_ms = 10000    # stream rates logged once per this period

[Harvester]
keyframe_spacing_s = 0.5   # COMPUTE budget (decimator), 0.5 s is the UPPER BOUND: 0.1-0.5 s leaves sigma stable, 1.0 s loses hairpin rotation (trajectory_harvester_test)
ring_span_s = 30.0         # COMPUTE budget: pairs are committed when the ring holds more than this
max_keyframes = 120
reg_sigma_m = 0.01         # ASSUMED scan-registration floor, to be replaced by Phase 0 data
odo_sigma_per_m = 0.002    # ASSUMED odometry error per metre
odo_sigma_per_rad = 0.005  # ASSUMED odometry error per radian rotated
wheel_rot_sigma_rel = 0.2   # wheel rotation over-reports ~41 % on Shadow: wide
wheel_rot_sigma_floor = 0.01
gyro_sigma_rel = 0.01
gyro_sigma_floor = 0.002
