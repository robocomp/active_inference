
# --- Common Agent Data ---
[Agent]
id = 7 # Change id
name = "table_concept"

# --- Single Instance Configuration ---
# Use this if you only have one graph.
configFile = ""
domain = 0
tree = false
graph = true
2d = false
3d = false

# --- Multiple Instance Template ---
# If you define multiple instances, the single instance config above will be ignored.
# [Agent.instance_name]
# configFile = ""
# domain = 1
# tree = true
# graph = true
# 2d = true
# 3d = true

[Presence]
required_agent_names = ["robot_concept", "room_concept"]
config_dir = "etc"
monitor_period_ms = 500
heartbeat_timeout_ms = 3000
rejoin_grace_ms = 1500
stale_grace_ms = 120000
agent_info_period_ms = 1000

[Owns]
# "table*" matches every table this agent births/scaffolds (table_1, table_2, …) so none survive a
# restart as a stale node (mirrors bottle_concept owning "bottle*").
nodes = ["table_concept 7", "table*"]

[Period]
Compute = 100
Emergency = 500

[Component.Debug]
Verbose = false

[TableModel]
LambdaSize = 0.05         # weaker KL pull on w/h/height so evidence can expand the table model
PriorSizeStd = 0.60       # broader 1-sigma size prior (m); higher means weaker size prior
RobustLoss = "geman_mcclure"   # SOFT redescending (never zeroes a far point's gradient/Fisher, unlike
                            # tukey/welsch) so a dense, consistent far edge is NOT discarded — robustness
                            # rejects sparse outliers, not structure. The mixture-equivalent likelihood.
RobustLossScale = 0.10      # SDF residual scale in meters where robust losses start to saturate
EvidenceSigmaM = 0.12       # inlier width for model-evidence ρ (mean exp(−½(SDF/σ_ρ)²) over the mask):
                            # a box too small → mask far outside → low ρ → belief precision loosens → grows
MaskPrecision = 0.30        # RGB-mask silhouette term weight: back-projects the 2D table contour and
                            # pulls the model onto it (constrains occluded faces + yaw). 0 disables.
MaskSilhouetteSamples = 8   # >0 = height-agnostic occluding-contour (samples/ray vs box+legs SDF);
                            # 0 = legacy table-top-plane intersection (top rectangle only).
RobustGncStartScale = 0.80  # GNC: wide initial robust scale, annealed to RobustLossScale across the
                            # optimizer iters so a half-offset table still produces gradient during
                            # coarse alignment. Set <= RobustLossScale to disable annealing.
RobustGncDecayCycles = 20   # GNC start scale ramps from RobustGncStartScale down to RobustLossScale
                            # over this many compute cycles, then anneals off so the converged pose
                            # stops being re-widened each frame and can settle. 0 = no lifetime decay.
ExtentPctLo = 0.05          # lower percentile of the point span the footprint-extent term pins w/h to
ExtentPctHi = 0.95          # upper percentile (tighter pair trims the depth-noise margin past the true edge)
ReopenExtentMarginM = 0.08  # re-open a converged fit when the observed span exceeds the model by > this
                            # (the mask-beyond-RFE / FE-stuck case — point residuals had no re-open path)

[TableConcept]
ObsDistance = 1.8           # comfortable maximum stand-off from the target face for epistemic poses
DeltaMin = 20.0             # minimum per-face coverage before stopping epistemic proposals
EpistemicCooldownCycles = 200 # min cycles a satisfied table stays withdrawn (anti-chatter)
VoxelBankMaxPoints = 4000   # max number of table-owned voxels kept in memory
VoxelBankQuantizationM = 0.02 # dedup grid (m) for voxel-bank hashing
VoxelSelectRadiusMarginM = 0.50 # per-table XY ownership gate margin for mixed proto-tables
VoxelSelectHeightMarginM = 0.25 # extra Z margin above table height when selecting owned voxels
TopBandGate = true          # gate fit/extent points to ±TopBandM of the table-top height (drops floor/clutter that inflates w/h)
TopBandM = 0.08             # half-width (m) of the top-surface membership band

[WarmStart]
PtsMin = 12.0            # point count where observability starts to become trustworthy
PtsMax = 30.0            # point count where the point-count confidence saturates
ConfidenceDecay = 0.55            # how quickly the higher-level confidence state forgets old evidence
ConfidenceCoverageGain = 1.00     # how much coverage evidence raises confidence
ConfidenceResidualGain = 0.25     # how much unexplained residuals raise confidence
FisherInfoDecay = 0.95            # A/B (2026-06-27): was 0.99. Lowered to a ~20-frame window — the 0.99 ceiling
                                  # over-accumulated (raw info ~14k) and locked the fit at w≈1.13 while the point
                                  # extent says ~1.35 (the "static + large residuals" symptom). Restore 0.99 once
                                  # the fit converges, with a CUSUM barrier that actually yields to real evidence.
# Quality-aware maturity (always on): a CLOSE approach after far glimpses re-opens the fit (rescales the
# stale far-view "views" down) instead of staying locked at the misrepresented far fit — the fix for
# "first seen far → bad fit → approaching can't re-fit".
FisherPeakDecay = 1.0             # quality-bar slow forgetting (1 = non-decaying)
# Re-open only on a GENUINELY better view: a view must beat the quality bar by ≥ Ratchet× to ratchet it
# (and rescale the accumulated views), folding the new high in as an EMA. Stops ordinary per-frame obs
# flutter (orders of magnitude) from constantly re-opening a DOF → fixes the width wander. Higher = stiffer.
FisherPeakRatchet = 2.5
FisherPeakEma = 0.30
FisherProcessStdM = 0.005        # calibrated-cov predict: process-noise std per fresh frame for length DOFs (m) → std floor
FisherProcessStdYaw = 0.01       # calibrated-cov predict: process-noise std per fresh frame for yaw (rad)
FisherCsvPath = "etc/fisher_filter_log.csv"   # per-cycle evolution log for plotting (empty = off)
# FE-spike guard (2026-06-27): drop a FRESH frame whose raw-fit FE is ≫ the instance's running FE level —
# a contaminated point set (clutter / partial-or-wrong mask, extent blows up, FE ~20× vs ~1) the model
# can't explain. Skips the acceptance (keeps the belief) so the gate can't unlock onto garbage → kills the
# residual size wander at the source. Baseline is an EMA over ACCEPTED frames only.
BadFitFeRatio = 4.0              # reject a fresh frame if raw_fe > this × baseline (lower = stricter)
FeBaselineEma = 0.10            # EMA weight for the accepted-FE running baseline
# Size RATCHET (2026-06-27): a table is rigid — a size DOF grows at full gain but SHRINKS at gain×this.
# A far/occluded partial view shows a small visible extent but is NOT evidence the table is smaller, so it
# must not collapse the box ("shrank to a third across the room"). Small=strong ratchet; 1.0=symmetric(off).
SizeShrinkGain = 0.05
# Sequential change-detector (CUSUM/SPRT) on top of the Kalman gain (always on): an isolated surprising
# mask is rejected per-DOF (gain→0), and only a COHERENT same-direction run of surprise unlocks the DOF
# and snaps it to the new evidence — stops a lone noisy mask from nudging a settled fit. Tunings below.
CounterEvidenceBandM = 0.02       # length-DOF surprise deadband (m): innovations within this are "coherent"
CounterEvidenceBandRad = 0.05     # yaw surprise deadband (rad)
# Barrier = base + lambda·views, SPLIT position (cx,cy) vs size/shape so the table CENTRE locks harder
# than its extents (position drifts one-sided with robot localisation → it was unlocking ~3× more than w/h).
CounterEvidenceBasePos = 6.0      # position barrier floor (excess-bands) — centre heavily locked
CounterEvidenceLambdaPos = 1.0    # extra position barrier per accumulated equivalent-view
CounterEvidenceBaseSize = 1.5     # A/B retune (2026-06-27): was 3.0. Lower barrier so a REAL sustained size
                                  # change unlocks in a few frames (the 0.99/3.0 combo froze the fit 20 cm under).
CounterEvidenceLambdaSize = 0.2   # A/B retune: was 0.5. Per-view barrier growth softened so a well-observed DOF
                                  # still re-adapts to genuine evidence instead of hard-locking.
# Yaw decoupled with its OWN high barrier (2026-06-28): a static rectangle's orientation is its most rigid
# property; it was unlocking (ceg_yaw=1) and rotating the table after minutes. Hard to unlock now.
CounterEvidenceBaseYaw = 12.0     # yaw barrier floor (excess-bands) — heavily locked vs the size group's 1.5
CounterEvidenceLambdaYaw = 1.0    # extra yaw barrier per accumulated equivalent-view
YawObsAspectRef = 0.12            # yaw gain scales with |w−h|/max(w,h)/this → a near-square table freezes yaw
CounterEvidenceDecay = 0.8        # per-coherent-frame pay-down of the accumulator (evidence FOR the belief)
CounterEvidenceUnlockDeflate = 0.3  # on unlock, multiply that DOF's accumulated info by this (concede the old estimate)
CounterEvidenceStepCap = 3.0      # A/B retune (2026-06-27): was 1.0. A sustained 3-4 frame run now clears the
                                  # (lowered) barrier, but ONE outlier frame still can't — kills the gate-off wander.
# YOLO mask-score weighting: w = clamp01((score−floor)/(ref−floor))^power. IMPORTANT: a partially-viewed
# table scores LOW (~0.3–0.45 here), so floor/ref must sit in that band — floor too high nukes every mask
# (w=0 → the Fisher accumulator dies → no maturity stiffening → UNSTABLE, the bug just fixed). Tune to
# your detector: floor just above the noise score, ref at a confident score (mask-conf weighting is always on).
MaskConfFloor = 0.2               # score at/below which the mask is ~ignored
MaskConfRef = 0.5                 # score at/above which the mask is fully trusted (w=1)
MaskConfPower = 2.0               # steepness of the trust ramp between floor and ref
RtCovScale = 1.0                  # var = RtCovScale / fisher_info_raw; calibrate toward NEES≈1 (raw curvature over-counts correlated points), like bottle CovEffScale

[SampleQueue]
# RFE anchors are binned over a yaw-aware xy-GRID of the table footprint (2026-06-27, was angle/z — a
# cylinder leftover that lumped centre+edge points and never pinned w/h). NumAngleBins=x divisions,
# NumZBins=y divisions; raise for finer footprint sampling. Capacity = NumAngleBins·NumZBins·MaxPerBin.
NumAngleBins = 24         # x-grid divisions of the footprint
NumZBins = 16             # y-grid divisions (raised from 10 → ~symmetric cell size with x)
MaxPerBin = 2             # anchors kept per xy-cell
MaxNewPointsPerFrame = 40 # anchors admitted per frame — fill the grid fast (was 30)
RfeWeightGain = 0.25      # lower than 1.0 keeps historical RFE anchors influential
MinAnchorWeight = 0.12    # floor for anchor weight in optimization/coverage

[Tracker]
# Multi-instance birth/associate/merge (shared rc::InstanceTracker; the only instance-lifecycle path —
# prior-scaffold + greedy nearest-mask were removed in Stage 2). "table" masks are associated to instances
# by a covariance-gated global 1-to-1; an unexplained mask spawns a new table; overlapping tables merge
# (two can't share space); death is OFF (a long occlusion is not absence — DeathEnabled to restore it).
GateMahalanobis = 9.0     # χ²₂ gate (~3σ) for a mask↔instance match once it has a cov
GateFallbackM = 0.50      # metric XY gate (m) before an instance has a usable covariance
DetectionNoiseM = 0.35    # det-noise std R added to fit cov in the gate (S=P+R²I): covers the mask-centroid
                          # vs fitted-centre offset of a partially-viewed table (~0.2–0.5 m), else the
                          # overconfident fit rejects its own detection. Tables are far apart → safe.
BirthFrames = 8           # frames a mask must stay unexplained before spawning a table
DeathFrames = 300         # (only if DeathEnabled) frames unobserved before retirement (~30 s @ 100 ms)
DeathEnabled = false      # OFF: a table is rigid persistent furniture — a long occlusion is not absence.
                          # Removal is by the MERGE operator ONLY (two tables can't share space).
BirthMinSepM = 0.60       # a birth must be ≥ this (m) from every existing table (anti-duplicate)
MergeOverlap = 0.30       # physical exclusion: collapse two instances whose oriented footprints overlap by
                          # ≥ this fraction of the smaller footprint (two tables cannot share space). 0=off.
BirthWidthM = 1.0         # default geometry for a table BORN from a mask (the fit refines from here)
BirthDepthM = 0.6
BirthHeightM = 0.75
BirthSizeStd = 0.15       # prior PRECISION (size std, m) behind the Birth* dims: pins the size near
                          # standard furniture under weak early views (smaller = stiffer). Without it a
                          # born table uses the loose generic prior and the first partial mask reshapes it.
NllCost = false           # association cost = ½(m²+ln|S|) NLL (compete by likelihood, not raw distance)
                          # vs raw squared-Mahalanobis. Gate is m² either way. Matters under clutter.

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
