# object_priors.toml
#
# Prior toilet definitions for the toilet_concept agent.
# Each [[toilets]] entry is checked at startup; if the node named `node_name`
# is absent from the DSR graph it is created with the given geometry.

[[toilets]]
node_name  = "toilet_1"
width_m    = 1.5          # Prior toilet width  (X axis in toilet frame)
depth_m    = 1.4          # Prior toilet depth  (Y axis in toilet frame)
height_m   = 0.75         # Prior toilet-top height from floor
room_x_m   = 3.5          # Initial room-frame X (will be refined by active inference)
room_y_m   = 1.2          # Initial room-frame Y
yaw_rad    = 0.0          # Initial heading
sigma_pose = 0.1          # Prior uncertainty on position (m) — used by KL regulariser
sigma_size = 0.60         # Prior uncertainty on dimensions (m)
