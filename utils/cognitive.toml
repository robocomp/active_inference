# Cognitive stack for the heterogeneous AASG run (launch with: python3 cognitive.py cognitive.toml)
# Assumes the sensorimotor base is already up (python3 subcognitive.py sub.toml) and Webots has the
# desired world open (e.g. hallway_and_beta_noe.wbt: 28 chairs, 26 tables, 6 bottles).
#
# Launch order follows the DSR dependency graph (required_agent_names):
#   robot_concept (bootstraps the graph from shadow.json) -> room_concept -> voxelizer
#   -> table_concept / chair_concept -> bottle_concept (needs voxelizer) -> controller (last).
# The per-agent required_agent_names gate keeps them correct even if they come up nearly together.

[[components]]
name = "robot_concept"
cwd  = "~/robocomp/components/active_inference/robot_concept"
cmd  = "bin/robot_concept etc/config.toml"

[[components]]
name = "room_concept"
cwd  = "~/robocomp/components/active_inference/room_concept"
cmd  = "bin/room_concept etc/config_beta.toml"          # noe world: swap to etc/config_noe.toml if the room layout differs

[[components]]
name = "voxelizer"
cwd  = "~/robocomp/components/active_inference/voxelizer"
cmd  = "bin/voxelizer etc/config.toml"             # YOLO26l-seg -> mask_* attributes (table/chair/bottle) onto the DSR graph

[[components]]
name = "table_concept"
cwd  = "~/robocomp/components/active_inference/table_concept"
cmd  = "bin/table_concept etc/config.toml"         # FE+variance log -> etc/fisher_filter_log.csv

[[components]]
name = "chair_concept"
cwd  = "~/robocomp/components/active_inference/chair_concept"
cmd  = "bin/chair_concept etc/config.toml"         # FE+variance log -> etc/fisher_filter_log.csv

[[components]]
name = "bottle_concept"
cwd  = "~/robocomp/components/active_inference/bottle_concept"
cmd  = "bin/bottle_concept etc/config.toml"        # FE+variance log -> etc/bottle_fisher_log.csv

[[components]]
name = "controller"
cwd  = "~/robocomp/components/active_inference/controller"
cmd  = "bin/controller etc/config.toml"
