# Cognitive stack for the real Shadow robot (launch with: python3 cognitive.py cognitive_real.toml)
# Assumes the sensorimotor base is already up (python3 subcognitive.py sub_real.toml).
#
# Launch order follows the DSR dependency graph (required_agent_names):
#   robot_concept (bootstraps the graph from shadow.json) -> room_concept -> retina
#   -> table_concept / chair_concept -> bottle_concept (needs retina) -> controller (last).
# The per-agent required_agent_names gate keeps them correct even if they come up nearly together.

[[components]]
name = "robot_concept"
cwd  = "~/robocomp/components/active_inference/robot_concept"
cmd  = "bin/robot_concept etc/config_shadow.toml"

[[components]]
name = "room_concept"
cwd  = "~/robocomp/components/active_inference/room_concept"
cmd  = "bin/room_concept etc/config_apartamento.toml"          # noe world: swap to etc/config_noe.toml if the room layout differs

[[components]]
name = "imu_fusion"
cwd  = "~/robocomp/components/robocomp-shadow/agents/imu_fusion"
cmd  = "bin/imu_fusion etc/config"         

