[[components]]
name = "bridge"
cwd = "~/robocomp/components/webots-p3bot/components/p3bot-bridge"
cmd = "bin/P3BotBridge etc/config.toml"
ice_name = "p3botbridge:tcp -h localhost -p 10006"

[[components]]
name = "zed"
cwd = "~/robocomp/components/robocomp-robolab/components/hardware/camera/zed_camera"
cmd = "bin/zed_camera etc/config_webots.toml"
ice_name = "camerargbdsimple:tcp -h localhost -p 15009"


[[components]]
name = "camera360"
cwd = "~/robocomp/components/robocomp-robolab/components/hardware/camera/ricoh_omni_dds"
cmd = "bin/ricoh_omni_dds etc/config_webots.toml"
ice_name = "camera360rgb:tcp -h localhost -p 10097"

[[components]]
name = "helios"
cwd = "~/robocomp/components/robocomp-robolab/components/hardware/laser/lidar3d_dds"
cmd = "bin/lidar3d_dds etc/config_helios_webots"
ice_name = "lidar3d:tcp -h localhost -p 10098"

# Bridges the Webots IMU (bridge's Endpoints.IMU = 10007) onto the DDS media plane
# (domain 7, rc/imu/data). robot_concept adopts it via Proxies.MediaPlaneDDS4 and then
# stops bridging the IMU itself. ice_name pings its MediaPlaneDDS descriptor endpoint.
[[components]]
name = "imu"
cwd = "~/robocomp/components/robocomp-robolab/components/hardware/imu/imu_dds"
cmd = "bin/imu_dds etc/config.toml"
ice_name = "mediaplanedds:tcp -h localhost -p 11891"


[[components]]
name = "joy"
cwd = "~/robocomp/components/robocomp-robolab/components/hardware/external_control/python_xbox_controller"
cmd = "bin/python_xbox_controller etc/config"
ice_name = "python_xbox_controller:tcp -h localhost -p 11230"
